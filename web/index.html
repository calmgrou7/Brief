<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정우회 회원 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --ink:#1b2333; --sub:#5d6b82; --line:#e3e8f0;
  --brand:#1f3a68; --brand-2:#2f5ea8; --accent:#c8a24a; --soft:#eef3fb;
  --ok:#2e7d5b; --warn:#b5543a; --radius:12px; --shadow:0 1px 3px rgba(20,30,50,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px}
a{color:var(--brand-2);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--brand);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}
.logo{font-weight:700;font-size:20px;letter-spacing:.5px;margin:4px 8px 22px}
.logo small{display:block;font-weight:400;font-size:12px;opacity:.7;margin-top:2px}
nav a{display:flex;gap:10px;align-items:center;color:#dfe7f5;padding:10px 12px;border-radius:8px;margin-bottom:2px}
nav a:hover{background:rgba(255,255,255,.08)}
nav a.on{background:#fff;color:var(--brand);font-weight:700}
main{padding:24px 28px;max-width:1280px;width:100%;min-width:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:22px;margin:0}
h2{font-size:16px;margin:0 0 12px}
.muted{color:var(--sub)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr)}
.two{grid-template-columns:3fr 2fr}
.kpi .n{font-size:28px;font-weight:700;color:var(--brand)}
.kpi .l{color:var(--sub);font-size:13px}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--warn)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.input,select.input,textarea.input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;min-width:0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--sub);font-weight:500;background:var(--soft)}
tr.click{cursor:pointer} tr.click:hover td{background:#fafcff}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--soft);color:var(--brand-2)}
.tag.off{background:#fbf3e2;color:#8a6a1c}
.tag.gray{background:#f0f1f4;color:#6b7280}
.nbadge{background:#e0533d;color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;margin-left:auto}
.kpi.link{cursor:pointer;transition:border-color .15s, transform .15s}
.kpi.link:hover{border-color:var(--brand-2);transform:translateY(-2px)}
.bar[data-month]{cursor:pointer} .bar[data-month]:hover i{background:var(--accent)}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap} th.sortable:hover{color:var(--brand-2)}
th.sortable .ar{font-size:10px;margin-left:3px;opacity:.35} th.sortable.on .ar{opacity:1;color:var(--brand-2)}
@media print{ aside, .no-print, .head .row, #modal-root{display:none !important} .app{display:block} main{padding:0;max-width:none} .panel{box-shadow:none;break-inside:avoid} body{background:#fff} }
.tag.new{background:#e7f6ee;color:#1e7a4c;font-weight:700}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;color:var(--brand);font-weight:700;flex:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;box-shadow:var(--shadow)}
.mcard:hover{border-color:var(--brand-2)}
.mcard .av{width:56px;height:56px;font-size:20px}
.bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar i{display:block;width:100%;max-width:44px;background:var(--brand-2);border-radius:6px 6px 0 0}
.bar b{font-size:13px;margin-bottom:4px}
.bar span{font-size:12px;color:var(--sub);margin-top:6px}
.rank li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.rank{list-style:none;margin:0;padding:0}
.meter{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--sub);border:1px dashed var(--line);border-radius:var(--radius)}
/* profile card */
.profile{max-width:720px}
.pc-top{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc-img{aspect-ratio:3/3.4;border:1px solid var(--line);border-radius:10px;background:var(--soft);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.pc-img img{width:100%;height:100%;object-fit:cover}
.pc-cap{text-align:center;font-weight:700;font-size:20px;padding:8px 0}
.pc-card{border:1px solid var(--line);border-radius:10px;min-height:140px;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:12px;color:var(--sub)}
.pc-card img{width:100%;display:block}
.pc-table{width:100%;margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pc-table th{background:var(--soft);width:120px;text-align:center;color:var(--ink);font-weight:700}
.pc-table td{font-size:15px}
.prod{color:#1d4fd1;font-weight:700}
/* timeline */
.tl{border-left:3px solid var(--line);margin-left:8px;padding-left:18px}
.tl .it{position:relative;padding:8px 0 14px}
.tl .it:before{content:"";position:absolute;left:-26px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff}
.tl .it.future:before{background:#fff;border:2px solid var(--brand-2)}
.tl .when{display:inline-block;min-width:92px;color:var(--sub);font-variant-numeric:tabular-nums}
.tl .desc{color:var(--sub);margin-top:6px;white-space:pre-wrap;line-height:1.6;font-size:14px}
.tl-today{position:relative;margin:2px 0 10px -18px;padding-left:18px;font-size:12px;color:var(--warn);font-weight:700}
.tl-today:before{content:"";position:absolute;left:-6px;top:50%;width:calc(100% + 6px);border-top:1px dashed var(--warn)}
.tl-today span{position:relative;background:var(--panel);padding-right:8px}
/* tree */
.tree ul{list-style:none;margin:0;padding-left:22px;border-left:1px dashed var(--line)}
.tree>ul{border:none;padding-left:0}
.tree li{padding:4px 0}
/* modal */
.mask{position:fixed;inset:0;background:rgba(15,23,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:22px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
.form .full{grid-column:1/-1}
.toast{position:fixed;top:16px;max-width:calc(100% - 32px);text-align:center;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;z-index:30;font-size:14px}
body.gate aside{display:none} body.gate .app{grid-template-columns:minmax(0,1fr)}
.gate-box{max-width:400px;margin:12vh auto 0}
#who{margin-top:24px;padding:12px;border-top:1px solid rgba(255,255,255,.15);font-size:12px;color:#c9d5ea;word-break:break-all}
#who button{margin-top:8px;background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.input:disabled{background:#f3f4f6;color:#8a93a3}
pre.text{white-space:pre-wrap;background:var(--soft);padding:12px;border-radius:8px;margin:8px 0;font-family:inherit}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:static;height:auto;padding:12px}
  .logo{margin:0 6px 10px}
  nav{display:flex;overflow-x:auto;gap:4px}
  nav a{white-space:nowrap;margin:0}
  #who{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;padding:8px 6px 0}
  #who button{margin-top:0}
  main{padding:16px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .hide-m{display:none}
  .pc-table th{width:72px;font-size:13px;padding:8px 4px}
  .pc-table td{word-break:keep-all;padding:8px 6px}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo">정우회<small>기업가 대표 모임</small></div>
    <nav id="nav"></nav>
    <div id="who"></div>
  </aside>
  <main id="view"></main>
</div>
<div id="modal-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* =========================================================
   데이터 계층 — Supabase
   (dongne-expert 프로젝트 안의 jw_ 테이블 / jw-media 저장소)
   anon 키는 공개용 키입니다. 실제 접근 권한은 DB의 RLS 정책이 막습니다.
   ========================================================= */
const SUPABASE_URL = 'https://ltnwbinctflmczqnhuii.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0bndiaW5jdGZsbWN6cW5odWlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxMzkwMjUsImV4cCI6MjEwOTcxNTAyNX0.UL6jWktHRze0K6W6cw21uaoRp3i2lgVIe7aAAV_g5gg';
const BUCKET = 'jw-media';
/* 접속 방식 3가지
   1) 회원 로그인: 이름 + 비밀번호(처음엔 휴대폰 뒷 4자리) → 로그인 토큰을 헤더(x-jw-member)로 보냄
      → 회원명부 열람 + 본인 정보 수정 (임원이면 비밀번호 초기화 등 임원 기능)
   2) 관리자 접속 코드: 코드를 헤더(x-jw-key)로 보내면 DB가 관리자 권한으로 판정
   3) 이메일 로그인 링크: 회원별 권한 (선택 사항) */
const KEY_STORE = 'jungwoo-access-code';
const readKey = () => { try{ return localStorage.getItem(KEY_STORE) || ''; }catch(e){ return ''; } };
const writeKey = v => { try{ v ? localStorage.setItem(KEY_STORE, v) : localStorage.removeItem(KEY_STORE); }catch(e){} };
const MEMBER_STORE = 'jungwoo-member-token';
const readMemberToken = () => { try{ return localStorage.getItem(MEMBER_STORE) || ''; }catch(e){ return ''; } };
const writeMemberToken = v => { try{ v ? localStorage.setItem(MEMBER_STORE, v) : localStorage.removeItem(MEMBER_STORE); }catch(e){} };
function makeClient(key, memberToken){
  const headers = key ? {'x-jw-key':key} : memberToken ? {'x-jw-member':memberToken} : null;
  return headers
    ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {global:{headers},
        auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false, storageKey: key ? 'jungwoo-key-mode' : 'jungwoo-member-mode'}})
    : supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'implicit', storageKey:'jungwoo-auth'}});
}
let keyMode = !!readKey();
let memberMode = !keyMode && !!readMemberToken();
let sb = makeClient(readKey(), keyMode ? '' : readMemberToken());

const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{ const r=Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));

function blankMember(name){
  return {id:'', name, birthYear:'', company:'', title:'', products:'', industry:'',
    phone:'', email:'', address:'', website:'', joined:'', guardianId:'', status:'active', memo:'',
    photo:'', companyImage:'', cardImage:'', photoPath:'', companyImagePath:'', cardImagePath:'', isFounder:false, isNew:false, rosterNo:'', intro:''};
}

const IMG_KEYS = {photo:'photoPath', companyImage:'companyImagePath', cardImage:'cardImagePath'};
const fromMember = r => ({id:r.id, name:r.name, birthYear:r.birth_year||'', company:r.company||'', title:r.title||'',
  products:r.products||'', industry:r.industry||'', phone:r.phone||'', email:r.email||'', address:r.address||'', website:r.website||'',
  joined:r.joined||'', guardianId:r.guardian_id||'', status:r.status||'active', memo:r.memo||'',
  photoPath:r.photo_path||'', companyImagePath:r.company_image_path||'', cardImagePath:r.card_image_path||'',
  photo:'', companyImage:'', cardImage:'', isFounder:!!r.is_founder, isNew:!!r.is_new, rosterNo:r.roster_no ?? '', intro:r.intro||''});
const toMember = m => ({name:m.name, birth_year:m.birthYear||'', company:m.company||'', title:m.title||'',
  products:m.products||'', industry:m.industry||'', phone:m.phone||'', website:(m.website||'').trim(), email:(m.email||'').trim().toLowerCase(),
  address:m.address||'', joined:m.joined||'', guardian_id:m.guardianId||null, status:m.status||'active', memo:m.memo||'',
  photo_path:m.photoPath||'', company_image_path:m.companyImagePath||'', card_image_path:m.cardImagePath||'',
  is_founder:!!m.isFounder, is_new:!!m.isNew, intro:m.intro||''});
const fromTerm = r => ({id:r.id, memberId:r.member_id, positionId:r.position_id, start:r.started_on, end:r.ended_on||''});
const fromEvent = r => ({id:r.id, title:r.title, category:r.category||'', date:r.event_date, location:r.location||'',
  host:r.host_id||'', attendees:r.attendees ?? '', text:r.body||'', docs:r.docs||[], memo:r.memo||''});
const toEvent = e => ({title:e.title, category:e.category||'', event_date:e.date, location:e.location||'',
  host_id:e.host||null, attendees:(e.attendees===''||e.attendees==null) ? null : +e.attendees,
  body:e.text||'', docs:e.docs||[], memo:e.memo||''});
const fromHistory = r => ({id:r.id, date:r.happened_on, title:r.title, desc:r.description||'', source:r.source, created:r.created_at||''});
const toHistory = h => ({happened_on:h.date, title:h.title, description:h.desc||'', source:h.source||'manual'});

/* Supabase 호출 결과에서 오류를 토스트로 알리고 예외로 던짐 */
async function q(p){
  const {data, error} = await p;
  if(error){ toast('오류: ' + (error.message || error)); throw error; }
  return data;
}

const Store = {
  ready:false,
  db:{members:[], positions:[], terms:[], events:[], history:[], applications:[]},
  me:{email:'', admin:false, officer:false, memberId:''},
  async loadMe(){
    const {data:{user}} = await sb.auth.getUser();
    const [admin, memberId, officer] = await Promise.all([
      q(sb.rpc('jw_is_admin')), q(sb.rpc('jw_my_member_id')), q(sb.rpc('jw_is_officer'))]);
    this.me = {email:user?.email||'', admin:!!admin, officer:!!officer, memberId:memberId||''};
  },
  async load(){
    const [ms, ps, ts, es, hs] = await Promise.all([
      q(sb.from('jw_members').select('*')),
      q(sb.from('jw_positions').select('*').order('sort_order')),
      q(sb.from('jw_terms').select('*')),
      q(sb.from('jw_events').select('*')),
      q(sb.from('jw_history').select('*'))]);
    this.db = {members:ms.map(fromMember),
      positions:ps.map(r=>({id:r.id, name:r.name, single:r.single, order:r.sort_order})),
      terms:ts.map(fromTerm), events:es.map(fromEvent), history:hs.map(fromHistory), applications:[]};
    this.db.bylaws = null; this.db.budgets = {years:{}};
    try{   // 회칙·예산안 (공용 설정 저장소)
      const {data} = await sb.from('jw_templates').select('key,data').in('key', ['bylaws','budgets']);
      (data||[]).forEach(r=>{ if(r.key === 'bylaws') this.db.bylaws = r.data; if(r.key === 'budgets') this.db.budgets = {years:{}, ...r.data}; });
    }catch(e){ console.warn('회칙·예산안을 불러오지 못했습니다', e); }
    this.db.finance = [];
    try{   // 재무보고 (표가 없거나 실패해도 나머지 화면은 열리도록)
      const {data, error} = await sb.from('jw_finance').select('*');
      if(!error) this.db.finance = (data||[]).map(fromFinance);
      const fp = this.db.finance.flatMap(f=>f.images);
      if(fp.length){
        const {data:su} = await sb.storage.from(BUCKET).createSignedUrls(fp, 60*60*12);
        const map = Object.fromEntries((su||[]).filter(x=>x.signedUrl).map(x=>[x.path, x.signedUrl]));
        this.db.finance.forEach(f=>f.images.forEach(pth=>{ if(map[pth]) f.imageUrls[pth] = map[pth]; }));
      }
    }catch(e){ console.warn('재무보고를 불러오지 못했습니다', e); }
    this.db.pwStates = {};
    if(this.me.officer){  // 비밀번호 상태 (회원 로그인 기능이 설치된 경우)
      try{ const {data} = await sb.rpc('jw_password_states'); (data||[]).forEach(r=>this.db.pwStates[r.member_id] = r); }catch(e){}
    }
    if(this.me.admin){   // 가입 신청 목록은 실패해도 나머지 화면은 열리도록
      try{
        const {data, error} = await sb.from('jw_applications').select('*').eq('status','pending').order('created_at',{ascending:false});
        if(error) throw error;
        this.db.applications = data || [];
      }catch(e){ console.warn('가입 신청 목록을 불러오지 못했습니다', e); }
    }
    await this.signImages();
  },
  /* 비공개 저장소 이미지 → 12시간짜리 서명 URL을 한 번에 발급 */
  async signImages(){
    const paths = [];
    this.db.members.forEach(m=>Object.values(IMG_KEYS).forEach(k=>{ if(m[k]) paths.push(m[k]); }));
    if(!paths.length) return;
    const {data} = await sb.storage.from(BUCKET).createSignedUrls(paths, 60*60*12);
    const map = Object.fromEntries((data||[]).filter(x=>x.signedUrl).map(x=>[x.path, x.signedUrl]));
    this.db.members.forEach(m=>Object.entries(IMG_KEYS).forEach(([u,k])=>{ m[u] = map[m[k]] || ''; }));
  },
  async refresh(){ await this.load(); render(); },
};

function dataUrlToBlob(u){
  const [h,b] = u.split(','); const bin = atob(b); const a = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], {type:h.match(/:(.*?);/)[1]});
}
async function uploadImage(memberId, kind, dataUrl){
  const path = `${memberId}/${kind}-${Date.now()}.jpg`;
  await q(sb.storage.from(BUCKET).upload(path, dataUrlToBlob(dataUrl), {contentType:'image/jpeg', upsert:false}));
  return path;
}

/* ===================== 엑셀 일괄 등록·변경 =====================
   흐름: 수정용 엑셀 받기 → 엑셀에서 고치기 → 업로드 → 변경 내용 미리보기 → 적용
   - 매칭: ID 열(수정용 엑셀) → 명부 NO+성명 → 성명 순서로 회원을 찾음 (ID가 있으면 이름 변경 가능)
   - 빈 칸은 기존 값 유지, '-' 는 값 지우기
   - 창립·신입 열: O(또는 Y, 1, 예, V) = 체크, 빈칸 = 해제  /  상태 열: 활동·휴면
   - 예전 명부 엑셀(ID 없음, 추천인 칸 '창립')도 그대로 인식
   - 명부에 없는 추천인은 '휴면' 회원으로 자동 생성 */
const IMPORT_FIELDS = [   // [엑셀 키, DB 열, 화면 이름, 회원 속성]
  ['name','name','성명','name'], ['no','roster_no','NO','rosterNo'], ['joined','joined','입회년월','joined'],
  ['phone','phone','전화번호','phone'], ['company','company','근무처','company'], ['title','title','직함','title'],
  ['products','products','제품·서비스','products'], ['industry','industry','업종','industry'], ['address','address','주소','address'],
  ['website','website','홈페이지','website'], ['email','email','이메일','email'], ['birthYear','birth_year','출생연도','birthYear'],
  ['memo','memo','비고','memo'], ['intro','intro','사업소개','intro']];
const EXPORT_HEAD = ['ID','NO','입회년월','성명','추천인','전화번호','근무처','직함','제품·서비스','업종','주소','홈페이지','이메일','출생연도','창립','신입','상태','비고','사업소개','직책(참고)'];
const isYes = v => /^(o|ㅇ|y|yes|1|예|v|✓|✔|●|true)$/i.test(String(v||'').trim());

/* 표(2차원 배열) → {rows, has}. 머리글 줄을 자동으로 찾음 (제목 줄이 있어도 됨) */
function rowsFromTable(table){
  const norm = v => String(v ?? '').replace(/\s+/g,' ').trim();
  const hi = table.findIndex(r=>r.some(c=>/^(성명|회원명|이름)$/.test(norm(c))));
  if(hi < 0) throw new Error('"성명" 또는 "회원명" 머리글을 찾을 수 없습니다.');
  const head = table[hi].map(norm);
  const col = (...names) => head.findIndex(h=>names.some(n=>h.includes(n)));
  const exact = re => head.findIndex(h=>re.test(h));
  const prodCol = col('제품','서비스');
  const ix = {id:exact(/^ID$/i), no:exact(/^(NO|번호|순번)$/i), joined:col('입회'), name:exact(/^(성명|회원명|이름)$/),
    guardian:col('추천'), phone:col('전화','연락처','휴대'), company:col('근무처','회사','상호'), title:col('직함','직위'),
    address:col('주소'), website:col('홈페이지','웹사이트','URL'), email:col('이메일','메일','email'), birthYear:col('출생'),
    memo:col('비고','메모'), intro:col('사업소개','소개'), founder:exact(/^창립/), isNew:exact(/^신입/), status:exact(/^상태$/),
    // 예전 명부는 '업종' 칸에 제품·서비스를 적었음 → 제품 칸이 따로 없으면 업종을 제품으로 읽음
    products: prodCol >= 0 ? prodCol : col('업종'), industry: prodCol >= 0 ? col('업종') : -1};
  const toJoined = v => {
    if(v === '' || v == null) return '';
    if(String(v).trim() === '-') return '-';
    const t = typeof v === 'number' ? v.toFixed(2) : norm(v).replace(/[.\/-]+$/,'');
    const m = t.match(/^(\d{4})[.\/-](\d{1,2})/); return m ? `${m[1]}-${m[2].padStart(2,'0')}` : '';
  };
  const has = Object.fromEntries(Object.entries(ix).map(([k,i])=>[k, i >= 0]));
  const rows = table.slice(hi+1).map((r, n)=>{
    const o = {_line: hi + n + 2};
    for(const k in ix) o[k] = ix[k] >= 0 ? norm(r[ix[k]]) : '';
    o.joined = ix.joined >= 0 ? toJoined(r[ix.joined]) : '';
    return o;
  }).filter(o=>o.name);
  return {rows, has};
}

/* 업로드 내용과 현재 명부를 비교해 변경 계획을 만듦 (DB는 아직 안 바뀜) */
function planImport({rows, has}){
  const M = D().members;
  const plan = {creates:[], updates:[], same:0, warnings:[], newGuardians:new Set(), absent:[], has};
  const used = new Set();
  const byName = n => M.filter(m=>m.name===n);
  const findTarget = r => {
    if(r.id){
      const m = M.find(x=>x.id===r.id);
      if(m) return m;
      plan.warnings.push(`${r._line}행 ${r.name}: ID가 명부에 없어 새 회원으로 등록합니다.`);
      return null;
    }
    const byNo = r.no && M.find(m=>String(m.rosterNo)===String(r.no) && m.name===r.name);
    if(byNo) return byNo;
    const same = byName(r.name).filter(m=>!r.no || !m.rosterNo || String(m.rosterNo)===String(r.no));
    if(same.length > 1){ plan.warnings.push(`${r._line}행 ${r.name}: 같은 이름이 ${same.length}명이라 건너뜁니다. (수정용 엑셀의 ID 열을 사용하세요)`); return 'skip'; }
    return same[0] || null;
  };
  const guardianOf = (n, self) => M.filter(m=>m.name===n && (!self || m.id!==self.id))
    .sort((a,b)=>(a.status==='inactive')-(b.status==='inactive') || (a.rosterNo||9999)-(b.rosterNo||9999))[0];
  const fmt = (k, v) => v === '' || v == null ? '(없음)' : k === 'joined' ? String(v).replace('-','.') : String(v);

  for(const r of rows){
    const m = findTarget(r);
    if(m === 'skip') continue;
    if(m && used.has(m.id)){ plan.warnings.push(`${r._line}행 ${r.name}: 같은 회원이 파일에 두 번 있어 건너뜁니다.`); continue; }
    if(m) used.add(m.id);
    const cur = m || {};
    const patch = {}, changes = [];
    const set = (col, label, from, to, key) => { if(String(from ?? '') !== String(to ?? '')){ patch[col] = to; changes.push({label, from:fmt(key, from), to:fmt(key, to)}); } };

    for(const [k, col, label, prop] of IMPORT_FIELDS){
      if(!has[k]) continue;
      let v = r[k];
      if(v === '') continue;                         // 빈 칸 = 그대로
      if(v === '-') v = '';                           // '-' = 지우기
      if(k === 'name' && !v) continue;
      if(k === 'email') v = v.toLowerCase();
      if(k === 'no'){ const n = parseInt(v, 10); if(v === '') set(col, label, cur.rosterNo || '', null, k); else if(Number.isFinite(n)) set(col, label, cur.rosterNo || '', n, k); continue; }
      set(col, label, cur[prop] ?? '', v, k);
    }
    // 창립: 창립 열이 있으면 그 값, 없으면 예전 명부처럼 추천인 칸의 '창립'으로 판단
    let g = r.guardian;
    const legacyFounder = !has.founder && has.guardian && g.startsWith('창립');
    if(g.startsWith('창립')) g = g.startsWith('창립(') ? g.slice(3).replace(/[()]/g,'').trim() : '';
    const founder = has.founder ? isYes(r.founder) : has.guardian ? legacyFounder : undefined;
    if(founder !== undefined) set('is_founder', '창립', cur.isFounder ? 'O' : '', founder ? 'O' : '', 'f');
    if(has.isNew) set('is_new', '신입', cur.isNew ? 'O' : '', isYes(r.isNew) ? 'O' : '', 'n');
    if(has.status && r.status){
      const st = /휴면|탈퇴|정지/.test(r.status) ? 'inactive' : /활동|정상|회원/.test(r.status) ? 'active' : '';
      if(st) set('status', '상태', cur.status === 'inactive' ? '휴면' : m ? '활동' : '', st === 'inactive' ? '휴면' : '활동', 's');
    }
    // 상태 열 값은 화면용 → DB 값으로 바꿈
    if('status' in patch) patch.status = patch.status === '휴면' ? 'inactive' : 'active';
    if('is_founder' in patch) patch.is_founder = patch.is_founder === 'O';
    if('is_new' in patch) patch.is_new = patch.is_new === 'O';
    // 추천인
    if(has.guardian){
      const curG = cur.guardianId ? member(cur.guardianId)?.name || '' : '';
      if(r.guardian === '-' || (legacyFounder && !g)){
        if(curG){ patch.guardian_id = null; changes.push({label:'추천인', from:curG, to:'(없음)'}); }
      }else if(g && g !== curG){
        patch._guardianName = g; changes.push({label:'추천인', from:curG || '(없음)', to:g, _g:g});
      }
    }
    if(!m){
      if(!r.name) continue;
      patch.name = r.name;
      plan.creates.push({row:r, patch});
    }else if(changes.length) plan.updates.push({m, patch, changes});
    else plan.same++;
  }
  // 명부에 없는 추천인: 기존 회원에도, 이번 파일의 신규 회원에도 없는 이름만
  const createNames = new Set(plan.creates.map(c=>c.patch.name));
  const missing = n => !guardianOf(n) && !createNames.has(n);
  [...plan.creates.map(c=>c.patch), ...plan.updates.map(u=>u.patch)].forEach(p=>{ if(p._guardianName && missing(p._guardianName)) plan.newGuardians.add(p._guardianName); });
  plan.updates.forEach(u=>u.changes.forEach(c=>{ if(c._g && plan.newGuardians.has(c._g)) c.to += ' (명부에 없어 휴면으로 생성)'; }));
  plan.absent = M.filter(m=>m.status !== 'inactive' && !used.has(m.id));
  plan.guardianOf = guardianOf;
  return plan;
}

      <span class="muted" style="font-size:12px">(${plan.absent.slice(0,8).map(m=>esc(m.name)).join(', ')}${plan.absent.length>8?' 외':''})</span></span></label>` : ''}
    <div class="row" style="justify-content:flex-end;margin-top:14px">
      <button class="btn" data-close>취소</button>

    </div>`, root=>{

      closeModal();
      const msg = `신규 ${res.created}명 · 변경 ${res.updated}명${res.inactivated?` · 휴면 ${res.inactivated}명`:''}${res.guardians?` · 추천인 ${res.guardians}명 생성`:''}`;

        openModal(`<h2>반영 결과</h2><p>${msg}</p><p style="color:var(--warn)"><b>반영하지 못한 ${res.errors.length}건</b></p>

    };
  });
}

async function applyImport(plan, {absentOff}){
  const res = {created:0, updated:0, inactivated:0, guardians:0, errors:[]};
  const M = D().members;
  const errText = e => e?.code === '23505' ? '이미 다른 회원이 쓰는 이메일입니다' : (e?.message || '오류');
  const resolve = (patch, self) => {
    const p = {...patch};
    if(p._guardianName){ const g = plan.guardianOf(p._guardianName, self); if(g) p.guardian_id = g.id; }
    delete p._guardianName;
    return p;
  };
  // 1) 신규 회원 (추천인은 모두 등록한 뒤 연결)
  const created = [];
  for(const c of plan.creates){
    const {_guardianName, ...row} = c.patch;
    const {data, error} = await sb.from('jw_members').insert(row).select('*');
    if(error) res.errors.push(`${c.patch.name}: ${errText(error)}`);
    else { const m = fromMember(data[0]); M.push(m); created.push([m, c.patch]); res.created++; }
  }
  // 2) 기존 명부·신규 회원 어디에도 없는 추천인 → 휴면 회원 생성
  if(plan.newGuardians.size){
    const {data, error} = await sb.from('jw_members')
      .insert([...plan.newGuardians].map(name=>({name, status:'inactive', memo:'명부에 없는 추천인 (전 회원 추정)'}))).select('*');
    if(error) res.errors.push('추천인 생성: ' + errText(error)); else { M.push(...data.map(fromMember)); res.guardians = data.length; }
  }
  // 3) 신규 회원의 추천인 연결
  for(const [m, patch] of created){
    if(!patch._guardianName) continue;
    const g = plan.guardianOf(patch._guardianName, m);
    if(g){ const {error} = await sb.from('jw_members').update({guardian_id:g.id}).eq('id', m.id); if(error) res.errors.push(`${m.name} 추천인: ${errText(error)}`); }
  }
  // 3-2) 기존 회원 정보 변경
  for(const u of plan.updates){
    const {error} = await sb.from('jw_members').update(resolve(u.patch, u.m)).eq('id', u.m.id);
    if(error) res.errors.push(`${u.m.name}: ${errText(error)}`); else res.updated++;
  }
  // 4) 엑셀에 없는 회원 휴면 처리 (선택)
  if(absentOff && plan.absent.length){
    const {error} = await sb.from('jw_members').update({status:'inactive'}).in('id', plan.absent.map(m=>m.id));
    if(error) res.errors.push('휴면 처리: ' + errText(error)); else res.inactivated = plan.absent.length;
  }
  return res;
}

/* 수정용 엑셀 내려받기: 올릴 때와 같은 양식 (ID 열로 회원을 정확히 찾음) */
async function exportMembersXlsx(list, filename){
  const X = await loadXLSX();

    return [m.id, m.rosterNo || '', m.joined ? m.joined.replace('-','.') : '', m.name, member(m.guardianId)?.name || '',
      m.phone, m.company, m.title, m.products, m.industry, m.address, m.website, m.email, m.birthYear,
      m.isFounder ? 'O' : '', m.isNew ? 'O' : '', m.status === 'inactive' ? '휴면' : '활동', m.memo, m.intro,
      pn];
  });
  const ws = X.utils.aoa_to_sheet([EXPORT_HEAD, ...rows]);
  ws['!cols'] = [10,5,9,9,9,15,20,10,30,14,36,22,24,8,5,5,6,30,40,14].map(w=>({wch:w}));
  const guide = X.utils.aoa_to_sheet([
    ['정우회 회원명부 수정 방법'], [''],
    ['1. 「회원명부」 시트에서 내용을 고친 뒤 저장하고, 사이트 관리 → 회원 일괄 등록·변경에 올립니다.'],
    ['2. 올리면 바뀌는 내용을 미리 보여주고, [적용]을 눌러야 반영됩니다.'],
    ['3. ID 열은 회원을 찾는 열입니다. 고치거나 지우지 마세요. (ID가 있으면 이름도 바꿀 수 있습니다)'],
    ['4. 새 회원은 맨 아래에 ID를 비우고 추가하면 됩니다.'],
    ['5. 빈 칸은 기존 값이 유지됩니다. 값을 지우려면 - (하이픈)을 입력하세요.'],
    ['6. 창립·신입 열은 O = 체크, 빈칸 = 해제입니다. 상태 열은 활동 또는 휴면.'],
    ['7. 추천인은 회원 이름으로 적습니다. 직책(참고) 열은 바꿔도 반영되지 않습니다 (임원진 메뉴에서 변경).'],
  ]);
  guide['!cols'] = [{wch:100}];
  const wb = X.utils.book_new();
  X.utils.book_append_sheet(wb, ws, '회원명부');
  X.utils.book_append_sheet(wb, guide, '수정 방법');
  X.writeFile(wb, filename);
}

let xlsxLib = null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return xlsxLib ||= new Promise((res,rej)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ()=>res(window.XLSX); sc.onerror = ()=>rej(new Error('엑셀 모듈을 불러오지 못했습니다.'));
    document.head.appendChild(sc);
  });
}
async function readTableFile(f){
  if(/\.xlsx?$/i.test(f.name)){
    const X = await loadXLSX();
    const wb = X.read(await f.arrayBuffer(), {type:'array'});
    return X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''});
  }
  return parseCSV(await f.text());
}

/* ===================== 조회 헬퍼 ===================== */
const D = () => Store.db;
const member = id => D().members.find(m=>m.id===id);
const position = id => D().positions.find(p=>p.id===id);
/* 현재 직책: 한 사람이 여러 직책을 겸직할 수 있음 (직책 순서대로) */

function guardianRanking(){

  D().members.forEach(m=>{ if(m.guardianId){ (map[m.guardianId] ||= []).push(m); } });
  return Object.entries(map).map(([gid,list])=>({g:member(gid), list}))
    .filter(x=>x.g).sort((a,b)=>b.list.length-a.list.length || a.g.name.localeCompare(b.g.name,'ko'));

function toast(msg){

function avatar(m, size){

  return m.photo ? `<img class="av" ${st} src="${m.photo}" alt="">`

function typeTag(m){
  const t = currentTerm(m.id);
  if(m.status==='inactive') return '<span class="tag gray">휴면</span>';
  const base = t ? posNames(m.id).map(n=>`<span class="tag off">${esc(n)}</span>`).join(' ') : `<span class="tag">${m.isNew?'신입회원':'일반회원'}</span>`;
  return (t && m.isNew ? '<span class="tag new">신입</span> ' : '') + (m.isNew && !t ? base.replace('class="tag"','class="tag new"') : base);
}
/* 글자 구분 (CSV·PNG·연락처 메모용) */

function readImage(file, max=520){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>{ const img = new Image(); img.onload = ()=>{
      const s = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement('canvas'); c.width=img.width*s; c.height=img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82));
    }; img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
function download(name, text, type='text/plain'){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  text = text.replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=c;
  }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}

      const st = await sb.rpc('jw_my_password_state');
      const k = 'jw_pw_asked_' + readMemberToken().slice(0,12);
      let asked = false; try{ asked = !!sessionStorage.getItem(k); sessionStorage.setItem(k,'1'); }catch(_){}
      if(st.data && st.data.must_change && !asked) passwordForm(true);

    renderGate('<p>데이터를 불러오지 못했습니다.</p><button class="btn" onclick="location.reload()">다시 시도</button>');

function boot(){
  if(keyMode || memberMode) return enter();
  sb.auth.onAuthStateChange((ev, session)=>{
  if(ev === 'SIGNED_OUT'){ Store.ready = false; return renderLogin(); }
  if(session && (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION')) return setTimeout(enter);
  if(!session && ev === 'INITIAL_SESSION'){
    const err = new URLSearchParams(location.hash.slice(1)).get('error_description');
    renderLogin(err ? '로그인 링크가 만료되었거나 이미 사용되었습니다. 다시 요청해주세요.' : '');
  }
  });
}

      ${autoCur ? `<input type="hidden" name="cur" value="${autoCur}">` : '<label class="full">현재 비밀번호<input class="input" type="password" name="cur" autocomplete="current-password"></label>'}

    </form>`, root=>{
    const form = root.querySelector('#pwf'), err = root.querySelector('#pwerr');
    const fail = msg=>{ err.textContent = msg; err.style.display = 'block'; err.scrollIntoView({block:'center', behavior:'smooth'}); };
    form.onsubmit = async e=>{
      e.preventDefault(); err.style.display = 'none';
      const f = Object.fromEntries(new FormData(form));
      const pw1 = (f.pw1||'').trim(), pw2 = (f.pw2||'').trim(), cur = (f.cur||'').trim();
      if(!autoCur && !cur) return fail('현재 비밀번호를 입력해 주세요.');
      if(pw1.length < 6) return fail('새 비밀번호는 6자 이상으로 정해 주세요. (지금 ' + pw1.length + '자)');
      if(pw1 !== pw2) return fail('새 비밀번호와 확인 칸이 서로 다릅니다. 다시 입력해 주세요.');
      if(ph.length >= 4 && (pw1 === ph.slice(-4) || pw1 === ph || pw1 === ph.slice(-8))) return fail('휴대폰 번호와 다른 비밀번호를 정해 주세요.');
      const btn = form.querySelector('.btn.pri'); btn.disabled = true; btn.textContent = '변경 중…';
      const {data, error} = await sb.rpc('jw_change_password', {p_current:cur, p_new:pw1});
      btn.disabled = false; btn.textContent = '변경';
      if(error) return fail('변경하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.');
      if(!data || !data.ok) return fail((data && data.error) || '변경하지 못했습니다.');
      closeModal(); toast('비밀번호를 변경했습니다. 다음부터 새 비밀번호로 로그인하세요.');
    };
  });
}
async function resetPassword(m){
  const digits = (m.phone||'').replace(/\D/g,'');

  if(digits.length < 4){
    temp = prompt(`${m.name} 님은 휴대폰 번호가 없습니다.\n임시 비밀번호(4자 이상)를 정해 주세요. 회원에게 알려 주시면 첫 로그인 때 바꾸게 됩니다.`);

  const {data, error} = await sb.rpc('jw_reset_member_password', {p_member:m.id, p_temp:temp});

}

function filteredMembers(){
  const q = ui.q.trim();
  return D().members.filter(m=>{
    if(q && ![m.name,m.company,m.products,m.industry].join(' ').includes(q)) return false;
    if(ui.type==='officer' && !isOfficer(m.id)) return false;
    if(ui.type==='regular' && (isOfficer(m.id) || m.status==='inactive')) return false;
    if(ui.type==='inactive' && m.status!=='inactive') return false;
    if(ui.type==='new' && (!m.isNew || m.status==='inactive')) return false;
    if(ui.year==='old' && (m.joined || m.isFounder)) return false;
    if(ui.year==='founder' && !m.isFounder) return false;
    if(ui.year && ui.year!=='old' && ui.year!=='founder' && !m.joined.startsWith(ui.year)) return false;
    return true;
  }).sort(memberSorter());
}
/* 회원명부 정렬: 표 머리글을 누르면 오름차순 ↔ 내림차순 (빈 값은 항상 맨 뒤) */
const SORT_KEYS = {
  name: m=>m.name, type: m=>typeText(m), company: m=>m.company, products: m=>m.products,
  joined: m=>m.joined || (m.isFounder ? '0000-00' : ''), guardian: m=>member(m.guardianId)?.name || ''};
function memberSorter(){
  const {key, dir} = ui.sort, get = SORT_KEYS[key] || SORT_KEYS.joined, sign = dir === 'asc' ? 1 : -1;
  return (a,b)=>{
    const x = get(a) || '', y = get(b) || '';
    if(!x !== !y) return x ? -1 : 1;
    return sign * String(x).localeCompare(String(y), 'ko') || a.name.localeCompare(b.name, 'ko');
  };
}
const sortTh = (key, label, cls='') => {
  const on = ui.sort.key === key;
  return `<th class="sortable ${on?'on':''} ${cls}" data-sort="${key}">${label}<span class="ar">${on ? (ui.sort.dir === 'asc' ? '▲' : '▼') : '▲▼'}</span></th>`;
};

const webHref = u => /^https?:\/\//i.test(u) ? u : 'https://' + u;
const webLabel = u => u.replace(/^https?:\/\//i,'').replace(/\/$/,'');

/* ===================== 휴대폰 연락처 (vCard 3.0) =====================
   .vcf 파일 하나에 여러 명을 담아 아이폰/갤럭시 연락처 앱에서 한 번에 추가 */
const vEsc = v => String(v ?? '').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1');
function vCard(m){
  const g = member(m.guardianId), t = currentTerm(m.id);
  const family = m.name.length >= 2 && m.name.length <= 4 ? m.name.slice(0,1) : '';
  const given = family ? m.name.slice(1) : m.name;
  const note = ['정우회 ' + typeText(m),
    m.joined ? `입회 ${m.joined.replace('-','.')}` : m.isFounder ? '창립회원' : '',
    g ? `추천인 ${g.name}` : '', m.products ? `제품·서비스: ${m.products}` : '', m.industry ? `업종: ${m.industry}` : '']
    .filter(Boolean).join(' / ');
  const L = ['BEGIN:VCARD', 'VERSION:3.0',
    `N:${vEsc(family)};${vEsc(given)};;;`, `FN:${vEsc(m.name)}`];
  if(m.company) L.push(`ORG:${vEsc(m.company)}`);
  if(m.title) L.push(`TITLE:${vEsc(m.title)}`);
  if(m.phone) L.push(`TEL;TYPE=CELL,VOICE:${m.phone.replace(/[^\d+]/g,'')}`);
  if(m.email) L.push(`EMAIL;TYPE=INTERNET:${vEsc(m.email)}`);
  if(m.website) L.push(`URL:${vEsc(webHref(m.website))}`);
  if(m.address) L.push(`ADR;TYPE=WORK:;;${vEsc(m.address)};;;;`);
  L.push(`NOTE:${vEsc(note)}`, 'CATEGORIES:정우회', 'END:VCARD');
  return L.join('\r\n');
}
function downloadVcf(list, filename){
  download(filename, list.map(vCard).join('\r\n') + '\r\n', 'text/vcard;charset=utf-8');
}

/* ===================== 프로필 PNG 저장 =====================
   화면 크기와 상관없이 같은 모양이 나오도록 저장 전용 레이아웃(폭 800px)을 만들어 캡처합니다.
   이미지는 비공개 저장소에서 직접 내려받아(blob) 사용하므로 다른 사이트 이미지 제한(CORS)에 걸리지 않습니다. */
let h2cLib = null;
function loadH2C(){
  if(window.html2canvas) return Promise.resolve(window.html2canvas);
  return h2cLib ||= new Promise((res,rej)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    sc.onload = ()=>res(window.html2canvas); sc.onerror = ()=>{ h2cLib = null; rej(new Error('이미지 모듈을 불러오지 못했습니다.')); };
    document.head.appendChild(sc);
  });
}
async function blobUrl(path){
  if(!path) return '';
  const {data, error} = await sb.storage.from(BUCKET).download(path);
  return (error || !data) ? '' : URL.createObjectURL(data);
}

  const urls = [];
  try{
    const [H, photo, comp, card] = await Promise.all([loadH2C(), blobUrl(m.photoPath), blobUrl(m.companyImagePath), blobUrl(m.cardImagePath)]);
    urls.push(photo, comp, card);
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:-10000px;top:0;z-index:-1';
    box.innerHTML = profileExportHTML(m, {photo, comp, card});
    document.body.appendChild(box);
    await Promise.all([...box.querySelectorAll('img')].map(i=>i.decode().catch(()=>{})));
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await H(box.firstElementChild, {scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false});
    box.remove();
    const blob = await new Promise(r=>canvas.toBlob(r, 'image/png'));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `정우회_${m.name}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
    toast('프로필을 PNG로 저장했습니다.');
  }catch(err){
    console.error(err); toast(err.message || '이미지 저장에 실패했습니다.');
  }finally{
    setTimeout(()=>urls.forEach(u=>u && URL.revokeObjectURL(u)), 3000);
    btn.disabled = false; btn.textContent = label;
  }
}

/* HTML 조각 → PNG 파일 저장 (프로필·조직도 공용) */
async function htmlToPng(html, filename){
  const H = await loadH2C();
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:-20000px;top:0;z-index:-1';
  box.innerHTML = html;
  document.body.appendChild(box);
  try{
    await Promise.all([...box.querySelectorAll('img')].map(i=>i.decode().catch(()=>{})));
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await H(box.firstElementChild, {scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false});
    const blob = await new Promise(r=>canvas.toBlob(r, 'image/png'));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  }finally{ box.remove(); }
}

/* ===================== 조직도 이미지 =====================
   단 구성: 1단 = 첫 번째 직책(회장) · 2단 = 두 번째 직책(부회장)
            3단 = 그 밖의 직책(총무·재무 등) · 4단 = 이름에 '위원'이 들어간 직책(위원장)
   직책 순서는 임원진 → 직책 설정의 순서를 따릅니다. */
function orgTiers(includeVacant){
  const pos = [...D().positions].sort((a,b)=>a.order-b.order);
  const cur = D().terms.filter(t=>!t.end);
  const tiers = [[],[],[],[]];
  pos.forEach((p,i)=>{
    const people = cur.filter(t=>t.positionId===p.id).map(t=>({p, m:member(t.memberId)})).filter(x=>x.m)
      .sort((a,b)=>a.m.name.localeCompare(b.m.name,'ko'));
    const boxes = people.length ? people : includeVacant ? [{p, m:null}] : [];
    tiers[i===0 ? 0 : i===1 ? 1 : /위원/.test(p.name) ? 3 : 2].push(...boxes);
  });
  return tiers.filter(t=>t.length);
}
function orgChartHTML(tiers, photos){
  const C = {ink:'#1b2333', sub:'#5d6b82', line:'#c3cddd', soft:'#eef3fb', brand:'#1f3a68', accent:'#c8a24a'};
  const F = "font-family:'Noto Sans KR',sans-serif;";
  const W = 168, G = 14;
  const maxRow = Math.max(...tiers.map(t=>t.length*W + (t.length-1)*G));
  const width = Math.max(900, maxRow + 80);
  const box = ({p, m}, top) => {
    const w = top ? 210 : W, ph = top ? 88 : 66;
    const photo = m && photos[m.id]
      ? `<div style="width:${ph}px;height:${ph}px;border-radius:50%;margin:0 auto 10px;background:url('${photos[m.id]}') center/cover no-repeat ${C.soft};border:2px solid #fff;box-shadow:0 0 0 1px ${C.line}"></div>`
      : `<div style="width:${ph}px;height:${ph}px;border-radius:50%;margin:0 auto 10px;background:${m ? C.soft : '#f6f7f9'};color:${m ? C.brand : '#aab2bf'};display:flex;align-items:center;justify-content:center;font-size:${top?34:26}px;font-weight:700">${m ? esc(m.name.slice(0,1)) : '?'}</div>`;
    const pname = p.name.length > 7 && /위원장$/.test(p.name) ? esc(p.name.slice(0,-3)) + '<br>위원장' : esc(p.name);
    return `<div style="width:${w}px;flex:1;border:${m ? `1px solid ${C.line}` : `1.5px dashed ${C.line}`};border-radius:16px;background:${top ? '#fbf8ef' : '#fff'};padding:16px 10px 14px;text-align:center;box-sizing:border-box">
      ${photo}
      <div style="display:inline-block;background:${top ? C.accent : C.brand};color:#fff;border-radius:999px;padding:3px 12px;font-size:${p.name.length > 6 ? 12 : 13}px;font-weight:700;margin-bottom:8px;line-height:1.4;word-break:keep-all">${pname}</div>
      <div style="font-size:${top?22:19}px;font-weight:700;color:${m ? C.ink : '#aab2bf'}">${m ? esc(m.name) : '공석'}</div>
      <div style="font-size:12.5px;color:${C.sub};margin-top:3px;min-height:18px">${m ? esc(m.company||'') : ''}</div>
    </div>`;
  };
  const row = (t, i) => {
    const span = (t.length - 1) * (W + G);
    const connector = i === 0 ? '' : `<div style="display:flex;flex-direction:column;align-items:center">
        <div style="width:2px;height:22px;background:${C.line}"></div>
        ${t.length > 1 ? `<div style="height:2px;width:${span}px;background:${C.line}"></div>` : ''}
      </div>`;
    const stub = i === 0 ? '' : `<div style="width:2px;height:16px;background:${C.line};margin:0 auto"></div>`;
    return `${connector}<div style="display:flex;justify-content:center;align-items:stretch;gap:${G}px">
      ${t.map(b=>`<div style="flex:none;display:flex;flex-direction:column;align-items:center">${stub}${box(b, i === 0)}</div>`).join('')}</div>`;
  };
  const year = today().slice(0,4);
  return `<div style="${F}width:${width}px;background:#fff;color:${C.ink};padding:36px 40px 28px;box-sizing:border-box">
    <div style="text-align:center;margin-bottom:26px">
      <div style="font-size:30px;font-weight:700;color:${C.brand};letter-spacing:2px">정우회 조직도</div>
      <div style="font-size:14px;color:${C.sub};margin-top:6px">기업가 대표 모임 · ${year}년 임원진</div>
    </div>
    ${tiers.map(row).join('')}
    <div style="margin-top:26px;text-align:right;font-size:12.5px;color:${C.sub}">${today().replace(/-/g,'.')} 기준</div>
  </div>`;
}
async function saveOrgPng(btn, includeVacant){
  const label = btn.textContent; btn.disabled = true; btn.textContent = '이미지 만드는 중…';
  const urls = [];
  try{
    const tiers = orgTiers(includeVacant);
    if(!tiers.length) throw new Error('지정된 임원이 없습니다.');
    const people = tiers.flat().map(b=>b.m).filter(m=>m && m.photoPath);
    const photos = {};
    await Promise.all(people.map(async m=>{ const u = await blobUrl(m.photoPath); if(u){ photos[m.id] = u; urls.push(u); } }));
    await htmlToPng(orgChartHTML(tiers, photos), `정우회_조직도_${today()}.png`);
    toast('조직도를 PNG로 저장했습니다.');
  }catch(err){
    console.error(err); toast(err.message || '이미지 저장에 실패했습니다.');
  }finally{
    setTimeout(()=>urls.forEach(u=>URL.revokeObjectURL(u)), 3000);
    btn.disabled = false; btn.textContent = label;
  }
}

            if(!(k in imgs)) continue;
            if(m[pk]) sb.storage.from(BUCKET).remove([m[pk]]);
            next[pk] = imgs[k] ? await uploadImage(id, k, imgs[k]) : '';
          }
          await q(sb.from('jw_members').update(toMember(next)).eq('id', id));
          closeModal(); toast('저장했습니다.');
          await Store.load();
          isNew ? (location.hash = '#/member/'+id) : render();
        }catch(err){ if(btn){ btn.disabled = false; btn.textContent = '저장'; } }
      };
      const del = root.querySelector('#del');
      if(del) del.onclick = async ()=>{
        if(!confirm(`${m.name} 회원을 삭제할까요? 추천 관계와 직책 이력도 함께 정리됩니다.`)) return;
        await q(sb.from('jw_members').delete().eq('id', m.id));
        const files = Object.values(IMG_KEYS).map(k=>m[k]).filter(Boolean);
        if(files.length) sb.storage.from(BUCKET).remove(files);
        closeModal(); await Store.load(); location.hash = '#/members';
      };
    });
}

/* ===================== 화면: 연혁 ===================== */
const WEEK = ['일','월','화','수','목','금','토'];
/* 연혁: 날짜 최신순(위) → 같은 날짜면 나중에 등록한 것이 위 */
const historySorted = () => [...D().history].sort((a,b)=>b.date.localeCompare(a.date) || (b.created||'').localeCompare(a.created||''));
function History(){
  const items = historySorted();
  const now = today();
  const byYear = {};
  items.forEach(h=>(byYear[h.date.slice(0,4)] ||= []).push(h));
  const item = h => {
    const d = new Date(h.date + 'T00:00:00');
    const diff = Math.round((d - new Date(now + 'T00:00:00')) / 864e5);
    const badge = diff > 0 ? `<span class="tag">예정 D-${diff}</span>` : diff === 0 ? '<span class="tag off">오늘</span>' : '';
    return `<div class="it${diff > 0 ? ' future' : ''}"><div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><span class="when">${h.date.slice(5).replace('-','.')} (${WEEK[d.getDay()]})</span> <b>${esc(h.title)}</b> ${badge}
        ${h.source==='officer'?'<span class="tag gray">자동</span>':''}</div>
      ${can.officer()?`<button class="btn sm" data-hedit="${h.id}">수정</button>`:''}</div>
      ${h.desc?`<div class="desc">${esc(h.desc)}</div>`:''}</div>`;
  };
  // 예정(미래)과 지난 기록 사이에 '오늘' 구분선
  const yearBlock = y => {
    const list = byYear[y]; let out = '', marked = false;
    list.forEach((h,i)=>{
      if(!marked && h.date <= now && i > 0 && list[i-1].date > now){
        out += `<div class="tl-today"><span>오늘 ${now.slice(5).replace('-','.')}</span></div>`; marked = true;
      }
      out += item(h);
    });
    return out;
  };
  return `
  <div class="head"><div><h1>연혁·히스토리</h1><div class="muted" style="font-size:13px;margin-top:4px">최신 날짜가 위에 표시됩니다 · 예정 일정은 빈 점(○)으로 표시</div></div>
    ${can.officer()?'<button class="btn pri" id="hadd">+ 연혁 추가</button>':''}</div>
  ${items.length?Object.keys(byYear).sort().reverse().map(y=>`<div class="panel" style="margin-bottom:14px"><h2>${y}</h2><div class="tl">
    ${yearBlock(y)}
  </div></div>`).join('')
  :'<div class="empty">창립, 회장 취임, 주요 행사 등을 기록하세요.<br>임원 직책을 지정하면 취임 기록이 자동으로 추가됩니다.</div>'}`;
}

  openModal(`<h2>${isNew?'연혁 추가':'연혁 수정'}</h2>
    <form class="form" id="hf">

      ${row('제품·서비스',a.products)}${row('업종',a.industry)}${row('홈페이지',a.website)}${row('주소',a.address)}${row('추천인(입력)',a.recommender)}${row('하고 싶은 말',a.message)}

async function approveApplication(a, {guardianId, joined, isNew}){
  const email = (a.email||'').trim().toLowerCase();
  const emailTaken = email && D().members.some(m=>(m.email||'').toLowerCase()===email);
  const memo = [a.message ? `가입 신청 메시지: ${a.message}` : '', emailTaken ? `신청 이메일(중복으로 로그인 이메일 미등록): ${email}` : '']
    .filter(Boolean).join('\n');
  const [row] = await q(sb.from('jw_members').insert({name:a.name.trim(), phone:a.phone, birth_year:a.birth_year||'', company:a.company,
    title:a.title||'', products:a.products||'', industry:a.industry||'', website:a.website||'', address:a.address||'',
    email:emailTaken ? '' : email, joined, guardian_id:guardianId||null, is_new:!!isNew, memo}).select('id'));
  const patch = {};
  for(const [kind, col] of Object.entries(APP_IMG)){
    if(!a[col]) continue;
    const to = `${row.id}/${kind}-${Date.now()}.jpg`;
    const {error} = await sb.storage.from(BUCKET).move(a[col], to);
    if(!error) patch[col] = to;
  }
  if(Object.keys(patch).length) await q(sb.from('jw_members').update(patch).eq('id', row.id));
  await q(sb.from('jw_applications').delete().eq('id', a.id));   // 회원으로 옮긴 뒤 신청서는 삭제(개인정보 중복 보관 방지)
  return row.id;
}

   - 작성: 임원(재무·총무 등)·관리자 / 열람: 로그인한 회원 전체
   - 카카오뱅크 '거래내역 엑셀'을 올리면 입금·출금·잔액을 자동으로 채움 (내용에 '찬조'가 있으면 찬조로 표시)
   - 영수증·캡처 이미지 첨부 가능 */
const won = n => (Math.round(+n || 0)).toLocaleString('ko-KR') + '원';
const FUNDS = ['본회','봉사기금'];
const fromFinance = r => ({id:r.id, period:r.period, fund:r.fund || '본회', opening:+r.opening_balance || 0, items:Array.isArray(r.items) ? r.items : [],
  note:r.note || '', images:Array.isArray(r.images) ? r.images : [], imageUrls:{}, updatedBy:r.updated_by || '', updatedAt:r.updated_at});
function finTotals(f){
  const inc = f.items.filter(i=>i.kind==='in').reduce((s,i)=>s + (+i.amount||0), 0);
  const exp = f.items.filter(i=>i.kind==='out').reduce((s,i)=>s + (+i.amount||0), 0);
  const spo = f.items.filter(i=>i.kind==='in' && i.sponsor).reduce((s,i)=>s + (+i.amount||0), 0);
  return {inc, exp, spo, closing: f.opening + inc - exp};
}
/* 기금(본회/봉사기금)별 보고. fund 생략 또는 '전체'면 모든 기금 */

  .sort((a,b)=>b.period.localeCompare(a.period) || FUNDS.indexOf(a.fund) - FUNDS.indexOf(b.fund));
const prevClosing = (period, fund = '본회') => { const p = finSorted(fund).find(f=>f.period < period); return p ? finTotals(p).closing : 0; };

      </div>

/* 은행 거래내역 표 → 거래 항목. 카카오뱅크(거래일시·구분·거래금액·거래 후 잔액·내용·메모)와
   입금액/출금액 열이 따로 있는 일반 은행 양식을 모두 인식 */
function parseBankTable(table){
  const norm = v => String(v ?? '').replace(/\s+/g,' ').trim();
  const hi = table.findIndex(r=>{ const h = r.map(norm).join('|'); return /(거래일|일시|일자|날짜)/.test(h) && /(금액|입금|출금)/.test(h); });
  if(hi < 0) throw new Error('거래내역 머리글(거래일시·금액)을 찾지 못했습니다. 카카오뱅크에서 내려받은 엑셀인지 확인해 주세요.');
  const head = table[hi].map(norm);
  const col = (...ns) => head.findIndex(h=>ns.some(n=>h.includes(n)));
  const c = {date:col('거래일시','거래일자','거래일','일시','일자','날짜'), kind:head.findIndex(h=>/^구분$|입출금|입\/출/.test(h)),
    amount:head.findIndex(h=>/^(거래금액|금액)$/.test(h)), inAmt:col('입금액','입금 금액','맡기신'), outAmt:col('출금액','출금 금액','찾으신'),
    bal:col('잔액'), desc:col('내용','적요','거래처','받는분','보낸분','기재'), memo:col('메모','비고')};
  const num = v => { if(typeof v === 'number') return v; const n = parseFloat(String(v||'').replace(/[^\d.-]/g,'')); return isFinite(n) ? n : 0; };
  const toDate = v => {
    if(typeof v === 'number'){ const d = new Date(Math.round((v - 25569) * 864e5)); return d.toISOString().slice(0,10); }
    const m = norm(v).match(/(\d{4})[.\/-]\s?(\d{1,2})[.\/-]\s?(\d{1,2})/); return m ? `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}` : '';
  };
  const rows = [];
  for(const r of table.slice(hi+1)){
    const date = c.date >= 0 ? toDate(r[c.date]) : '';
    if(!date) continue;
    let amt = 0, kind = '';
    if(c.inAmt >= 0 || c.outAmt >= 0){
      const ia = c.inAmt >= 0 ? num(r[c.inAmt]) : 0, oa = c.outAmt >= 0 ? num(r[c.outAmt]) : 0;
      if(ia){ kind = 'in'; amt = ia; } else if(oa){ kind = 'out'; amt = oa; }
    }
    if(!kind && c.amount >= 0){
      const a = num(r[c.amount]); const k = c.kind >= 0 ? norm(r[c.kind]) : '';
      kind = /출금|지출|출/.test(k) || a < 0 ? 'out' : 'in'; amt = Math.abs(a);
    }
    if(!amt) continue;
    const desc = c.desc >= 0 ? norm(r[c.desc]) : '', memo = c.memo >= 0 ? norm(r[c.memo]) : '';
    rows.push({date, kind, amount:amt, desc, memo, sponsor: kind === 'in' && /찬조|후원|협찬/.test(desc + ' ' + memo),
      bal: c.bal >= 0 ? num(r[c.bal]) : null});
  }
  // 은행 엑셀은 최신순이 많음 → 날짜 오름차순으로 (같은 날은 원래 순서 반대로)
  const asc = rows.length > 1 && rows[0].date > rows[rows.length-1].date ? rows.reverse() : rows;
  asc.sort((a,b)=>a.date.localeCompare(b.date));
  const periods = {}; asc.forEach(i=>{ const p = i.date.slice(0,7); periods[p] = (periods[p]||0) + 1; });
  const period = Object.entries(periods).sort((a,b)=>b[1]-a[1])[0]?.[0] || '';
  return {items: asc, period, months: Object.keys(periods).sort()};
}
/* 첫 거래의 '거래 후 잔액'에서 그 거래를 되돌리면 = 전월 이월 잔액 */

        <label class="full">전월 이월 잔액 (원) <span style="font-size:12px">(같은 기금의 지난 보고 월말 잔액이 자동으로 들어갑니다)</span><input class="input" name="opening" inputmode="numeric" value="${f ? f.opening : prevClosing(period0, fund0)}"></label>

      <div class="row" style="justify-content:space-between;margin-top:8px"><button type="button" class="btn sm" id="faddrow">+ 행 추가</button><span id="ftot" class="muted" style="font-size:13px"></span></div>
      <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub);margin-top:12px">월 보고 요약 (회원에게 보이는 설명)
        <textarea class="input" name="note" rows="3" placeholder="예) 11월 정기모임 식대 지출, 송년회 찬조 3건 입금">${esc(f?.note||'')}</textarea></label>
      <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub);margin-top:10px">영수증·캡처 이미지 (여러 장 가능)
        <input class="input" type="file" id="fimgs" accept="image/*" multiple></label>
      <div class="row" id="fimgPrev" style="margin-top:6px"></div>
      <div class="row" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn" data-close>취소</button><button class="btn pri">저장</button></div>
    </form>`, root=>{
    const tbody = root.querySelector('#frows');
    const read = () => [...tbody.querySelectorAll('tr')].map(tr=>({
      date: tr.querySelector('[data-k=date]').value, kind: tr.querySelector('[data-k=kind]').value,
      desc: tr.querySelector('[data-k=desc]').value.trim(), amount: Math.abs(parseFloat(tr.querySelector('[data-k=amount]').value.replace(/[^\d.-]/g,'')) || 0),
      sponsor: tr.querySelector('[data-k=sponsor]').checked, memo: items[+tr.dataset.n]?.memo || ''}));
    const total = () => { const it = read(); const t = finTotals({opening: +String(root.querySelector('[name=opening]').value).replace(/[^\d.-]/g,'') || 0, items: it});
      root.querySelector('#ftot').textContent = `수입 ${won(t.inc)} · 지출 ${won(t.exp)} · 찬조 ${won(t.spo)} · 월말 잔액 ${won(t.closing)}`; };
    const draw = () => { tbody.innerHTML = items.map(rowHtml).join('');
      tbody.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ items = read(); items.splice(+b.closest('tr').dataset.n, 1); draw(); });
      tbody.querySelectorAll('input,select').forEach(x=>x.oninput = total); total(); };
    const drawImgs = () => { root.querySelector('#fimgPrev').innerHTML = images.map((p,k)=>`<span class="tag gray">기존 이미지 ${k+1} <a href="#" data-rmimg="${k}">✕</a></span>`).join(' ')
        + newImgs.map((x,k)=>`<img src="${x}" style="height:48px;border-radius:4px">`).join('');
      root.querySelectorAll('[data-rmimg]').forEach(a=>a.onclick=e=>{ e.preventDefault(); images.splice(+a.dataset.rmimg,1); drawImgs(); }); };
    draw(); drawImgs();
    root.querySelector('[name=opening]').oninput = total;
    if(isNew){ const syncOpen = ()=>{ root.querySelector('[name=opening]').value = prevClosing(root.querySelector('[name=period]').value || period0, root.querySelector('[name=fund]').value); total(); };
      root.querySelector('[name=fund]').onchange = syncOpen; root.querySelector('[name=period]').onchange = syncOpen; }
    root.querySelector('#faddrow').onclick = () => { items = read(); items.push({date: (root.querySelector('[name=period]').value||period0) + '-01', kind:'in', desc:'', amount:'', sponsor:false}); draw(); };
    root.querySelector('#bankFile').onchange = async e => {
      const file = e.target.files[0]; if(!file) return;
      try{
        const res = parseBankTable(await readTableFile(file));
        if(!res.items.length) return toast('거래 내역을 찾지 못했습니다.');
        let use = res.items;
        if(res.months.length > 1){
          const pick = isNew ? res.period : root.querySelector('[name=period]').value;
          if(confirm(`파일에 ${res.months.map(m=>m.replace('-','.')).join(', ')} 거래가 있습니다.\n${pick.replace('-','.')} 거래만 불러올까요? (취소 = 전부 불러오기)`)) use = res.items.filter(i=>i.date.startsWith(pick));
        }
        const opening = bankOpening(use);
        items = use.map(({bal, ...i})=>i);
        if(isNew && use.length) root.querySelector('[name=period]').value = use[0].date.slice(0,7);
        if(opening != null) root.querySelector('[name=opening]').value = Math.round(opening);
        draw(); toast(`거래 ${use.length}건을 불러왔습니다. 금액과 찬조 표시를 확인해 주세요.`);
      }catch(err){ toast(err.message || '파일을 읽지 못했습니다. 암호가 걸린 파일인지 확인해 주세요.'); }
      e.target.value = '';
    };
    root.querySelector('#fimgs').onchange = async e => {
      for(const file of e.target.files){ try{ newImgs.push(await readImage(file, 1400)); }catch(err){} }
      e.target.value = ''; drawImgs();
    };
    root.querySelector('#ff').onsubmit = async e => {
      e.preventDefault();
      const fd = Object.fromEntries(new FormData(e.target));
      const period = fd.period || period0;
      const rows = read().filter(i=>i.amount > 0);
      const fund = f ? f.fund : (fd.fund || '본회');
      const exist = (D().finance||[]).find(x=>x.period === period && x.fund === fund);
      if(isNew && exist && !confirm(`${fund} ${period.replace('-','.')} 보고가 이미 있습니다. 덮어쓸까요?`)) return;
      const btn = e.submitter; btn.disabled = true; btn.textContent = '저장 중…';
      try{
        const id = f?.id || exist?.id || uid();
        const paths = [...images];
        for(let k = 0; k < newImgs.length; k++){
          const path = `finance/${id}/${Date.now()}-${k}.jpg`;
          await q(sb.storage.from(BUCKET).upload(path, dataUrlToBlob(newImgs[k]), {contentType:'image/jpeg', upsert:false}));
          paths.push(path);
        }
        const removed = (f?.images || exist?.images || []).filter(p=>!paths.includes(p));
        if(removed.length) sb.storage.from(BUCKET).remove(removed);
        const me = member(Store.me.memberId);
        await q(sb.from('jw_finance').upsert({id, period, fund, opening_balance: Math.round(+String(fd.opening).replace(/[^\d.-]/g,'') || 0),
          items: rows, note: fd.note || '', images: paths, updated_by: me ? me.name : (Store.me.admin ? '관리자' : ''), updated_at: new Date().toISOString()}, {onConflict:'period,fund'}));
        ui.finYear = period.slice(0,4); if(ui.finFund !== '전체') ui.finFund = fund;
        closeModal(); toast('재무보고를 저장했습니다.'); Store.refresh();
      }catch(err){ btn.disabled = false; btn.textContent = '저장'; }
    };
  });
}

/* ===================== 회칙 =====================
   jw_templates('bylaws') = {versions:[{rev,label,revised,effective,summary,text,registered,by}], history:[{rev,date}]}
   - 본문은 '제N조 (제목)' 단위로 나눠 목차·검색·조문 카드로 표시
   - 새 개정을 등록하면 이전 본은 보관되고, 바뀐 조문에 '개정' 표시 */
function parseBylaws(text){
  const arts = [];
  (text || '').split('\n').map(s=>s.trim()).filter(Boolean).forEach(line=>{
    const h = line.match(/^제\s*(\d+)\s*조\s*\(([^)]*)\)\s*(.*)$/);
    // '명 칭'처럼 한 글자씩 띄운 제목만 붙이고, '집행부 및 임원'은 그대로
    const tw = h && h[2].trim().split(/\s+/), title = h ? (tw.every(w=>w.length === 1) ? tw.join('') : tw.join(' ')) : '';
    if(h){ arts.push({no:+h[1], title, lines:[]}); if(h[3]) arts[arts.length-1].lines.push({lvl:0, text:h[3]}); return; }
    if(!arts.length) arts.push({no:0, title:'전문', lines:[]});
    const lvl = /^\d+\./.test(line) ? 1 : /^\d+\)/.test(line) ? 2 : 0;
    arts[arts.length-1].lines.push({lvl, text:line});
  });
  return arts;
}
const artKey = a => a.lines.map(l=>l.text.replace(/\s+/g,'')).join('|');
function Bylaws(){
  const d = D().bylaws;
  if(!d || !d.versions?.length) return `<div class="head"><h1>회칙</h1>${can.officer()?'<button class="btn pri" id="blNew">+ 회칙 등록</button>':''}</div><div class="empty">등록된 회칙이 없습니다.</div>`;
  const vs = [...d.versions].sort((a,b)=>b.rev - a.rev);
  const v = vs.find(x=>String(x.rev) === String(ui.blRev)) || vs[0];
  const prev = vs.find(x=>x.rev < v.rev);
  const arts = parseBylaws(v.text), prevArts = prev ? parseBylaws(prev.text) : [];
  const changed = a => prev && artKey(prevArts.find(p=>p.no === a.no) || {lines:[]}) !== artKey(a);
  const q = (ui.blQ || '').trim();
  const hl = s => q ? esc(s).split(esc(q)).join(`<mark>${esc(q)}</mark>`) : esc(s);
  const shown = q ? arts.filter(a=>(a.title + ' ' + a.lines.map(l=>l.text).join(' ')).includes(q)) : arts;
  const fmtD = s => (s||'').replace(/-/g,'.');
  return `
  <div class="head"><div><h1>정우회 회칙</h1><div class="muted" style="font-size:13px;margin-top:4px">${esc(v.label)} · ${fmtD(v.revised)} 개정 · ${fmtD(v.effective)} 시행${v === vs[0] ? ' <span class="tag new">현행</span>' : ' <span class="tag gray">이전 회칙</span>'}</div></div>
    <div class="row">${vs.length > 1 ? `<select class="input" id="blRev">${vs.map(x=>`<option value="${x.rev}" ${x===v?'selected':''}>${esc(x.label)} (${fmtD(x.revised)})</option>`).join('')}</select>` : ''}
      <button class="btn" id="blPrint">🖨 인쇄</button>${can.officer()?'<button class="btn pri" id="blNew">+ 개정 등록</button>':''}</div></div>
  <div class="panel no-print" style="margin-bottom:14px">
    <div class="row" style="justify-content:space-between;gap:10px">
      <div class="row" style="gap:6px;flex-wrap:wrap">${arts.map(a=>`<a class="tag" href="javascript:void(0)" data-art="${a.no}" style="cursor:pointer">제${a.no}조 ${esc(a.title)}${changed(a)?' •':''}</a>`).join('')}</div>
      <input class="input" id="blQ" placeholder="조문 검색 (예: 회비, 경조사)" value="${esc(q)}" style="min-width:200px;flex:1;max-width:280px">
    </div>
    ${v.summary ? `<div class="muted" style="font-size:13px;margin-top:10px">개정 요지: ${esc(v.summary)}</div>` : ''}
  </div>
  ${shown.length ? shown.map(a=>`<div class="panel" id="art-${a.no}" style="margin-bottom:12px">
      <h2 style="margin-bottom:8px">제${a.no}조 (${esc(a.title)}) ${changed(a)?`<span class="tag off">${esc(v.label)}에서 변경</span>`:''}</h2>
      ${a.lines.map(l=>`<div style="padding-left:${l.lvl===2?28:l.lvl===1?10:0}px;margin:5px 0;line-height:1.7;${l.lvl===0?'':''}">${hl(l.text)}</div>`).join('')}
    </div>`).join('') : `<div class="empty">'${esc(q)}'이(가) 들어간 조문이 없습니다.</div>`}
  <div class="panel" style="margin-top:4px"><h2>개정 이력</h2>
    <div class="row" style="gap:8px;flex-wrap:wrap">${[...(d.history||[])].sort((a,b)=>a.rev-b.rev).map(h=>`<span class="tag ${h.rev===v.rev?'off':'gray'}">${h.rev}차 개정 ${fmtD(h.date)}</span>`).join('')}</div>
    <div class="muted" style="font-size:12px;margin-top:8px">${esc(v.by||'')} · ${fmtD(v.registered)} 등록</div></div>`;
}
function bylawsForm(){
  const d = D().bylaws || {versions:[], history:[]};
  const last = [...d.versions].sort((a,b)=>b.rev - a.rev)[0];
  const rev = (last?.rev || 0) + 1;
  openModal(`<h2>${last ? `${rev}차 개정 등록` : '회칙 등록'}</h2>
    <p class="muted" style="margin-top:-6px;font-size:13px">본문은 '제1조 (명칭) …' 형식으로 조문마다 줄을 바꿔 적어 주세요. 이전 회칙은 그대로 보관되고, 바뀐 조문에 표시가 붙습니다.</p>
    <form class="form" id="blf">
      <label>개정 차수<input class="input" name="rev" type="number" value="${rev}" required></label>
      <label>개정일<input class="input" name="revised" type="date" value="${today()}" required></label>
      <label>시행일<input class="input" name="effective" type="date" value="${today()}" required></label>
      <label>개정 요지<input class="input" name="summary" placeholder="예: 회비 인상, 경조사 범위 조정"></label>
      <label class="full">회칙 본문<textarea class="input" name="text" rows="16" required style="font-size:14px;line-height:1.6">${esc(last?.text || '')}</textarea></label>
      <div class="full row" style="justify-content:flex-end"><button type="button" class="btn" data-close>취소</button><button class="btn pri">저장</button></div>
    </form>`, root=>{
    root.querySelector('#blf').onsubmit = async e=>{
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target)), r = +f.rev;
      if(!parseBylaws(f.text).some(a=>a.no > 0)) return toast("'제1조 (…)' 형식의 조문을 찾지 못했습니다.");
      const me = member(Store.me.memberId);
      const ver = {rev:r, label:`${r}차 개정`, revised:f.revised, effective:f.effective, summary:f.summary, text:f.text.trim(),
        registered:today(), by: me ? me.name : '관리자'};
      const data = {versions:[...d.versions.filter(x=>x.rev !== r), ver], history:[...(d.history||[]).filter(h=>h.rev !== r), {rev:r, date:f.revised}]};
      await q(sb.from('jw_templates').upsert({key:'bylaws', data, updated_by:ver.by, updated_at:new Date().toISOString()}));
      ui.blRev = String(r); closeModal(); toast(`${ver.label}을 등록했습니다.`); Store.refresh();
    };
  });
}

/* ===================== 예산안 =====================
   jw_templates('budgets') = {years:{'2027':{status:'draft'|'final', approved, note, income:[{name,basis,amount}], expense:[{cat,name,basis,amount,note}]}}}
   - 금액은 원 단위 저장, 입력·표시는 만 원 단위
   - 새 연도는 전년 예산을 복사해서 시작 / 재무보고의 실제 지출과 비교 */
const man = n => { const v = Math.round(+n || 0) / 10000; return (Number.isInteger(v) ? v.toLocaleString('ko-KR') : v.toLocaleString('ko-KR', {maximumFractionDigits:1})) + '만'; };
const budgetYears = () => Object.keys(D().budgets?.years || {}).sort().reverse();
function Budget(){
  const years = budgetYears();
  const y = years.includes(ui.budYear) ? ui.budYear : years[0];
  const b = y ? D().budgets.years[y] : null;
  const head = `<div class="head"><div><h1>예산안</h1><div class="muted" style="font-size:13px;margin-top:4px">${b && b.kind==='settlement' ? `${y}년 결산 (정기총회 재무보고) · 단위: 원` : '연도별 수입·지출 계획 (단위: 만 원)'}</div></div>
    <div class="row">${years.length ? `<select class="input" id="budY">${years.map(x=>`<option value="${x}" ${x===y?'selected':''}>${x}${D().budgets.years[x].kind==='settlement'?' (결산)':' (예산)'}</option>`).join('')}</select>` : ''}
      ${b ? '<button class="btn" id="budFile" style="display:none">📄 원본 PDF</button><button class="btn" id="budPrint">🖨 인쇄</button><button class="btn" id="budXlsx">⬇ 엑셀</button>' : ''}
      ${can.officer() ? `${b ? `<label class="btn">📎 PDF 첨부<input type="file" id="budFileUp" accept="application/pdf,image/*" hidden></label>${b.kind==='settlement'?'':'<button class="btn" id="budEdit">수정</button>'}` : ''}<button class="btn pri" id="budNew">+ 새 연도</button>` : ''}</div></div>`;
  if(!b) return head + '<div class="empty">등록된 예산안이 없습니다.</div>';
  if(b.kind === 'settlement') return Settlement(y, b, head);
  const exp = b.expense || [], inc = b.income || [];
  const expT = exp.reduce((s,i)=>s + (+i.amount||0), 0), incT = inc.reduce((s,i)=>s + (+i.amount||0), 0);
  const cats = [...new Set(exp.map(i=>i.cat || '기타'))];
  const pct = n => expT ? (n / expT * 100).toFixed(1) + '%' : '-';
  // 재무보고 실제 지출 (해당 연도)
  const fin = (D().finance||[]).filter(f=>f.period.startsWith(y) && f.fund === '본회');   // 예산은 본회 운영 기준
  const actual = fin.reduce((s,f)=>s + finTotals(f).exp, 0);
  return head + `
  <div class="grid kpis">
    <div class="panel kpi"><div class="l">${y}년 수입 계획</div><div class="n" style="font-size:22px;color:var(--ok)">${man(incT)}원</div></div>
    <div class="panel kpi"><div class="l">${y}년 지출 계획</div><div class="n" style="font-size:22px;color:var(--warn)">${man(expT)}원</div></div>
    <div class="panel kpi"><div class="l">수지 차액</div><div class="n" style="font-size:22px;color:${incT - expT < 0 ? 'var(--warn)' : 'inherit'}">${incT - expT < 0 ? '-' : ''}${man(Math.abs(incT - expT))}원</div><div class="l">${incT - expT < 0 ? '수입 부족' : '예비·이월'}</div></div>
    <div class="panel kpi"><div class="l">실제 지출 (재무보고·본회)</div><div class="n" style="font-size:22px">${fin.length ? man(actual) + '원' : '-'}</div><div class="l">${fin.length ? `집행률 ${expT ? Math.round(actual / expT * 100) : 0}% · ${fin.length}개월` : '재무보고 등록 후 자동 계산'}</div></div>
  </div>
  <div class="panel" style="margin-top:16px">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">${y}년 예산안 ${b.status === 'final' ? `<span class="tag new">확정${b.approved ? ' · ' + b.approved.replace(/-/g,'.') : ''}</span>` : '<span class="tag off">작성 중(안)</span>'}</h2></div>
    ${b.note ? `<p class="muted" style="font-size:13px;white-space:pre-wrap">${esc(b.note)}</p>` : ''}
    <h3 style="font-size:15px;margin:14px 0 6px">수입</h3>
    <div style="overflow-x:auto"><table><tr><th>항목</th><th>산출 근거</th><th style="text-align:right">금액</th></tr>
      ${inc.map(i=>`<tr><td>${esc(i.name)}</td><td class="muted">${esc(i.basis||'')}</td><td style="text-align:right">${man(i.amount)}</td></tr>`).join('')}
      <tr style="font-weight:700;background:var(--soft)"><td colspan="2">수입 합계</td><td style="text-align:right">${man(incT)}</td></tr></table></div>
    <h3 style="font-size:15px;margin:18px 0 6px">지출</h3>
    <div style="overflow-x:auto"><table><tr><th>분류</th><th>항목</th><th class="hide-m">산출 근거</th><th style="text-align:right">금액</th><th style="text-align:right">비율</th></tr>
      ${cats.map(c=>{ const rows = exp.filter(i=>(i.cat||'기타')===c); const sub = rows.reduce((s,i)=>s + (+i.amount||0), 0);

/* ===================== 명찰 만들기 =====================
   배경 이미지(JPG/PNG) 위에 회원 이름·상호·직함(·사진)을 얹어 인쇄 크기(300dpi) 이미지로 일괄 출력
   - 미리보기에서 글자를 끌어서 위치 조정, 크기·색·굵기 조절 / 긴 이름은 자동 축소
   - 출력: 개별 JPG 묶음(ZIP) 또는 A4 인쇄용(자르는 선 포함)
   - 설정(배경·위치)은 jw_templates('nametag')에 저장 → 임원 모두 같은 설정 사용 */
const NT_PRESETS = [['90x60','정우회 명찰 90×60mm'],['100x70','가로 명찰 100×70mm'],['70x100','세로 명찰 70×100mm'],['90x55','명함형 90×55mm'],['54x86','카드형 54×86mm'],['custom','직접 입력']];
const NT_DPI = 300;
/* 기본값: 정우회 명찰 디자인 (위에서부터 상호 → 이름 → 직책, 가운데 정렬, 검정) */
const ntDefault = () => ({size:'90x60', w:90, h:60, bgPath:'', fields:{
  company:{on:true,  x:50, y:38, size:7.5, color:'#111111', bold:false},
  name:   {on:true,  x:50, y:55, size:16,  color:'#111111', bold:true,  spaced:true},
  title:  {on:true,  x:50, y:70, size:6.5, color:'#111111', bold:false, src:'position', spaced:true},
  photo:  {on:false, x:16, y:55, size:36}}});
const NT_LABEL = {title:'직함', name:'이름', company:'상호', photo:'사진'};
const nt = {cfg:null, bgImg:null, bgData:'', boxes:{}, sel:new Set(), filter:'all', q:'', loaded:false};

function ntText(key, m){
  const f = nt.cfg.fields[key];
  if(key === 'name') return f.spaced && m.name.length <= 4 ? m.name.split('').join(' ') : m.name;
  if(key === 'company') return m.company || '';
  if(key === 'title'){
    const pos = posNames(m.id).join(' · ') || (m.isNew ? '신입회원' : '회원');
    const t = f.src === 'company' ? (m.title || '') : f.src === 'both' ? [m.title, pos].filter(Boolean).join(' / ') : pos;
    return f.spaced && t.length <= 4 && !/\s/.test(t) ? t.split('').join(' ') : t;
  }
  return '';
}
/* 명찰 한 장 그리기 (미리보기·출력 공용). W,H = 픽셀 */
function ntDraw(ctx, W, H, m, photoImg){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);
  if(nt.bgImg){   // 배경: 비율 유지하며 꽉 채우기(cover)
    const r = Math.max(W / nt.bgImg.width, H / nt.bgImg.height), bw = nt.bgImg.width * r, bh = nt.bgImg.height * r;
    ctx.drawImage(nt.bgImg, (W - bw) / 2, (H - bh) / 2, bw, bh);
  }
  const boxes = {};
  const ph = nt.cfg.fields.photo;
  if(ph.on){
    const d = ph.size / 100 * H, cx = ph.x / 100 * W, cy = ph.y / 100 * H;
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, d/2, 0, Math.PI*2); ctx.closePath();
    if(photoImg){ ctx.clip(); const r = Math.max(d / photoImg.width, d / photoImg.height);
      ctx.drawImage(photoImg, cx - photoImg.width*r/2, cy - photoImg.height*r/2, photoImg.width*r, photoImg.height*r); }
    else { ctx.fillStyle = 'rgba(31,58,104,.12)'; ctx.fill(); ctx.fillStyle = '#1f3a68'; ctx.font = `700 ${d*0.4}px "Noto Sans KR", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(m.name.slice(0,1), cx, cy); }
    ctx.restore();
    boxes.photo = {x:cx - d/2, y:cy - d/2, w:d, h:d};
  }
  for(const key of ['company','name','title']){
    const f = nt.cfg.fields[key]; if(!f.on) continue;
    const text = ntText(key, m); if(!text) continue;
    let px = f.size / 100 * H;
    const maxW = W * 0.9 - (ph.on && Math.abs(ph.x - 50) > 20 ? ph.size / 100 * H : 0);
    ctx.font = `${f.bold ? 700 : 400} ${px}px "Noto Sans KR", sans-serif`;
    while(ctx.measureText(text).width > maxW && px > 6){ px *= 0.94; ctx.font = `${f.bold ? 700 : 400} ${px}px "Noto Sans KR", sans-serif`; }
    ctx.fillStyle = f.color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const x = f.x / 100 * W, y = f.y / 100 * H;
    ctx.fillText(text, x, y);
    const tw = ctx.measureText(text).width;
    boxes[key] = {x:x - tw/2 - 4, y:y - px*0.65, w:tw + 8, h:px*1.3};
  }
  return boxes;
}
const ntPx = mm => Math.round(mm / 25.4 * NT_DPI);
function ntPreviewMember(){

function ntRedraw(){
  const cv = $('#ntCanvas'); if(!cv) return;
  const {w, h} = nt.cfg, maxW = Math.min(cv.parentElement.clientWidth, 640), sc = Math.min(maxW / w, 420 / h);
  cv.width = Math.round(w * sc * 2); cv.height = Math.round(h * sc * 2);
  cv.style.width = Math.round(w * sc) + 'px'; cv.style.height = Math.round(h * sc) + 'px';
  const m = ntPreviewMember();
  nt.boxes = ntDraw(cv.getContext('2d'), cv.width, cv.height, m, m.photo && nt.cfg.fields.photo.on ? nt.photoCache?.[m.id] : null);
  const ctx = cv.getContext('2d'); ctx.strokeStyle = 'rgba(47,94,168,.35)'; ctx.setLineDash([6,6]);
  Object.values(nt.boxes).forEach(b=>ctx.strokeRect(b.x, b.y, b.w, b.h)); ctx.setLineDash([]);
  $('#ntPreviewName').textContent = m.name ? `미리보기: ${m.name}` : '';
}

const loadImg = src => new Promise((res,rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = src; });
async function ntLoad(){
  if(nt.loaded) return;
  nt.cfg = ntDefault(); nt.photoCache = {};
  try{
    const {data} = await sb.from('jw_templates').select('*').eq('key','nametag');
    if(data && data[0]){ const d = data[0].data || {}; nt.cfg = {...ntDefault(), ...d, fields:{...ntDefault().fields, ...(d.fields||{})}};
      Object.keys(nt.cfg.fields).forEach(k=>nt.cfg.fields[k] = {...ntDefault().fields[k], ...nt.cfg.fields[k]}); }
    if(nt.cfg.bgPath){ const u = await blobUrl(nt.cfg.bgPath); if(u) nt.bgImg = await loadImg(u); }
  }catch(e){ console.warn('명찰 설정을 불러오지 못했습니다', e); }
  nt.loaded = true;
}
async function ntPhotos(list){
  if(!nt.cfg.fields.photo.on) return;
  for(const m of list){ if(nt.photoCache[m.id] !== undefined || !m.photoPath) continue;
    try{ const u = await blobUrl(m.photoPath); nt.photoCache[m.id] = u ? await loadImg(u) : null; }catch(e){ nt.photoCache[m.id] = null; } }
}
async function ntRenderBlobs(list, onProgress){
  if(document.fonts && document.fonts.load){ try{ await Promise.all([document.fonts.load('700 40px "Noto Sans KR"'), document.fonts.load('400 40px "Noto Sans KR"')]); }catch(e){} }
  await ntPhotos(list);
  const W = ntPx(nt.cfg.w), H = ntPx(nt.cfg.h), cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const out = [];
  for(let i = 0; i < list.length; i++){
    const m = list[i];
    ntDraw(cv.getContext('2d'), W, H, m, nt.photoCache[m.id] || null);
    out.push({m, blob: await new Promise(r=>cv.toBlob(r, 'image/jpeg', 0.95))});
    onProgress && onProgress(i + 1, list.length);
  }
  return out;
}

  async nametag(){
    if(!can.officer()) return;
    if(!nt.loaded){ $('#view').innerHTML = '<div class="empty">명찰 설정을 불러오는 중…</div>'; await ntLoad();
      if(!nt.sel.size) ntMembers().forEach(m=>nt.sel.add(m.id)); return render(); }
    const cv = $('#ntCanvas');
    const redraw = async ()=>{ await ntPhotos([ntPreviewMember()]); ntRedraw(); };
    redraw();
    // 글자·사진 끌어서 옮기기
    let drag = null;
    const pos = e => { const r = cv.getBoundingClientRect(); return {x:(e.clientX - r.left) / r.width * cv.width, y:(e.clientY - r.top) / r.height * cv.height}; };
    cv.onpointerdown = e => { const p = pos(e);
      const hit = Object.entries(nt.boxes).reverse().find(([k,b])=>p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h);
      if(hit){ drag = {key:hit[0], dx:p.x - nt.cfg.fields[hit[0]].x/100*cv.width, dy:p.y - nt.cfg.fields[hit[0]].y/100*cv.height}; cv.setPointerCapture(e.pointerId); } };
    cv.onpointermove = e => { if(!drag) return; const p = pos(e), f = nt.cfg.fields[drag.key];
      f.x = Math.max(0, Math.min(100, (p.x - drag.dx) / cv.width * 100)); f.y = Math.max(0, Math.min(100, (p.y - drag.dy) / cv.height * 100)); ntRedraw(); };
    cv.onpointerup = cv.onpointercancel = () => { drag = null; };
    document.querySelectorAll('[data-f]').forEach(el=>{
      el.oninput = el.onchange = async ()=>{ const f = nt.cfg.fields[el.dataset.f], p = el.dataset.p;
        f[p] = el.type === 'checkbox' ? el.checked : el.type === 'range' ? +el.value : el.value;
        if(el.dataset.f === 'photo') await ntPhotos([ntPreviewMember()]);
        ntRedraw(); };
    });
    $('#ntSize').onchange = e=>{ const v = e.target.value; nt.cfg.size = v;
      if(v !== 'custom'){ const [w,h] = v.split('x').map(Number); nt.cfg.w = w; nt.cfg.h = h; }
      render(); };
    if($('#ntW')){ const upd = ()=>{ const w = +$('#ntW').value, h = +$('#ntH').value; if(w >= 20 && h >= 20 && w <= 300 && h <= 300){ nt.cfg.w = w; nt.cfg.h = h; ntRedraw(); } };
      $('#ntW').onchange = upd; $('#ntH').onchange = upd; }
    $('#ntBg').onchange = async e=>{ const file = e.target.files[0]; if(!file) return;
      nt.bgData = await readImage(file, 3000); nt.bgImg = await loadImg(nt.bgData); nt.bgDirty = true;
      const r = nt.bgImg.width / nt.bgImg.height, cr = nt.cfg.w / nt.cfg.h;
      if(Math.abs(r - cr) / cr > 0.08 && confirm(`배경 이미지 비율이 선택한 명찰 크기와 다릅니다.\n이미지 비율에 맞게 크기를 바꿀까요? (가로 ${nt.cfg.w}mm 기준 → 세로 ${Math.round(nt.cfg.w / r)}mm)`)){
        nt.cfg.size = 'custom'; nt.cfg.h = Math.round(nt.cfg.w / r); render(); } else ntRedraw();
      toast('배경을 적용했습니다. 다음에도 쓰려면 [설정 저장]을 누르세요.'); };
    $('#ntReset').onclick = ()=>{ const d = ntDefault().fields; Object.keys(d).forEach(k=>{ nt.cfg.fields[k].x = d[k].x; nt.cfg.fields[k].y = d[k].y; }); ntRedraw(); };
    const syncCount = ()=>{ $('#ntCount').textContent = `${nt.sel.size}명 선택`; };

    $('#ntNone').onclick = ()=>{ nt.sel.clear(); render(); };
    $('#ntFilter').onchange = e=>{ nt.filter = e.target.value; render(); };
    $('#ntQ').onchange = e=>{ nt.q = e.target.value; render(); };
    $('#ntSave').onclick = async ()=>{
      try{
        if(nt.bgDirty && nt.bgData){
          const path = `templates/nametag-bg-${Date.now()}.jpg`;
          await q(sb.storage.from(BUCKET).upload(path, dataUrlToBlob(nt.bgData), {contentType:'image/jpeg', upsert:false}));
          if(nt.cfg.bgPath) sb.storage.from(BUCKET).remove([nt.cfg.bgPath]);
          nt.cfg.bgPath = path; nt.bgDirty = false;
        }
        const me = member(Store.me.memberId);
        await q(sb.from('jw_templates').upsert({key:'nametag', data:nt.cfg, updated_by: me ? me.name : '관리자', updated_at:new Date().toISOString()}));
        toast('명찰 설정을 저장했습니다.');
      }catch(err){}
    };
    const run = async (btn, fn)=>{
      const list = activeMembers().filter(m=>nt.sel.has(m.id)).sort((a,b)=>ntMembers().indexOf(a) - ntMembers().indexOf(b));
      if(!list.length) return toast('출력할 회원을 선택해 주세요.');
      const label = btn.textContent; btn.disabled = true;
      try{ const res = await ntRenderBlobs(list, (i,n)=>{ $('#ntProg').textContent = `명찰 만드는 중… ${i} / ${n}`; }); await fn(res); }
      catch(err){ console.error(err); toast(err.message || '만들지 못했습니다.'); }
      finally{ btn.disabled = false; btn.textContent = label; $('#ntProg').textContent = ''; }
    };
    $('#ntZip').onclick = e=>run(e.currentTarget, async res=>{
      const Z = await loadJSZip(); const zip = new Z();
      res.forEach(({m, blob}, i)=>zip.file(`${String(i+1).padStart(3,'0')}_${m.name}.jpg`, blob));
      const out = await zip.generateAsync({type:'blob'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(out); a.download = `정우회_명찰_${res.length}명_${today()}.zip`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
      toast(`명찰 ${res.length}장을 ZIP으로 저장했습니다.`);
    });
    $('#ntPrint').onclick = e=>run(e.currentTarget, async res=>{
      const {w, h} = nt.cfg, M = 5, G = 0;    // A4 여백 5mm, 명찰끼리 붙여 배치(점선 하나로 함께 자름)
      const cols = Math.max(1, Math.floor((210 - 2*M + G) / (w + G))), rows = Math.max(1, Math.floor((297 - 2*M + G) / (h + G))), per = cols * rows;
      const urls = res.map(r=>URL.createObjectURL(r.blob));
      const pages = [];
      for(let i = 0; i < urls.length; i += per) pages.push(urls.slice(i, i + per));
      const win = window.open('', '_blank');
      if(!win) return toast('팝업이 차단되었습니다. 브라우저에서 팝업을 허용해 주세요.');
      win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>정우회 명찰 인쇄 (${res.length}장)</title>
        <style>@page{size:A4;margin:0}body{margin:0;font-family:sans-serif}.bar{padding:10px;text-align:center;background:#eef3fb}
        .sheet{width:210mm;height:297mm;box-sizing:border-box;padding:${M}mm;display:grid;grid-template-columns:repeat(${cols},${w}mm);grid-auto-rows:${h}mm;gap:${G}mm;justify-content:center;align-content:start;page-break-after:always}
        .sheet img{width:${w}mm;height:${h}mm;outline:0.2mm dashed #999;display:block}
        @media print{.bar{display:none}}</style></head><body>
        <div class="bar">A4 한 장에 ${per}장 · 총 ${pages.length}장 · 인쇄 설정에서 <b>배율 100%(실제 크기)</b>로 인쇄하세요 · 점선을 따라 자르면 됩니다 <button onclick="print()">🖨 인쇄</button></div>
        ${pages.map(pg=>`<div class="sheet">${pg.map(u=>`<img src="${u}">`).join('')}</div>`).join('')}</body></html>`);
      win.document.close();
    });

      await q(sb.rpc('jw_set_access_code', {p_new:v}));
      if(keyMode){ writeKey(v); sb = makeClient(v); }
      $('#newcode').value = ''; toast('접속 코드를 변경했습니다.');
    };
    $('#bak').onclick = ()=>download(`정우회_백업_${today()}.json`, JSON.stringify(D(),null,1), 'application/json');
  },
};

boot();
</script>
