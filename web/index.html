<!doctype html>
<html lang="ko">
<head>

<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --ink:#1b2333; --sub:#5d6b82; --line:#e3e8f0;
  --brand:#1f3a68; --brand-2:#2f5ea8; --accent:#c8a24a; --soft:#eef3fb;
  --ok:#2e7d5b; --warn:#b5543a; --radius:12px; --shadow:0 1px 3px rgba(20,30,50,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px}
a{color:var(--brand-2);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--brand);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}
.logo{font-weight:700;font-size:20px;letter-spacing:.5px;margin:4px 8px 22px}
.logo small{display:block;font-weight:400;font-size:12px;opacity:.7;margin-top:2px}
nav a{display:flex;gap:10px;align-items:center;color:#dfe7f5;padding:10px 12px;border-radius:8px;margin-bottom:2px}
nav a:hover{background:rgba(255,255,255,.08)}
nav a.on{background:#fff;color:var(--brand);font-weight:700}
main{padding:24px 28px;max-width:1280px;width:100%;min-width:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:22px;margin:0}
h2{font-size:16px;margin:0 0 12px}
.muted{color:var(--sub)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr)}
.two{grid-template-columns:3fr 2fr}
.kpi .n{font-size:28px;font-weight:700;color:var(--brand)}
.kpi .l{color:var(--sub);font-size:13px}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--warn)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.input,select.input,textarea.input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;min-width:0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--sub);font-weight:500;background:var(--soft)}
tr.click{cursor:pointer} tr.click:hover td{background:#fafcff}

<script>
/* =========================================================

const SUPABASE_URL = 'https://ltnwbinctflmczqnhuii.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0bndiaW5jdGZsbWN6cW5odWlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxMzkwMjUsImV4cCI6MjEwOTcxNTAyNX0.UL6jWktHRze0K6W6cw21uaoRp3i2lgVIe7aAAV_g5gg';
const BUCKET = 'jw-media';
/* 접속 방식 2가지
   1) 접속 코드: 코드를 요청 헤더(x-jw-key)로 보내면 DB가 관리자 권한으로 판정 — 지금 사용하는 방식

const KEY_STORE = 'jungwoo-access-code';
const readKey = () => { try{ return localStorage.getItem(KEY_STORE) || ''; }catch(e){ return ''; } };
const writeKey = v => { try{ v ? localStorage.setItem(KEY_STORE, v) : localStorage.removeItem(KEY_STORE); }catch(e){} };
function makeClient(key){
  return key
    ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {global:{headers:{'x-jw-key':key}},
        auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false, storageKey:'jungwoo-key-mode'}})
    : supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'implicit', storageKey:'jungwoo-auth'}});
}
let keyMode = !!readKey();
let sb = makeClient(readKey());

const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{ const r=Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));

function blankMember(name){
  return {id:'', name, birthYear:'', company:'', title:'', products:'', industry:'',
    phone:'', email:'', address:'', joined:'', guardianId:'', status:'active', memo:'',
    photo:'', companyImage:'', cardImage:'', photoPath:'', companyImagePath:'', cardImagePath:'', isFounder:false, rosterNo:''};
}

const IMG_KEYS = {photo:'photoPath', companyImage:'companyImagePath', cardImage:'cardImagePath'};
const fromMember = r => ({id:r.id, name:r.name, birthYear:r.birth_year||'', company:r.company||'', title:r.title||'',
  products:r.products||'', industry:r.industry||'', phone:r.phone||'', email:r.email||'', address:r.address||'',
  joined:r.joined||'', guardianId:r.guardian_id||'', status:r.status||'active', memo:r.memo||'',
  photoPath:r.photo_path||'', companyImagePath:r.company_image_path||'', cardImagePath:r.card_image_path||'',
  photo:'', companyImage:'', cardImage:'', isFounder:!!r.is_founder, rosterNo:r.roster_no ?? ''});
const toMember = m => ({name:m.name, birth_year:m.birthYear||'', company:m.company||'', title:m.title||'',
  products:m.products||'', industry:m.industry||'', phone:m.phone||'', email:(m.email||'').trim().toLowerCase(),
  address:m.address||'', joined:m.joined||'', guardian_id:m.guardianId||null, status:m.status||'active', memo:m.memo||'',
  photo_path:m.photoPath||'', company_image_path:m.companyImagePath||'', card_image_path:m.cardImagePath||'',
  is_founder:!!m.isFounder});
const fromTerm = r => ({id:r.id, memberId:r.member_id, positionId:r.position_id, start:r.started_on, end:r.ended_on||''});
const fromEvent = r => ({id:r.id, title:r.title, category:r.category||'', date:r.event_date, location:r.location||'',
  host:r.host_id||'', attendees:r.attendees ?? '', text:r.body||'', docs:r.docs||[], memo:r.memo||''});
const toEvent = e => ({title:e.title, category:e.category||'', event_date:e.date, location:e.location||'',
  host_id:e.host||null, attendees:(e.attendees===''||e.attendees==null) ? null : +e.attendees,
  body:e.text||'', docs:e.docs||[], memo:e.memo||''});
const fromHistory = r => ({id:r.id, date:r.happened_on, title:r.title, desc:r.description||'', source:r.source});
const toHistory = h => ({happened_on:h.date, title:h.title, description:h.desc||'', source:h.source||'manual'});

/* Supabase 호출 결과에서 오류를 토스트로 알리고 예외로 던짐 */
async function q(p){
  const {data, error} = await p;
  if(error){ toast('오류: ' + (error.message || error)); throw error; }
  return data;
}

const Store = {
  ready:false,
  db:{members:[], positions:[], terms:[], events:[], history:[]},
  me:{email:'', admin:false, officer:false, memberId:''},
  async loadMe(){
    const {data:{user}} = await sb.auth.getUser();
    const [admin, memberId, officer] = await Promise.all([
      q(sb.rpc('jw_is_admin')), q(sb.rpc('jw_my_member_id')), q(sb.rpc('jw_is_officer'))]);
    this.me = {email:user?.email||'', admin:!!admin, officer:!!officer, memberId:memberId||''};
  },
  async load(){
    const [ms, ps, ts, es, hs] = await Promise.all([
      q(sb.from('jw_members').select('*')),
      q(sb.from('jw_positions').select('*').order('sort_order')),
      q(sb.from('jw_terms').select('*')),
      q(sb.from('jw_events').select('*')),
      q(sb.from('jw_history').select('*'))]);
    this.db = {members:ms.map(fromMember),
      positions:ps.map(r=>({id:r.id, name:r.name, single:r.single, order:r.sort_order})),
      terms:ts.map(fromTerm), events:es.map(fromEvent), history:hs.map(fromHistory)};
    await this.signImages();
  },
  /* 비공개 저장소 이미지 → 12시간짜리 서명 URL을 한 번에 발급 */
  async signImages(){
    const paths = [];
    this.db.members.forEach(m=>Object.values(IMG_KEYS).forEach(k=>{ if(m[k]) paths.push(m[k]); }));
    if(!paths.length) return;
    const {data} = await sb.storage.from(BUCKET).createSignedUrls(paths, 60*60*12);
    const map = Object.fromEntries((data||[]).filter(x=>x.signedUrl).map(x=>[x.path, x.signedUrl]));
    this.db.members.forEach(m=>Object.entries(IMG_KEYS).forEach(([u,k])=>{ m[u] = map[m[k]] || ''; }));
  },
  async refresh(){ await this.load(); render(); },
};

function dataUrlToBlob(u){
  const [h,b] = u.split(','); const bin = atob(b); const a = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], {type:h.match(/:(.*?);/)[1]});
}
async function uploadImage(memberId, kind, dataUrl){
  const path = `${memberId}/${kind}-${Date.now()}.jpg`;
  await q(sb.storage.from(BUCKET).upload(path, dataUrlToBlob(dataUrl), {contentType:'image/jpeg', upsert:false}));
  return path;
}

/* 엑셀/CSV 일괄 등록
   - 이름으로 매칭, 빈 칸은 기존 값 유지
   - 추천인 칸 '창립' → 창립회원, '창립(홍길동)' → 창립회원 + 추천인 홍길동
   - 명부에 없는 추천인은 '휴면' 회원으로 자동 생성 */
async function importRows(rows){
  rows = rows.filter(r=>r.name);
  rows.forEach(r=>{
    const g = (r.guardian||'').trim();
    r.founder = g.startsWith('창립');
    r.guardian = g.startsWith('창립(') ? g.slice(3).replace(/[()]/g,'').trim() : (r.founder ? '' : g);
  });
  const M = () => D().members;
  // 같은 이름이 여럿이면 명부 번호(NO)로 구분
  const target = r => M().find(m=>r.no && String(m.rosterNo)===String(r.no) && m.name===r.name)
    || M().find(m=>m.name===r.name && (!r.no || !m.rosterNo || String(m.rosterNo)===String(r.no)));
  const guardianOf = n => M().filter(m=>m.name===n)
    .sort((a,b)=>(a.status==='inactive')-(b.status==='inactive') || (a.rosterNo||9999)-(b.rosterNo||9999))[0];
  let added = 0, guardians = 0;
  for(const r of rows){
    if(target(r)) continue;
    const [row] = await q(sb.from('jw_members').insert({name:r.name, roster_no:+r.no||null}).select('*'));
    M().push(fromMember(row)); added++;
  }
  const missing = [...new Set(rows.map(r=>r.guardian).filter(n=>n && !guardianOf(n)))];
  if(missing.length){
    const created = await q(sb.from('jw_members').insert(missing.map(name=>({name, status:'inactive', memo:'명부에 없는 추천인 (전 회원 추정)'}))).select('*'));
    M().push(...created.map(fromMember)); guardians = missing.length;
  }
  for(const r of rows){
    const patch = {is_founder:r.founder};
    if(r.joined) patch.joined = r.joined;
    if(+r.no) patch.roster_no = +r.no;
    [['company','company'],['products','products'],['birthYear','birth_year'],['phone','phone'],
     ['title','title'],['address','address'],['memo','memo'],['industry','industry']]
      .forEach(([k,c])=>{ if(r[k]) patch[c] = r[k]; });
    if(r.guardian) patch.guardian_id = guardianOf(r.guardian).id;
    else if(r.founder) patch.guardian_id = null;
    const t = target(r);
    await q(sb.from('jw_members').update(patch).eq('id', t.id));
    t.rosterNo = patch.roster_no ?? t.rosterNo;
  }
  return {added, guardians, total:rows.length};
}

/* 표(2차원 배열) → 회원 행. 머리글 줄을 자동으로 찾음 (제목 줄이 있어도 됨) */
function rowsFromTable(table){
  const norm = v => String(v ?? '').replace(/\s+/g,' ').trim();
  const hi = table.findIndex(r=>r.some(c=>/^(성명|회원명|이름)$/.test(norm(c))));
  if(hi < 0) throw new Error('"성명" 또는 "회원명" 머리글을 찾을 수 없습니다.');
  const head = table[hi].map(norm);
  const col = (...names) => head.findIndex(h=>names.some(n=>h.includes(n)));
  const ix = {no:head.findIndex(h=>/^(NO|번호|순번)$/i.test(h)), joined:col('입회'), name:head.findIndex(h=>/^(성명|회원명|이름)$/.test(h)),
    guardian:col('추천'), phone:col('전화','연락처','휴대'), company:col('근무처','회사','상호'), address:col('주소'),
    products:col('업종','제품','서비스'), birthYear:col('출생'), title:col('직함','직위'), memo:col('비고','메모')};
  const toJoined = v => {
    if(v === '' || v == null) return '';
    const t = typeof v === 'number' ? v.toFixed(2) : norm(v).replace(/[.\/-]+$/,'');
    const m = t.match(/^(\d{4})[.\/-](\d{1,2})/); return m ? `${m[1]}-${m[2].padStart(2,'0')}` : '';
  };
  return table.slice(hi+1).map(r=>{
    const o = {}; for(const k in ix) o[k] = ix[k] >= 0 ? norm(r[ix[k]]) : '';
    o.joined = ix.joined >= 0 ? toJoined(r[ix.joined]) : '';
    return o;
  }).filter(o=>o.name);
}
let xlsxLib = null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return xlsxLib ||= new Promise((res,rej)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ()=>res(window.XLSX); sc.onerror = ()=>rej(new Error('엑셀 모듈을 불러오지 못했습니다.'));
    document.head.appendChild(sc);
  });
}
async function readTableFile(f){
  if(/\.xlsx?$/i.test(f.name)){
    const X = await loadXLSX();
    const wb = X.read(await f.arrayBuffer(), {type:'array'});
    return X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''});
  }
  return parseCSV(await f.text());
}

/* ===================== 조회 헬퍼 ===================== */
const D = () => Store.db;
const member = id => D().members.find(m=>m.id===id);
const position = id => D().positions.find(p=>p.id===id);
const currentTerm = mid => D().terms.find(t=>t.memberId===mid && !t.end);
const isOfficer = mid => !!currentTerm(mid);
const recruits = mid => D().members.filter(m=>m.guardianId===mid);
const activeMembers = () => D().members.filter(m=>m.status!=='inactive');
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const can = {
  admin: () => Store.me.admin,
  officer: () => Store.me.admin || Store.me.officer,
  edit: m => Store.me.admin || (m && m.id === Store.me.memberId),
};

function guardianRanking(){
  const map = {};
  D().members.forEach(m=>{ if(m.guardianId){ (map[m.guardianId] ||= []).push(m); } });
  return Object.entries(map).map(([gid,list])=>({g:member(gid), list}))
    .filter(x=>x.g).sort((a,b)=>b.list.length-a.list.length || a.g.name.localeCompare(b.g.name,'ko'));
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2400);
}
function avatar(m, size){
  const st = size ? `style="width:${size}px;height:${size}px;font-size:${size*.38}px"` : '';
  return m.photo ? `<img class="av" ${st} src="${m.photo}" alt="">`
                 : `<span class="av" ${st}>${esc(m.name.slice(0,1))}</span>`;
}
function typeTag(m){
  const t = currentTerm(m.id);
  if(m.status==='inactive') return '<span class="tag gray">휴면</span>';
  return t ? `<span class="tag off">${esc(position(t.positionId)?.name||'임원')}</span>` : '<span class="tag">일반회원</span>';
}
const joinedLabel = m => m.joined ? m.joined.replace('-', '.') : m.isFounder ? '<span class="tag off">창립</span>' : '<span class="muted">기존회원</span>';
const memberLink = m => m ? `<a href="#/member/${m.id}">${esc(m.name)}</a>` : '<span class="muted">-</span>';

function readImage(file, max=520){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>{ const img = new Image(); img.onload = ()=>{
      const s = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement('canvas'); c.width=img.width*s; c.height=img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82));
    }; img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
function download(name, text, type='text/plain'){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  text = text.replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=c;
  }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}
const csvCell = v => /[",\n]/.test(v=String(v??'')) ? `"${v.replace(/"/g,'""')}"` : v;

function openModal(html, onMount){
  $('#modal-root').innerHTML = `<div class="mask"><div class="modal">${html}</div></div>`;
  const mask = $('#modal-root .mask');
  mask.addEventListener('click', e=>{ if(e.target===mask) closeModal(); });
  mask.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  onMount && onMount(mask);
}
function closeModal(){ $('#modal-root').innerHTML=''; }

function renderLogin(msg=''){
  renderGate(`<form id="kf"><label class="muted" style="font-size:13px">접속 코드</label>
    <input class="input" type="password" name="code" required autocomplete="current-password" placeholder="접속 코드 입력" style="width:100%;margin:6px 0 12px">
    <button class="btn pri" style="width:100%">들어가기</button></form>
    <p class="muted" style="font-size:13px;margin:12px 0 0">한 번 입력하면 이 기기에서는 다음부터 바로 열립니다.</p>
    <details ${msg?'open':''} style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px"><summary class="muted" style="cursor:pointer;font-size:13px">회원 이메일로 로그인</summary>
    <form id="lf" style="margin-top:12px"><label class="muted" style="font-size:13px">등록된 이메일</label>
    <input class="input" type="email" name="email" required autocomplete="email" placeholder="name@company.com" style="width:100%;margin:6px 0 12px">
    <button class="btn pri" style="width:100%">로그인 링크 받기</button></form>
    <p class="muted" style="font-size:13px;margin:14px 0 0">${msg || '이메일로 받은 링크를 누르면 바로 로그인됩니다.'}</p></details>`);
  $('#kf').onsubmit = async e=>{
    e.preventDefault();
    const code = new FormData(e.target).get('code').trim();
    const btn = e.target.querySelector('button'); btn.disabled = true; btn.textContent = '확인 중…';
    try{
      const trial = makeClient(code);
      const {data, error} = await trial.rpc('jw_check_key');
      if(error || !data){ btn.disabled = false; btn.textContent = '들어가기'; return toast('접속 코드가 맞지 않습니다.'); }
      writeKey(code); location.reload();
    }catch(err){ btn.disabled = false; btn.textContent = '들어가기'; toast('연결에 실패했습니다. 잠시 후 다시 시도해주세요.'); }
  };
  $('#lf').onsubmit = async e=>{
    e.preventDefault();
    const email = new FormData(e.target).get('email').trim().toLowerCase();
    const btn = e.target.querySelector('button');
    const reset = ()=>{ btn.disabled = false; btn.textContent = '로그인 링크 받기'; };
    btn.disabled = true; btn.textContent = '확인 중…';
    try{
      if(!await q(sb.rpc('jw_can_login', {p_email:email}))){ reset(); return toast('등록된 회원 이메일이 아닙니다. 사무국에 문의해주세요.'); }
      await q(sb.auth.signInWithOtp({email, options:{emailRedirectTo: location.origin + location.pathname,
        shouldCreateUser:true, data:{app:'jungwoo'}}}));
      renderLogin(`<b>${esc(email)}</b>(으)로 로그인 링크를 보냈습니다. 메일함(스팸함 포함)을 확인해주세요.`);
    }catch(err){ reset(); }
  };
}
let entering = false;
async function enter(){
  if(entering || Store.ready) return; entering = true;
  try{
    renderGate('<p class="muted">불러오는 중…</p>');
    if(keyMode){
      if(!await q(sb.rpc('jw_check_key'))){ writeKey(''); keyMode = false; sb = makeClient(''); return renderLogin(); }
      Store.me = {email:'접속 코드', admin:true, officer:true, memberId:''};
    } else await Store.loadMe();
    if(!Store.me.admin && !Store.me.memberId){
      renderGate(`<p><b>${esc(Store.me.email)}</b> 계정은 정우회 회원으로 등록되어 있지 않습니다.</p>
        <button class="btn" id="lo">다른 이메일로 로그인</button>`);
      $('#lo').onclick = ()=>sb.auth.signOut();
      return;
    }
    await Store.load();
    Store.ready = true; document.body.classList.remove('gate');
    if(!location.hash.startsWith('#/')) history.replaceState(null, '', location.pathname + '#/dashboard');
    render();
  }catch(e){
    renderGate('<p>데이터를 불러오지 못했습니다.</p><button class="btn" onclick="location.reload()">다시 시도</button>');
  }finally{ entering = false; }
}
function boot(){
  if(keyMode) return enter();
  sb.auth.onAuthStateChange((ev, session)=>{
  if(ev === 'SIGNED_OUT'){ Store.ready = false; return renderLogin(); }
  if(session && (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION')) return setTimeout(enter);
  if(!session && ev === 'INITIAL_SESSION'){
    const err = new URLSearchParams(location.hash.slice(1)).get('error_description');
    renderLogin(err ? '로그인 링크가 만료되었거나 이미 사용되었습니다. 다시 요청해주세요.' : '');
  }
  });
}

    <div class="panel kpi"><div class="l">다음 행사</div><div class="n">${next ? (dday===0?'D-DAY':'D-'+dday) : '-'}</div>
      <div class="l">${next ? esc(next.title) : '<a href="#/events">행사 등록 →</a>'}</div></div>
  </div>
  <div class="grid two" style="margin-top:16px">
    <div class="panel"><h2>월별 입회 추이</h2>

/* ===================== 화면: 회원명부 ===================== */
function filteredMembers(){
  const q = ui.q.trim();
  return D().members.filter(m=>{
    if(q && ![m.name,m.company,m.products,m.industry].join(' ').includes(q)) return false;
    if(ui.type==='officer' && !isOfficer(m.id)) return false;
    if(ui.type==='regular' && (isOfficer(m.id) || m.status==='inactive')) return false;
    if(ui.type==='inactive' && m.status!=='inactive') return false;
    if(ui.year==='old' && (m.joined || m.isFounder)) return false;
    if(ui.year==='founder' && !m.isFounder) return false;
    if(ui.year && ui.year!=='old' && ui.year!=='founder' && !m.joined.startsWith(ui.year)) return false;
    return true;
  }).sort((a,b)=>(b.joined||'0').localeCompare(a.joined||'0') || a.name.localeCompare(b.name,'ko'));
}
function Members(){
  const years = [...new Set(D().members.map(m=>m.joined.slice(0,4)).filter(Boolean))].sort().reverse();
  const list = filteredMembers();
  return `
  <div class="head"><h1>회원명부 <span class="muted" style="font-size:15px">${list.length}명</span></h1>
    <div class="row">
      ${can.officer()?'<button class="btn" id="exp">엑셀(CSV) 내보내기</button>':''}
      ${can.admin()?'<button class="btn pri" id="add">+ 회원 등록</button>':''}

function memberForm(m){
  const isNew = !m; m = m || blankMember('');
  const lock = can.admin() ? '' : 'disabled';
  const opts = D().members.filter(x=>x.id!==m.id).sort((a,b)=>a.name.localeCompare(b.name,'ko'))
    .map(x=>`<option value="${x.id}" ${x.id===m.guardianId?'selected':''}>${esc(x.name)}</option>`).join('');
  const f = (k,l,type='text',cls='',dis='') => `<label class="${cls}">${l}<input class="input" name="${k}" type="${type}" value="${esc(m[k])}" ${dis}></label>`;
  const imgf = (k,l) => `<label>${l}<input class="input" type="file" accept="image/*" data-img="${k}">
    ${m[k]?`<span class="row"><img src="${m[k]}" style="height:40px;border-radius:4px"><button type="button" class="btn sm danger" data-rmimg="${k}">삭제</button></span>`:''}</label>`;
  openModal(`<h2>${isNew?'회원 등록':'회원 정보 수정'}</h2>
    <form class="form" id="mf">
      ${f('name','이름 *')}${f('birthYear','출생연도','number')}
      ${f('company','회사명')}${f('title','회사 직함')}
      ${f('products','제품(서비스)','text','full')}
      ${f('industry','업종')}${f('phone','전화','tel')}
      ${f('email','로그인 이메일','email','',lock)}${f('joined','입회월 (비우면 기존회원)','month','',lock)}
      ${f('address','주소','text','full')}
      <label class="full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="isFounder" ${m.isFounder?'checked':''} ${lock}> 창립회원</label>
      <label>추천인<select class="input" name="guardianId" ${lock}><option value="">없음</option>${opts}</select></label>
      <label>상태<select class="input" name="status" ${lock}><option value="active">활동</option><option value="inactive" ${m.status==='inactive'?'selected':''}>휴면</option></select></label>
      ${imgf('photo','인물 사진')}${imgf('companyImage','회사 이미지')}${imgf('cardImage','명함 이미지')}
      <label class="full">메모<textarea class="input" name="memo" rows="3">${esc(m.memo)}</textarea></label>
      <div class="full row" style="justify-content:space-between">
        <div>${isNew||!can.admin()?'':'<button type="button" class="btn danger" id="del">회원 삭제</button>'}</div>
        <div class="row"><button type="button" class="btn" data-close>취소</button><button class="btn pri">저장</button></div>
      </div>
    </form>`, root=>{
      const imgs = {};
      root.querySelectorAll('[data-img]').forEach(inp=>inp.onchange=async()=>{
        if(inp.files[0]) imgs[inp.dataset.img] = await readImage(inp.files[0], inp.dataset.img==='cardImage'?900:520);
      });
      root.querySelectorAll('[data-rmimg]').forEach(b=>b.onclick=()=>{ imgs[b.dataset.rmimg]=''; b.parentElement.remove(); });
      root.querySelector('#mf').onsubmit = async e=>{
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        if(can.admin()) data.isFounder = 'isFounder' in data;
        if(!data.name.trim()) return toast('이름을 입력해주세요.');
        if(D().members.some(x=>x.name===data.name.trim() && x.id!==m.id) && !confirm('같은 이름의 회원이 있습니다. 그래도 저장할까요?')) return;
        const btn = e.submitter; if(btn){ btn.disabled = true; btn.textContent = '저장 중…'; }
        try{
          const next = {...m, ...data, name:data.name.trim()};
          let id = m.id;
          if(isNew){ const [row] = await q(sb.from('jw_members').insert(toMember(next)).select('id')); id = row.id; }
          for(const [k, pk] of Object.entries(IMG_KEYS)){
            if(!(k in imgs)) continue;
            if(m[pk]) sb.storage.from(BUCKET).remove([m[pk]]);
            next[pk] = imgs[k] ? await uploadImage(id, k, imgs[k]) : '';
          }
          await q(sb.from('jw_members').update(toMember(next)).eq('id', id));
          closeModal(); toast('저장했습니다.');
          await Store.load();
          isNew ? (location.hash = '#/member/'+id) : render();
        }catch(err){ if(btn){ btn.disabled = false; btn.textContent = '저장'; } }
      };
      const del = root.querySelector('#del');
      if(del) del.onclick = async ()=>{
        if(!confirm(`${m.name} 회원을 삭제할까요? 추천 관계와 직책 이력도 함께 정리됩니다.`)) return;
        await q(sb.from('jw_members').delete().eq('id', m.id));
        const files = Object.values(IMG_KEYS).map(k=>m[k]).filter(Boolean);
        if(files.length) sb.storage.from(BUCKET).remove(files);
        closeModal(); await Store.load(); location.hash = '#/members';
      };
    });
}

/* ===================== 화면: 추천인 ===================== */
function Guardians(){
  const rank = guardianRanking();
  const total = rank.reduce((s,r)=>s+r.list.length,0);
  const roots = D().members.filter(m=>!m.guardianId && recruits(m.id).length);
  const tree = (m, depth=0) => depth>8 ? '' : `<li>${memberLink(m)} ${recruits(m.id).length?`<span class="muted">(${recruits(m.id).length})</span>`:''}
    ${recruits(m.id).length?`<ul>${recruits(m.id).map(r=>tree(r,depth+1)).join('')}</ul>`:''}</li>`;
  return `
  <div class="head"><h1>추천인</h1><span class="muted">총 ${rank.length}명의 추천인 · 추천 ${total}건 · 자동 집계</span></div>
  <div class="grid two">
    <div class="panel" style="padding:0;overflow-x:auto"><table>
      <tr><th style="width:44px">순위</th><th>추천인</th><th>횟수</th><th class="hide-m">추천한 회원</th></tr>
      ${rank.map((r,i)=>`<tr><td>${i+1}</td><td>${memberLink(r.g)}</td><td><b>${r.list.length}</b></td>
        <td class="hide-m"><div class="row">${r.list.map(x=>`<a class="tag" href="#/member/${x.id}">${esc(x.name)}</a>`).join('')}</div></td></tr>`).join('')}
    </table></div>
    <div class="panel"><h2>추천 계보</h2>
      <p class="muted" style="margin-top:-6px;font-size:13px">추천인 → 추천받은 회원 → 그 회원이 추천한 회원 순으로 이어집니다.</p>
      <div class="tree"><ul>${roots.map(r=>tree(r)).join('')}</ul></div>
    </div>
  </div>`;
}

      const cur = currentTerm(memberId);
      if(cur && cur.positionId===positionId) return toast('이미 같은 직책입니다.');

function positionsForm(){
  const rowHtml = p => `<div class="row" data-pid="${p.id}" style="margin-bottom:8px">
    <input class="input" value="${esc(p.name)}" data-name style="flex:1">
    <label class="row" style="font-size:13px"><input type="checkbox" data-single ${p.single?'checked':''}>1인 직책</label>
    <button type="button" class="btn sm" data-up>↑</button><button type="button" class="btn sm danger" data-rm>삭제</button></div>`;
  const pos = [...D().positions].sort((a,b)=>a.order-b.order);
  openModal(`<h2>직책 설정</h2>
    <p class="muted" style="margin-top:-6px;font-size:13px">1인 직책은 새로 지정하면 기존 담당자가 자동 해제됩니다.</p>
    <div id="plist">${pos.map(rowHtml).join('')}</div>
    <button type="button" class="btn sm" id="padd">+ 직책 추가</button>
    <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-close>취소</button><button class="btn pri" id="psave">저장</button></div>`, root=>{
    const list = root.querySelector('#plist');
    const wire = () => list.querySelectorAll('[data-pid]').forEach(r=>{
      r.querySelector('[data-up]').onclick=()=>{ r.previousElementSibling && list.insertBefore(r, r.previousElementSibling); };
      r.querySelector('[data-rm]').onclick=()=>{
        if(D().terms.some(t=>t.positionId===r.dataset.pid)) return toast('이력이 있는 직책은 삭제할 수 없습니다. 이름만 변경해주세요.');
        r.remove();
      };
    });
    wire();
    root.querySelector('#padd').onclick=()=>{ list.insertAdjacentHTML('beforeend', rowHtml({id:uid(),name:'',single:false})); wire(); };
    root.querySelector('#psave').onclick=async()=>{
      const rows = [...list.querySelectorAll('[data-pid]')].map((r,i)=>({id:r.dataset.pid,
        name:r.querySelector('[data-name]').value.trim(), single:r.querySelector('[data-single]').checked, sort_order:i})).filter(p=>p.name);
      const removed = D().positions.filter(p=>!rows.some(r=>r.id===p.id)).map(p=>p.id);
      if(removed.length) await q(sb.from('jw_positions').delete().in('id', removed));
      if(rows.length) await q(sb.from('jw_positions').upsert(rows));
      closeModal(); Store.refresh();
    };
  });
}

function historyForm(h){
  const isNew = !h; h = h || {id:'', date:today(), title:'', desc:'', source:'manual'};
  openModal(`<h2>${isNew?'연혁 추가':'연혁 수정'}</h2>
    <form class="form" id="hf">
      <label>일자<input class="input" type="date" name="date" value="${h.date}" required></label>
      <label>제목 *<input class="input" name="title" value="${esc(h.title)}" required></label>
      <label class="full">내용<textarea class="input" name="desc" rows="3">${esc(h.desc)}</textarea></label>
      <div class="full row" style="justify-content:space-between">
        <div>${isNew?'':'<button type="button" class="btn danger" id="hdel">삭제</button>'}</div>
        <div class="row"><button type="button" class="btn" data-close>취소</button><button class="btn pri">저장</button></div>
      </div></form>`, root=>{
    root.querySelector('#hf').onsubmit = async ev=>{
      ev.preventDefault();
      const next = {...h, ...Object.fromEntries(new FormData(ev.target))};
      if(isNew) await q(sb.from('jw_history').insert(toHistory(next)));
      else await q(sb.from('jw_history').update(toHistory(next)).eq('id', h.id));
      closeModal(); Store.refresh();
    };
    const del = root.querySelector('#hdel');
    if(del) del.onclick=async()=>{ await q(sb.from('jw_history').delete().eq('id', h.id)); closeModal(); Store.refresh(); };
  });
}

/* ===================== 화면: 관리·백업 ===================== */

  return `
  <div class="head"><h1>관리·백업</h1></div>
  <div class="grid two">

      <p class="muted" style="font-size:13px">인식하는 머리글: NO · 입회년월 · 성명 · 추천인 · 전화번호 · 근무처 · 주소 · 업종 · 비고</p>
      <pre class="text" style="font-size:13px">NO,입회년월,성명,추천인,전화번호,근무처,주소,업종,비고
2026-08,박홍진,김상원,영진종합유통,위생용품,1981,</pre>

      <p class="muted">현재 로그인 가능 회원: <b>${D().members.filter(m=>m.email && m.status!=='inactive').length}</b>명 / 전체 ${D().members.length}명</p>
      <hr style="border:none;border-top:1px solid var(--line);margin:16px 0">

      <div class="row"><input class="input" type="password" id="newcode" placeholder="새 접속 코드 (8자 이상)" style="flex:1;min-width:180px"><button class="btn" id="setcode">변경</button></div>
      <hr style="border:none;border-top:1px solid var(--line);margin:16px 0">
      <h2>데이터 백업</h2>

    <div class="muted">회원 ${D().members.length}명 · 직책 ${D().positions.length}개 · 임원 이력 ${D().terms.length}건 · 행사 ${D().events.length}건 · 연혁 ${D().history.length}건</div>

/* ===================== 이벤트 바인딩 ===================== */
function bindRowLinks(){
  document.querySelectorAll('[data-href]').forEach(el=>el.onclick=()=>location.hash=el.dataset.href);
}
const bind = {
  dashboard: bindRowLinks,
  members(){
    bindRowLinks();
    $('#type').value = ui.type; $('#year').value = ui.year;
    const refresh = ()=>{ $('#mlist').innerHTML = memberList(filteredMembers()); bindRowLinks();
      $('.head h1 span').textContent = filteredMembers().length+'명'; };
    $('#q').oninput = e=>{ ui.q=e.target.value; refresh(); };
    $('#type').onchange = e=>{ ui.type=e.target.value; refresh(); };
    $('#year').onchange = e=>{ ui.year=e.target.value; refresh(); };
    document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ ui.view=b.dataset.v; render(); });
    if($('#add')) $('#add').onclick = ()=>memberForm();
    if($('#exp')) $('#exp').onclick = ()=>{
      const head = ['NO','입회월','회원명','구분','직책','회사','직함','제품','업종','출생연도','전화','이메일','주소','추천인','추천횟수'];
      const rows = filteredMembers().map(m=>{ const t=currentTerm(m.id); return [m.rosterNo, m.joined||(m.isFounder?'창립':'기존회원'), m.name, t?'임원':'일반회원',
        t?position(t.positionId)?.name:'', m.company, m.title, m.products, m.industry, m.birthYear, m.phone, m.email, m.address,
        member(m.guardianId)?.name||'', recruits(m.id).length]; });
      download(`정우회_회원명부_${today()}.csv`, '﻿'+[head,...rows].map(r=>r.map(csvCell).join(',')).join('\n'), 'text/csv');
    };
  },
  member(id){ const m = member(id); if(m && $('#edit')) $('#edit').onclick = ()=>memberForm(m); },
  officers(){
    if(!can.admin()) return;
    $('#assign').onclick = assignForm;
    $('#pos').onclick = positionsForm;
    document.querySelectorAll('[data-end]').forEach(b=>b.onclick=async()=>{
      const date = prompt('임기 종료일 (YYYY-MM-DD)', today());
      if(!date) return;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return toast('날짜 형식은 YYYY-MM-DD 입니다.');
      await q(sb.from('jw_terms').update({ended_on:date}).eq('id', b.dataset.end)); Store.refresh();
    });
  },
  events(){
    $('#ey').onchange = e=>{ ui.eventYear=e.target.value; render(); };
    if($('#eadd')) $('#eadd').onclick = ()=>eventForm();
    document.querySelectorAll('[data-eedit]').forEach(b=>b.onclick=()=>eventForm(D().events.find(e=>e.id===b.dataset.eedit)));
    document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{
      try{ await navigator.clipboard.writeText(D().events.find(e=>e.id===b.dataset.copy).text); toast('문구를 복사했습니다.'); }
      catch(e){ toast('복사에 실패했습니다. 직접 선택해 복사해주세요.'); }
    });
    document.querySelectorAll('[data-dup]').forEach(b=>b.onclick=async()=>{
      const src = D().events.find(e=>e.id===b.dataset.dup);
      const y = +src.date.slice(0,4);
      const copy = {...src, date:(y+1)+src.date.slice(4), title:src.title.replace(String(y), String(y+1)), docs:[], attendees:''};
      await q(sb.from('jw_events').insert(toEvent(copy)));
      ui.eventYear = String(y+1); toast(`${y+1}년으로 복제했습니다. 날짜를 확인해주세요.`); Store.refresh();
    });
  },
  history(){
    if($('#hadd')) $('#hadd').onclick = ()=>historyForm();
    document.querySelectorAll('[data-hedit]').forEach(b=>b.onclick=()=>historyForm(D().history.find(h=>h.id===b.dataset.hedit)));
  },
  settings(){
    $('#csv').onchange = async e=>{
      const f = e.target.files[0]; if(!f) return;
      let data;
      try{ data = rowsFromTable(await readTableFile(f)); }
      catch(err){ e.target.value = ''; return toast(err.message || '파일을 읽지 못했습니다.'); }
      if(!data.length){ e.target.value = ''; return toast('등록할 회원 행이 없습니다.'); }
      if(!confirm(`${data.length}명의 정보를 반영할까요? (같은 이름은 갱신)`)){ e.target.value = ''; return; }
      try{ const res = await importRows(data);
        toast(`${res.total}명 반영 · 신규 ${res.added}명${res.guardians?` · 명부 외 추천인 ${res.guardians}명(휴면)`:''}`); }
      finally{ e.target.value = ''; Store.refresh(); }
    };
    $('#tpl').onclick = ()=>download('정우회_회원등록양식.csv', '﻿NO,입회년월,성명,추천인,전화번호,근무처,주소,업종,비고\n', 'text/csv');
    $('#setcode').onclick = async ()=>{
      const v = $('#newcode').value.trim();
      if(v.length < 8) return toast('접속 코드는 8자 이상으로 정해주세요.');
      if(!confirm('접속 코드를 변경할까요?')) return;
      await q(sb.rpc('jw_set_access_code', {p_new:v}));
      if(keyMode){ writeKey(v); sb = makeClient(v); }
      $('#newcode').value = ''; toast('접속 코드를 변경했습니다.');
    };
    $('#bak').onclick = ()=>download(`정우회_백업_${today()}.json`, JSON.stringify(D(),null,1), 'application/json');
  },
};

boot();
</script>
</body>
</html>
