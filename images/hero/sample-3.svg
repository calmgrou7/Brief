<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- 샘플: 전원주택 테라스 썬룸 (실제 시공 사진으로 교체) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fa6c4"/><stop offset=".7" stop-color="#d7e2e4"/><stop offset="1" stop-color="#eee6d3"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8cab6f"/><stop offset="1" stop-color="#55743f"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".4" stop-color="#dfeef3" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".25"/></linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9e4da"/><stop offset="1" stop-color="#d4cdbf"/></linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <g fill="#9bb3a0" opacity=".7"><ellipse cx="300" cy="700" rx="520" ry="160"/><ellipse cx="1600" cy="690" rx="600" ry="170"/></g>
  <rect y="760" width="1920" height="320" fill="url(#grass)"/>
  <!-- house -->
  <rect x="1180" y="300" width="620" height="520" fill="url(#house)"/>
  <polygon points="1150,310 1490,120 1830,310" fill="#3b3d42"/>
  <rect x="1580" y="420" width="140" height="180" fill="#5f7480"/><rect x="1580" y="420" width="140" height="180" fill="none" stroke="#2a2c30" stroke-width="8"/>
  <!-- sunroom -->
  <polygon points="380,400 1180,330 1180,820 380,820" fill="#f3efe6" opacity=".15"/>
  <polygon points="380,400 1180,330 1180,360 380,430" fill="#2a2c30"/>
  <g stroke="#2a2c30" stroke-width="12" fill="url(#gl)">
    <polygon points="380,430 1180,360 1180,420 380,480"/>
    <rect x="380" y="480" width="200" height="340"/><rect x="580" y="480" width="200" height="340"/>
    <rect x="780" y="480" width="200" height="340"/><rect x="980" y="480" width="200" height="340"/>
  </g>
  <g stroke="#2a2c30" stroke-width="6"><line x1="580" y1="413" x2="580" y2="480"/><line x1="780" y1="396" x2="780" y2="480"/><line x1="980" y1="378" x2="980" y2="480"/></g>
  <!-- inside -->
  <rect x="470" y="700" width="240" height="18" rx="9" fill="#5a4636"/><rect x="500" y="718" width="10" height="90" fill="#5a4636"/><rect x="670" y="718" width="10" height="90" fill="#5a4636"/>
  <rect x="820" y="730" width="260" height="80" rx="20" fill="#e8e0d0"/><rect x="820" y="690" width="260" height="60" rx="20" fill="#ddd3c1"/>
  <circle cx="1120" cy="660" r="50" fill="#6f9160"/><rect x="1105" y="700" width="30" height="110" fill="#8d6b4a"/>
  <!-- deck -->
  <polygon points="300,820 1260,820 1360,880 200,880" fill="#a8835c"/>
  <polygon points="200,880 1360,880 1360,900 200,900" fill="#7d5f40"/>
  <g fill="#4e6d3e"><circle cx="160" cy="800" r="70"/><circle cx="240" cy="830" r="50"/><circle cx="1880" cy="790" r="80"/></g>
</svg>
