<title>채움 컨설팅 대시보드 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: PC는 좌측 내비 + 본문, 모바일은 상단바 + 하단 탭(가운데 '기록' 버튼). 채움 ver2.1 웹앱과 같은 네이비·청록 체계 */
:root {
  --bg: #f2f5f7; --surface: #ffffff; --surface-2: #f6f8f9; --ink: #172b3a; --muted: #5a6c7b; --line: #dde5eb;
  --accent: #176b70; --accent-ink: #ffffff; --accent-soft: #e7f3f1;
  --good: #23704d; --good-soft: #e6f4ec; --warn: #8a5a12; --warn-soft: #fdf2dc; --bad: #ae3d43; --bad-soft: #fbeaec;
  --info: #2c5d8a; --info-soft: #e8f0f8;
  --nav: #102a3c; --nav-2: #18394b; --nav-ink: #f3f7fa; --nav-muted: #a7bdcc; --nav-on: #69d4c3;
  --shadow: 0 1px 2px #17354b0d, 0 6px 20px #17354b0a;
  --font: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1c26; --surface: #172836; --surface-2: #1c3040; --ink: #ecf2f6; --muted: #a9bbc7; --line: #304555;
  --accent: #7cdbce; --accent-ink: #0d2a2e; --accent-soft: #1e3d42;
  --good: #8ad4ad; --good-soft: #1e3c32; --warn: #e8c37c; --warn-soft: #3d3420; --bad: #f2a1a5; --bad-soft: #452c33;
  --info: #9cc3ea; --info-soft: #20344a; --shadow: 0 1px 2px #0005, 0 6px 20px #0003; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1c26; --surface: #172836; --surface-2: #1c3040; --ink: #ecf2f6; --muted: #a9bbc7; --line: #304555;
  --accent: #7cdbce; --accent-ink: #0d2a2e; --accent-soft: #1e3d42;
  --good: #8ad4ad; --good-soft: #1e3c32; --warn: #e8c37c; --warn-soft: #3d3420; --bad: #f2a1a5; --bad-soft: #452c33;
  --info: #9cc3ea; --info-soft: #20344a; --shadow: 0 1px 2px #0005, 0 6px 20px #0003; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font); letter-spacing: -0.015em; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--nav); }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
a { color: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.35; letter-spacing: -0.03em; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 3px solid #2d9997; outline-offset: 2px; border-radius: 6px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- 틀 ---------- */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; background: linear-gradient(170deg, var(--nav), var(--nav-2)); color: var(--nav-ink); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px 14px; text-decoration: none; }
.mark { width: 28px; height: 28px; flex: none; background: linear-gradient(135deg, #a2e3d7, #5dbbad); clip-path: polygon(0 22%, 44% 0, 44% 35%, 100% 6%, 100% 72%, 56% 100%, 56% 62%, 0 94%); }
.brand b { display: block; font-size: 16px; }
.brand small { display: block; font-size: 11px; color: var(--nav-muted); letter-spacing: 0; }
.side-search { display: flex; align-items: center; gap: 8px; margin: 0 4px 6px; padding: 9px 12px; border-radius: 10px; background: #ffffff12; color: var(--nav-muted); border: 0; cursor: pointer; font-size: 13px; text-align: left; }
.side-search kbd { margin-left: auto; font: 11px var(--font); padding: 1px 6px; border-radius: 5px; border: 1px solid #ffffff2a; }
.side-log { margin: 0 4px 12px; justify-content: center; }
.nav { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; color: var(--nav-muted); text-decoration: none; font-weight: 600; font-size: 14px; }
.nav:hover { background: #ffffff0d; color: var(--nav-ink); }
.nav[aria-current="page"] { background: #ffffff15; color: #fff; box-shadow: inset 3px 0 var(--nav-on); }
.nav .cnt { margin-left: auto; font-size: 11px; background: #ae3d43; color: #fff; border-radius: 999px; padding: 0 7px; line-height: 18px; }
.side-foot { margin-top: auto; padding: 12px 12px 0; border-top: 1px solid #ffffff1a; font-size: 12px; color: var(--nav-muted); display: grid; gap: 4px; }
.sync { display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--nav-on); }

.main { min-width: 0; padding-block: 24px 64px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); max-width: 1240px; width: 100%; }
.topbar, .tabbar { display: none; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; align-items: center; gap: 8px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); background: var(--nav); color: var(--nav-ink); }
  .topbar .brand { padding: 0; margin-right: auto; }
  .topbar .brand b { font-size: 15px; }
  .ibtn { display: inline-grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--nav-muted); cursor: pointer; }
  .main { padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-top: 4px; padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px)); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .tab { display: grid; justify-items: center; gap: 1px; min-height: 52px; padding-top: 6px; font-size: 11px; font-weight: 600; color: var(--muted); text-decoration: none; position: relative; background: none; border: 0; cursor: pointer; }
  .tab svg.i { width: 23px; height: 23px; }
  .tab[aria-current="page"] { color: var(--accent); }
  .tab .badge-dot { position: absolute; top: 4px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
  .tab-log { align-self: center; }
  .tab-log span.fab { display: grid; place-items: center; width: 54px; height: 54px; margin-top: -22px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 18px #176b7055; }
  .tab-log span.fab svg.i { width: 26px; height: 26px; }
}

/* ---------- 공통 ---------- */
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 8px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 13px; margin-bottom: 18px; }
.banner a { font-weight: 700; }
.banner button { margin-left: auto; border: 0; background: none; color: inherit; cursor: pointer; font-weight: 700; padding: 4px 6px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.head h1 { font-size: 25px; }
.head p { color: var(--muted); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px; min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.card-h h2 { font-size: 16px; }
.card-h .sub { font-size: 13px; color: var(--muted); }
.card-h a, .linkbtn { font-size: 13px; color: var(--accent); font-weight: 700; text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; }
@media (max-width: 860px) { .card { padding: 16px; border-radius: 12px; } .head h1 { font-size: 21px; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 15px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sm { min-height: 34px; padding: 4px 11px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn svg.i { width: 17px; height: 17px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; line-height: 1.7; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.st-잠재 { background: var(--surface-2); color: var(--muted); }
.st-상담중 { background: var(--warn-soft); color: var(--warn); }
.st-계약진행 { background: var(--info-soft); color: var(--info); }
.st-사후관리 { background: var(--good-soft); color: var(--good); }
.st-종료 { background: var(--bad-soft); color: var(--bad); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.tag { display: inline-block; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); line-height: 1.8; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.empty { padding: 20px 4px; text-align: center; color: var(--muted); font-size: 14px; }

/* ---------- 홈: 오늘 브리핑 ---------- */
.home { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1080px) { .home { grid-template-columns: minmax(0, 1fr); } }
.brief { font-size: 15px; color: var(--muted); margin-top: 2px; }
.brief b { color: var(--ink); }
.brief b.bad { color: var(--bad); }

.queue { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.qi { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.qi:first-child { border-top: 0; }
.qi .stripe { align-self: stretch; border-radius: 2px; background: var(--line); }
.qi.k-over .stripe { background: var(--bad); }
.qi.k-today .stripe { background: var(--warn); }
.qi.k-stale .stripe { background: #c98b8f; }
.qi.k-ins .stripe { background: var(--info); }
.qi.k-soon .stripe { background: var(--accent); }
.qi-main { min-width: 0; display: grid; gap: 1px; }
.qi-top { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
.qi-top .when { color: var(--muted); font-weight: 600; }
.qi.k-over .qi-top .kind { color: var(--bad); }
.qi.k-today .qi-top .kind { color: var(--warn); }
.qi.k-stale .qi-top .kind { color: var(--bad); }
.qi.k-ins .qi-top .kind { color: var(--info); }
.qi.k-soon .qi-top .kind { color: var(--accent); }
.qi-title { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.qi-co { font-size: 13px; color: var(--muted); text-decoration: none; }
.qi-co:hover { color: var(--accent); }
.qi-acts { display: flex; gap: 6px; }
.qi-acts .btn { min-height: 36px; padding: 4px 10px; font-size: 13px; }
@media (max-width: 560px) {
  .qi { grid-template-columns: 4px minmax(0, 1fr); }
  .qi-acts { grid-column: 2; }
  .qi-acts .btn { flex: 1; }
}
.qfilter { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 4px; }
.qfilter::-webkit-scrollbar { display: none; }

.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); display: grid; gap: 2px; text-decoration: none; }
a.kpi:hover { border-color: var(--accent); }
.kpi span { font-size: 12px; color: var(--muted); font-weight: 600; }
.kpi b { font-size: 26px; letter-spacing: -0.04em; line-height: 1.25; }
.kpi b small { font-size: 13px; color: var(--muted); font-weight: 600; margin-left: 2px; }
.kpi.alert b { color: var(--bad); }
.kpi em { font-style: normal; font-size: 12px; color: var(--muted); }
.side-col { display: grid; gap: 18px; }

.feed { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.feed li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.feed li:first-child { border-top: 0; }
.mi { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.mi svg.i { width: 17px; height: 17px; }
.feed .t { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed .s { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed .r { font-size: 12px; color: var(--muted); }

/* ---------- 업체 목록 ---------- */
.tools { display: grid; gap: 10px; margin-bottom: 14px; }
.search { position: relative; }
.search svg.i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
input.field, select.field, textarea.field { width: 100%; min-height: 46px; padding: 10px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 16px; }
.search input.field { padding-left: 42px; }
textarea.field { min-height: 84px; resize: vertical; line-height: 1.55; }
.field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 5px; min-height: 36px; padding: 4px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip .n { opacity: .65; }
.chip svg.i { width: 15px; height: 15px; }

.rows { display: grid; grid-template-columns: minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.co { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); }
.co:first-child { border-top: 0; }
.co-link { display: grid; gap: 3px; min-width: 0; text-decoration: none; }
.co-link:hover .co-name { color: var(--accent); }
.co-l1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.co-name { font-weight: 700; font-size: 15px; }
.co-l2 { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.co-l3 { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; align-items: center; }
.touch.stale { color: var(--bad); font-weight: 700; }
.next { color: var(--ink); }
.next b { color: var(--accent); }
.co-acts { display: flex; gap: 6px; }
.co-acts .btn { min-height: 38px; width: 42px; padding: 0; }
@media (max-width: 560px) {
  .co { grid-template-columns: minmax(0, 1fr); }
  .co-acts { display: grid; grid-template-columns: repeat(3, 1fr); }
  .co-acts .btn { width: auto; gap: 5px; }
  .co-acts .btn span { display: inline; }
}
.co-acts .btn span { display: none; }
@media (max-width: 560px) { .co-acts .btn span { display: inline; font-size: 13px; } }

/* ---------- 업체 상세 ---------- */
.back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); text-decoration: none; margin-bottom: 8px; }
.ch { display: grid; gap: 12px; margin-bottom: 14px; }
.ch-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start; }
.ch h1 { font-size: 25px; }
.ch-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; color: var(--muted); }
.ch-acts { display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 860px) { .ch h1 { font-size: 21px; } .ch-acts { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; } }

.pulse { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.pulse > div { padding: 12px 16px; border-left: 1px solid var(--line); display: grid; gap: 1px; min-width: 0; }
.pulse > div:first-child { border-left: 0; }
.pulse span { font-size: 12px; color: var(--muted); font-weight: 600; }
.pulse b { font-size: 17px; letter-spacing: -0.03em; }
.pulse em { font-style: normal; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pulse .bad { color: var(--bad); }
.pulse .up { color: var(--good); }
@media (max-width: 700px) { .pulse { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pulse > div:nth-child(3) { border-left: 0; } .pulse > div:nth-child(n+3) { border-top: 1px solid var(--line); } }

.nextcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 14px 16px; border-radius: var(--r); background: var(--accent-soft); margin-top: 12px; }
.nextcard .lbl { font-size: 12px; font-weight: 700; color: var(--accent); }
.nextcard .txt { font-weight: 700; font-size: 15px; }
.nextcard .when { font-size: 13px; color: var(--muted); }
.nextcard.over { background: var(--bad-soft); }
.nextcard.over .lbl { color: var(--bad); }
@media (max-width: 560px) { .nextcard { grid-template-columns: minmax(0, 1fr); } .nextcard .row { display: grid; grid-template-columns: 1fr 1fr; } }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin: 18px 0 16px; position: sticky; top: 0; z-index: 5; background: var(--bg); }
.tabs::-webkit-scrollbar { display: none; }
@media (max-width: 860px) { .tabs { top: calc(env(safe-area-inset-top, 0px) + 60px); } }
.dt { flex: none; border: 0; background: none; padding: 11px 13px; min-height: 44px; font-weight: 700; font-size: 14px; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; }
.dt[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.dt .n { font-size: 12px; opacity: .7; margin-left: 3px; }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 960px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.note { padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 6px; align-content: start; }
.note h3 { font-size: 13px; color: var(--accent); }
.note p { font-size: 14px; white-space: pre-wrap; }
dl.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); column-gap: 18px; margin: 0; }
dl.facts > div { padding: 9px 0; border-bottom: 1px solid var(--line); min-width: 0; }
dl.facts dt { font-size: 12px; color: var(--muted); font-weight: 600; }
dl.facts dd { margin: 1px 0 0; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }

.tl { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.tl li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.tl li:first-child { border-top: 0; }
.tl .h { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.tl .h b { font-size: 14px; }
.tl .h span { font-size: 12px; color: var(--muted); }

  function spark(rows) {
    if (rows.length < 2) return '';
    const W = 520, H = 120, pl = 8, pr = 8, pt = 22, pb = 22;
    const max = Math.max(...rows.map((r) => r.rev)) * 1.08, min = 0;
    const x = (i) => pl + (i * (W - pl - pr)) / (rows.length - 1);
    const y = (v) => pt + (1 - (v - min) / (max - min)) * (H - pt - pb);
    const pts = rows.map((r, i) => `${x(i).toFixed(1)},${y(r.rev).toFixed(1)}`);
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="연도별 매출 추이">
      <line class="ax" x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}"/>
      <path class="ar" d="M${x(0)},${H - pb} L${pts.join(' L')} L${x(rows.length - 1)},${H - pb} Z"/>
      <polyline class="ln" points="${pts.join(' ')}"/>

  /* ---------- 접촉 기록 시트 ---------- */
  const sheet = { cid: null, method: '전화', step: 'who', nextDays: null, nextText: '' };

  function renderSheet(enter) {

      const todayIds = queue().filter((x) => ['over', 'today'].includes(x.kind)).map((x) => x.cid);
      const recent = [...contacts].sort((a, b) => b.date.localeCompare(a.date)).map((x) => x.cid);
      const order = [...new Set([...todayIds, ...recent, ...companies.map((x) => x.id)])];

    } else {
      const opts = [[1, '내일'], [3, '3일 뒤'], [7, '1주 뒤'], [14, '2주 뒤'], [0, '정하지 않음']];
      inner = `<span class="step">${sheet.fromWhat ? '3/3 · ' : ''}다음 액션</span>
        <label><span class="lab">다음에 할 일</span><input class="field" id="next-text" value="${esc(sheet.nextText || c.next || '')}" placeholder="예) 신청서류 체크리스트 송부"></label>

  function whoList(order, todayIds, q) {

    const list = order.map(coById).filter((c) => !ql || (c.name + c.ceo).toLowerCase().includes(ql));
    if (!list.length) return '<p class="empty">찾는 업체가 없습니다.</p>';
    return list.slice(0, 8).map((c, i) => `${i === 0 && !ql && todayIds.includes(c.id) ? '<span class="hint">오늘 할 일이 있는 업체</span>' : ''}<button data-act="pick" data-cid="${c.id}"><span class="mi">${ic('building')}</span><span style="display:grid"><b>${esc(c.name)}</b><span>${esc(c.ceo)} · ${lastTouch(c) ? `${lastTouch(c).method} ${rel(lastTouch(c).date)}` : '접촉 없음'}</span></span></button>`).join('');
  }
  function saveLog() {
    const c = coById(sheet.cid);
    const nt = (layer.querySelector('#next-text')?.value || '').trim();
    if (sheet.fromWhat) {
      const now = new Date();
      const hh = now.toLocaleTimeString('en-GB', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit' });
      contacts.push({ id: 'k' + ++seq, cid: c.id, date: `${TODAY}T${hh}`, method: sheet.method, sum: (sheet.memo || `${sheet.method} 접촉`).split('\n')[0].slice(0, 60), body: '', follow: '', followDue: '', done: false });
    }
    if (sheet.nextDays && nt) { c.next = nt; c.nextDate = D(sheet.nextDays); }
    if (sheet.nextDays === 0) { c.next = ''; c.nextDate = ''; }
    layer.innerHTML = '';
    toast(sheet.fromWhat ? `${sheet.method} 기록 저장${sheet.nextDays && nt ? ` · 다음 액션 ${md(D(sheet.nextDays))}` : ''}` : '다음 액션을 저장했습니다');
    render();
  }

  /* ---------- 검색 ---------- */
  function openSearch() {
    layer.innerHTML = `<div class="scrim" data-act="close-sheet"><div class="sheet enter" role="dialog" aria-modal="true" aria-label="업체 찾기" data-stop>
      <input class="field" id="s-q" placeholder="기업명·대표자·전화·사업자번호" autocomplete="off">
      <div class="sres" id="s-res">${searchRes('')}</div></div></div>`;
    layer.querySelector('#s-q').focus();
  }
  function searchRes(q) {
    const ql = q.trim().toLowerCase(), dq = ql.replace(/\D/g, '');
    const list = companies.filter((c) => !ql || (c.name + c.ceo + c.ind).toLowerCase().includes(ql) || (dq.length >= 3 && [c.biz, c.mobile, c.phone].some((v) => v.replace(/\D/g, '').includes(dq))));
    return list.length ? list.map((c, i) => `<a href="#c-${c.id}" class="${i === 0 && ql ? 'on' : ''}" data-act="close-after"><b>${esc(c.name)}</b><span>${esc(c.ceo)} · ${c.status}</span></a>`).join('') : '<p class="empty">찾는 업체가 없습니다.</p>';
  }

  /* ---------- 토스트 ---------- */
  let toastTimer;
  function toast(msg, undo) {
    clearTimeout(toastTimer);
    document.querySelector('.toast')?.remove();
    const t = document.createElement('div');
    t.className = 'toast'; t.setAttribute('role', 'status');
    t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button>되돌리기</button>' : ''}`;
    if (undo) t.querySelector('button').onclick = () => { undo(); t.remove(); render(); };
    document.body.appendChild(t);
    toastTimer = setTimeout(() => t.remove(), 4000);
  }

  /* ---------- 라우팅 ---------- */
  function route() { return (location.hash || '#home').slice(1) || 'home'; }
  function render() {
    const r = route();
    const top = r.startsWith('c-') ? 'companies' : r;
    view.innerHTML = r === 'companies' ? companiesView() : r.startsWith('c-') ? companyView(r.slice(2)) : r === 'schedule' ? scheduleView() : r === 'links' ? linksView() : r === 'changes' ? changesView() : home();
    document.querySelectorAll('[data-nav]').forEach((a) => a.toggleAttribute('aria-current', false) || (a.dataset.nav === top && a.setAttribute('aria-current', 'page')));
    const urgent = queue().filter((x) => ['over', 'today'].includes(x.kind)).length;
    document.getElementById('nav-cnt').textContent = urgent || '';
    document.getElementById('nav-cnt').hidden = !urgent;
    document.getElementById('tab-dot').hidden = !urgent;
  }
  window.addEventListener('hashchange', () => { if (!route().startsWith('c-')) state.tab = 'overview'; layer.innerHTML = ''; render(); window.scrollTo(0, 0); });

  /* ---------- 이벤트 ---------- */
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const a = el.dataset.act;
    if (a === 'close-sheet' && e.target.closest('[data-stop]')) return;
    if (['log', 'search', 'done', 'snooze', 'qf', 'st', 'stale', 'tab', 'method', 'to-next', 'nd', 'save-log', 'pick', 'close', 'close-sheet', 'hide-banner', 'next-done', 'toast'].includes(a)) e.preventDefault();
    if (a === 'log') openLog(el.dataset.cid, el.dataset.step);
    if (a === 'search') openSearch();
    if (a === 'close' || a === 'close-sheet') layer.innerHTML = '';
    if (a === 'close-after') layer.innerHTML = '';
    if (a === 'qf') { state.qf = el.dataset.v; render(); }
    if (a === 'st') { state.coSt = el.dataset.v; render(); }
    if (a === 'stale') { state.coStale = !state.coStale; render(); }
    if (a === 'go-stale') { state.coStale = true; }
    if (a === 'tab') { state.tab = el.dataset.v; render(); }
    if (a === 'toast') toast(el.dataset.msg);
    if (a === 'hide-banner') { state.bannerHidden = true; try { localStorage.setItem('chaeum.banner', '1'); } catch (err) { /* 무시 */ } render(); }
    if (a === 'done') {
      const key = el.dataset.key, cid = el.dataset.contact;
      const x = cid && contacts.find((y) => y.id === cid);
      if (x) x.done = true; else doneKeys.add(key);
      toast('완료 처리했습니다', () => { if (x) x.done = false; else doneKeys.delete(key); });
      render();
    }
    if (a === 'snooze') { const key = el.dataset.key; snoozed[key] = D(3); toast(`${md(D(3))}로 미뤘습니다`, () => delete snoozed[key]); render(); }
    if (a === 'next-done') { const c = coById(el.dataset.cid); const prev = [c.next, c.nextDate]; c.next = ''; c.nextDate = ''; toast('다음 액션을 완료했습니다. 새 다음 액션을 정해 두세요', () => { [c.next, c.nextDate] = prev; }); render(); }
    if (a === 'pick') { sheet.cid = el.dataset.cid; sheet.step = 'what'; renderSheet(); }
    if (a === 'method') { sheet.memo = layer.querySelector('#memo').value; sheet.method = el.dataset.v; renderSheet(); }
    if (a === 'to-next') { sheet.memo = layer.querySelector('#memo').value; sheet.fromWhat = true; sheet.step = 'next'; renderSheet(); }
    if (a === 'nd') { sheet.nextText = layer.querySelector('#next-text').value; sheet.nextDays = +el.dataset.v; renderSheet(); }
    if (a === 'save-log') saveLog();
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'co-q') {
      state.coQ = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const f = document.getElementById('co-q'); f.focus(); f.setSelectionRange(pos, pos);
    }
    if (e.target.id === 'who-q') {
      const todayIds = queue().filter((x) => ['over', 'today'].includes(x.kind)).map((x) => x.cid);
      document.getElementById('who-list').innerHTML = whoList(companies.map((c) => c.id), todayIds, e.target.value);
    }
    if (e.target.id === 's-q') document.getElementById('s-res').innerHTML = searchRes(e.target.value);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && layer.innerHTML) layer.innerHTML = '';
    if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); openSearch(); }
    if (e.key === 'Enter' && e.target.id === 's-q') { const first = document.querySelector('#s-res a'); if (first) { location.hash = first.getAttribute('href'); layer.innerHTML = ''; } }
  });

  render();
})();
</script>
