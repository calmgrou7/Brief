<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>보험지기 · 중복 보장</title>
<style>
  @font-face { font-family: P; src: url(../../fonts/Pretendard-Bold.otf); font-weight: 700; }
  @font-face { font-family: P; src: url(../../fonts/Pretendard-Black.otf); font-weight: 900; }
  :root { --bg: #FFF7EE; --main: #4A2E1F; --accent: #F07A22; --red: #E5484D; --green: #12A150; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: P, sans-serif; color: var(--main); }
  #stage { position: absolute; inset: 0; }
  .abs { position: absolute; }
  #topbar { left: 0; top: 0; width: 1080px; height: 14px; background: var(--accent); }
  #badge { left: 50px; top: 50px; font-size: 40px; font-weight: 900; color: var(--accent); }
  #title { width: 1080px; top: 170px; text-align: center; font-size: 84px; font-weight: 900; }
  .policy { width: 420px; height: 270px; border-radius: 36px; background: #fff; box-shadow: 0 18px 40px rgba(74,46,31,.15);
            padding: 34px 38px; top: 380px; border: 5px solid #F3E2D2; }
  .policy .co { font-size: 34px; color: #9A7F70; }
  .policy .nm { font-size: 52px; font-weight: 900; margin-top: 6px; }
  .policy .fee { font-size: 42px; margin-top: 26px; color: var(--accent); font-weight: 900; }
  .policy svg { position: absolute; right: 30px; top: 30px; }
  #stamp { left: 340px; top: 420px; width: 400px; height: 190px; border: 12px solid var(--red); border-radius: 28px;
           color: var(--red); font-size: 120px; font-weight: 900; text-align: center; line-height: 162px; background: rgba(255,255,255,.85); }
  #leak { left: 90px; top: 760px; width: 900px; height: 200px; border-radius: 40px; background: var(--main); color: #fff;
          display: flex; align-items: center; justify-content: space-between; padding: 0 56px; }
  #leak .lb { font-size: 44px; }
  #leak .num { font-size: 84px; font-weight: 900; color: #FFC58F; font-variant-numeric: tabular-nums; }
  .coin { width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE7A3, #F2B33D 60%, #C98516);
          color: #8A5A00; font-weight: 900; font-size: 46px; text-align: center; line-height: 84px; box-shadow: 0 6px 0 #B0740F; }
  #fixed { left: 140px; top: 420px; width: 800px; height: 260px; border-radius: 40px; background: #fff; border: 6px solid var(--green);
           display: flex; align-items: center; gap: 30px; padding: 0 44px; box-shadow: 0 18px 40px rgba(18,161,80,.18); }
  #fixed .t { font-size: 58px; font-weight: 900; color: var(--green); }
  #fixed .s { font-size: 36px; color: #4B6B57; margin-top: 8px; }
  #char { left: 0; top: 0; width: 720px; height: 715px; transform-origin: 50% 100%; }
  #char img { position: absolute; inset: 0; width: 100%; height: 100%; }
  #glint { position: absolute; left: 76px; top: 201px; width: 122px; height: 122px; border-radius: 50%; overflow: hidden; }
  #glint i { position: absolute; top: -40px; width: 34px; height: 220px; background: rgba(255,255,255,.9); transform: rotate(30deg); filter: blur(3px); }
  #sub { left: 60px; width: 960px; top: 1700px; text-align: center; font-size: 46px; font-weight: 700; line-height: 1.35;
         background: rgba(74,46,31,.88); color: #fff; border-radius: 26px; padding: 22px 30px; }
  #fade { inset: 0; background: var(--bg); }
</style>
</head>
<body>
<div id="stage">
  <div id="topbar" class="abs"></div>
  <div id="badge" class="abs">지혜로운 보험생활</div>
  <div id="title" class="abs">점검 ① 중복 보장</div>

  <div id="pA" class="abs policy">
    <svg width="74" height="74" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z" fill="#F07A22"/><path d="M8 12l3 3 5-6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
    <div class="co">A 보험사</div><div class="nm">실손보험</div><div class="fee">월 38,000원</div>
  </div>
  <div id="pB" class="abs policy">
    <svg width="74" height="74" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z" fill="#F07A22"/><path d="M8 12l3 3 5-6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
    <div class="co">B 보험사</div><div class="nm">실손보험</div><div class="fee">월 32,000원</div>
  </div>
  <div id="stamp" class="abs">중복!</div>

  <div id="coins"></div>
  <div id="leak" class="abs"><div class="lb">1년에 새는 돈</div><div class="num" id="num">0원</div></div>

  <div id="fixed" class="abs">
    <svg width="130" height="130" viewBox="0 0 130 130"><circle cx="65" cy="65" r="58" fill="#E3F6EA"/>
      <path id="chk" d="M36 67 L57 88 L96 45" stroke="#12A150" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100"/></svg>
    <div><div class="t">하나로 정리!</div><div class="s">보장은 그대로, 보험료는 절약</div></div>
  </div>

  <div id="char" class="abs">
    <img id="cOpen" src="../../assets/bohumjigi_female.png">
    <img id="cBlink" src="../../assets/bohumjigi_female_blink.png">
    <img id="cTalk" src="../../assets/bohumjigi_female_talk.png">
    <div id="glint"><i></i></div>
  </div>

  <div id="sub" class="abs"></div>
  <div id="fade" class="abs"></div>
</div>
<script>
// ---- 타임라인: 모든 움직임을 시간 t(초)의 함수로 정의 → 프레임 단위로 정확히 재현 ----
const $ = id => document.getElementById(id);
const clamp = v => Math.max(0, Math.min(1, v));
const p = (t, s, d) => clamp((t - s) / d);                      // 구간 진행률 0~1
const outBack = x => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2);
const outCubic = x => 1 - Math.pow(1 - x, 3);
const inOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const set = (el, css) => Object.assign($(el).style, css);

const SUBS = [[0.3, 3.4, '같은 보장에 두 번\n돈 내고 있진 않나요?'],
              [3.6, 6.3, '실손보험은 여러 개 있어도\n실제 쓴 만큼만 나와요'],
              [6.5, 10, '하나로 정리하면\n보장은 그대로, 보험료는 절약!']];
const TALK = [[0.6, 3.3], [3.8, 6.2], [6.7, 9.2]];
const BLINK = [1.9, 5.1, 8.4];
const COINS = Array.from({ length: 9 }, (_, i) => ({ x: 160 + (i * 263) % 760, d: 4.2 + i * 0.18, r: (i % 2 ? 1 : -1) * (20 + i * 9) }));
$('coins').innerHTML = COINS.map((_, i) => `<div id="coin${i}" class="abs coin">₩</div>`).join('');

window.seek = t => {
  // 제목
  const ti = outCubic(p(t, 0, .5));
  set('title', { transform: `translateY(${(1 - ti) * -60}px)`, opacity: ti });

  // 보험 카드 A/B: 양쪽에서 들어와 → 가운데로 겹침 → 정리될 때 사라짐
  const inA = outBack(p(t, .5, .6)), inB = outBack(p(t, .9, .6)), meet = inOut(p(t, 2.0, .6)), gone = inOut(p(t, 6.2, .5));
  const shake = t > 2.75 && t < 3.15 ? Math.sin(t * 120) * 10 * (3.15 - t) / .4 : 0;
  set('pA', { left: `${-460 + inA * 530 + meet * 120 + shake}px`, transform: `rotate(${-4 + meet * 2}deg) scale(${1 - gone * .3})`, opacity: 1 - gone });
  set('pB', { left: `${1100 - inB * 540 - meet * 120 + shake}px`, top: `${380 + meet * 40}px`, transform: `rotate(${4 - meet * 2}deg) scale(${1 - gone * .3})`, opacity: 1 - gone });

  // 중복 도장 쾅
  const st = p(t, 2.7, .25);
  set('stamp', { opacity: st > 0 ? 1 - gone : 0, transform: `rotate(-12deg) scale(${2.4 - 1.4 * outCubic(st)})` });

  // 새는 돈 카운터 + 동전
  const lk = outBack(p(t, 3.7, .5)), cnt = outCubic(p(t, 4.1, 1.6));
  set('leak', { transform: `scale(${lk})`, opacity: p(t, 3.7, .2) * (1 - gone) });
  $('num').textContent = Math.round(cnt * 384000).toLocaleString('ko-KR') + '원';
  COINS.forEach((c, i) => {
    // 새는 돈 박스 아래로 동전이 줄줄 새어 나가며 사라진다
    const k = p(t, c.d, .9);
    set(`coin${i}`, { left: `${c.x}px`, top: `${900 + 520 * k * k}px`, transform: `rotate(${k * c.r * 4}deg) scale(${1 - k * .3})`,
                      opacity: t < c.d || k >= 1 ? 0 : (1 - k) * (1 - gone) });
  });

  // 하나로 정리 + 체크 그리기
  const fx = outBack(p(t, 6.5, .5));
  set('fixed', { transform: `scale(${fx})`, opacity: p(t, 6.5, .15) });
  $('chk').style.strokeDashoffset = 100 - 100 * outCubic(p(t, 6.9, .5));

  // 캐릭터: 등장 팝 → 숨쉬듯 흔들림, 도장에 깜짝 점프, 마지막에 끄덕
  const pop = outBack(p(t, .1, .55));
  const jump = t > 2.75 && t < 3.35 ? Math.sin((t - 2.75) / .6 * Math.PI) * 70 : 0;
  const nod = t > 7.0 && t < 7.8 ? Math.sin((t - 7.0) / .8 * Math.PI * 2) * 3 : 0;
  const sway = Math.sin(t * 2.2) * 2.2 + nod;
  const breathe = 1 + Math.sin(t * 4.4) * .012;
  set('char', { left: '180px', top: `${1655 - 715 - jump}px`,
                transform: `scale(${pop * breathe}, ${pop / breathe}) rotate(${sway + (jump ? 4 : 0)}deg)` });
  const talking = TALK.some(([a, b]) => t >= a && t <= b) && Math.floor(t * 9) % 3 !== 2;
  const blinking = BLINK.some(b => t >= b && t < b + .13) || (jump > 30);
  $('cOpen').style.opacity = 1;
  $('cBlink').style.opacity = blinking ? 1 : 0;
  $('cTalk').style.opacity = !blinking && talking ? 1 : 0;
  const g = [1.2, 4.6, 7.4].map(s => p(t, s, .45)).find(v => v > 0 && v < 1);
  document.querySelector('#glint i').style.left = `${g === undefined ? -80 : -60 + g * 220}px`;

  // 자막
  const sub = SUBS.find(([a, b]) => t >= a && t < b);
  set('sub', { opacity: sub ? Math.min(p(t, sub[0], .2), 1 - p(t, sub[1] - .15, .15)) : 0 });
  if (sub) $('sub').innerHTML = sub[2].replace('\n', '<br>');

  // 마지막 페이드아웃
  set('fade', { opacity: p(t, 9.5, .5) });
};
window.seek(0);
</script>
</body>
</html>
