/* ---------- formatting ---------- */
function won(n){
  if(n===null||n===undefined||isNaN(n)) return null;
  const a=Math.abs(n), s=n<0?"-":"";
  if(a>=1e8) return s+(a/1e8).toFixed(a>=1e10?1:2).replace(/\.?0+$/,"")+"억";
  if(a>=1e4) return s+Math.round(a/1e4).toLocaleString("ko-KR")+"만";
  return s+a.toLocaleString("ko-KR")+"원";
}
const pct = (n,d=0) => n===null||n===undefined||isNaN(n) ? null : (n>0?"+":"")+n.toFixed(d)+"%";
const or = (v,f="미확인") => v===null||v===undefined||v==="" ? f : v;

}

function parseLog(v){
  return String(v||"").split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split(" | ");
    if(p.length<4) return {date:"",round:"",judge:"",memo:l};
    return {date:p[0],round:p[1],judge:p[2],memo:p.slice(3).join(" | ")};
  });
}
function fmtLog(list){ return list.map(e=>[e.date||"",e.round||"",e.judge||"",String(e.memo||"").replace(/\s*\n\s*/g," / ").trim()].join(" | ")).join("\n"); }
// 상담이력이 비어 있고 예전에 저장한 판단(가능·조건부·보류·불가)이 있으면 그것을 첫 기록으로 보여주고, 다음 저장 때 함께 옮긴다.

function logOf(c){
  if(c.log.length) return c.log;
  if(VERDICTS.includes(c.n?c.n.judge:c.judge)) return [{date:"",round:"이전 기록",judge:c.n?c.n.judge:c.judge,memo:c.n?c.n.memo:c.memo}];

}
function nextRound(list){
  const last=list[list.length-1];

  const n=list.filter(e=>/^\d+차$/.test(e.round)||e.round==="이전 기록").length;
  return ROUNDS[Math.min(n,5)];
}
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function sortLog(list){ return list.map((e,i)=>[e,i]).sort((a,b)=>((a[0].date||"")<(b[0].date||"")?-1:(a[0].date||"")>(b[0].date||"")?1:a[1]-b[1])).map(x=>x[0]); }

/* ---------- analysis ---------- */
function daysUntil(iso){
  if(!iso) return null;
  const t=new Date(); t.setHours(0,0,0,0);
  const d=new Date(iso+"T00:00:00");
  return Math.round((d-t)/864e5);
}
function analyze(c){
  const a={};
  a.growth = c.rev25!=null && c.rev24 ? (c.rev25-c.rev24)/c.rev24*100 : null;
  if(c.liab!=null && c.equity!=null && c.equity>0){ a.debtRatio=c.liab/c.equity*100; a.debtSrc="계산"; }
  else if(c.debtRep!=null){ a.debtRatio=c.debtRep; a.debtSrc="보고서"; }
  else { a.debtRatio=null; a.debtSrc=null; }
  a.impaired = c.equity!=null && c.equity<0;
  a.levRef = c.borrow==null && c.refBorrow!=null;
  const debtBase = c.borrow!=null ? c.borrow : c.refBorrow;
  a.lev = debtBase!=null && c.rev25 ? debtBase/c.rev25 : null;
  a.dday = daysUntil(c.nextDue);
  a.age = c.opened ? (Date.now()-new Date(c.opened+"T00:00:00"))/(365.25*864e5) : null;
  a.margin = c.opInc!=null && c.rev25 ? c.opInc/c.rev25*100 : null;

  const S=[];
  // 1 매출 (20)
  let s1=0,n1="매출 자료 없음";
  if(c.rev25!=null){
    if(a.growth==null){ s1=8; n1="성장률 계산 불가(전년 없음)"; }
    else if(a.growth>=10){s1=20;n1="전년 대비 "+pct(a.growth,1);}
    else if(a.growth>=0){s1=14;n1="전년 대비 "+pct(a.growth,1);}
    else if(a.growth>=-10){s1=9;n1="소폭 감소 "+pct(a.growth,1);}
    else if(a.growth>=-30){s1=5;n1="감소 "+pct(a.growth,1);}
    else {s1=2;n1="급감 "+pct(a.growth,1);}
    if(c.revBasis==="WEDLY추정"){ s1=Math.round(s1*0.7); n1+=" · 추정치라 30% 감점"; }
  }
  S.push({k:"매출 추이",got:s1,max:20,note:n1});
  // 2 재무건전성 (25)
  let s2=0,n2=[];
  if(a.impaired){ n2.push("자본잠식"); }
  else if(a.debtRatio!=null){
    const d=a.debtRatio; const p=d<=200?15:d<=400?10:d<=1000?4:0; s2+=p; n2.push("부채비율 "+Math.round(d)+"%("+a.debtSrc+")");
  } else n2.push("부채비율 미확인");
  if(c.opInc!=null){ if(c.opInc>0){s2+=10;n2.push("영업흑자");} else n2.push("영업적자"); }
  else if(c.netInc!=null){ if(c.netInc>0){s2+=7;n2.push("순이익 흑자");} else n2.push("순손실"); }
  else n2.push("손익 미확인");
  S.push({k:"재무건전성",got:s2,max:25,note:n2.join(" · ")});
  // 3 상환부담 (25)
  let s3=0,n3="차입 또는 매출 미확인";
  if(a.lev!=null){ const l=a.lev; s3=l<=.3?25:l<=.6?18:l<=1?10:l<=2?4:0; n3="차입금이 연매출의 "+l.toFixed(2)+"배";
    if(a.levRef){ s3=Math.round(s3*0.7); n3+=" · 미검증 참고차입금 기준이라 30% 감점"; } }
  if(c.overdueUnk){ s3=Math.max(0,s3-8); n3+=" · 만기경과 미확인 -8"; }
  else if(a.dday!=null && a.dday>=0 && a.dday<=60){ s3=Math.max(0,s3-4); n3+=" · 60일 내 만기 -4"; }
  S.push({k:"상환부담",got:s3,max:25,note:n3});
  // 4 기술력 (15)
  let s4=Math.min(10,c.certs.length*5), n4=[];
  if(c.certs.length) n4.push(c.certs.join("·"));
  if(c.patents>0){ s4+=3; n4.push("특허 "+c.patents+"건"); }
  if(c.exportUsd>0){ s4+=2; n4.push("수출 $"+c.exportUsd.toLocaleString("en-US")); }
  S.push({k:"기술·인증",got:Math.min(15,s4),max:15,note:n4.join(" · ")||"인증·특허·수출 없음 또는 미확인"});
  // 5 업력 (5)
  let s5=0,n5="개업일 미확인";
  if(c.type==="예비창업"){ n5="예비창업(창업자금 트랙)"; }
  else if(a.age!=null){ s5=a.age>=7?5:a.age>=3?3:2; n5="업력 "+a.age.toFixed(1)+"년"+(a.age<7?" · 창업기업(7년 미만)":""); }
  S.push({k:"업력",got:s5,max:5,note:n5});
  // 6 결격확인 (10)
  let s6=0,n6;
  const taxBad=c.tax==="체납", delBad=c.delinq==="있음";
  if(taxBad||delBad){ s6=0; n6=[taxBad?"체납":null,delBad?"연체":null].filter(Boolean).join("·")+" 확인됨"; }
  else { s6=(c.tax==="완납확인"?5:2)+(c.delinq==="없음"?5:2); n6="납세 "+c.tax+" · 연체 "+c.delinq; }
  S.push({k:"결격확인",got:s6,max:10,note:n6});
  a.parts=S; a.score=S.reduce((t,x)=>t+x.got,0);

  // flags
  const F=[];
  if(taxBad) F.push(["bad","국세·지방세 체납 — 대부분 정책자금 신청 제한"]);
  if(delBad) F.push(["bad","금융권 연체 — 신청 전 해소 필요"]);
  if(a.impaired) F.push(["bad","자본잠식(자본 "+won(c.equity)+") — 보증·융자 제한 가능"]);
  if(c.overdueUnk) F.push(["bad","만기 경과 대출 연장·상환 미확인 — 노션 핵심리스크 참고"]);
  if(a.dday!=null && a.dday<0 && !c.overdueUnk) F.push(["warn","다음 만기일이 지났습니다 — 노션 값 갱신 필요"]);
  if(a.dday!=null && a.dday>=0 && a.dday<=60) F.push(["warn","다음 만기 D-"+a.dday+(c.dueAmt?" · "+won(c.dueAmt):"")]);
  if(a.levRef) F.push(["warn","차입금이 금융권 증빙이 아닌 보고서 참고값("+won(c.refBorrow)+")"]);
  if(a.growth!=null && a.growth<-30) F.push(["warn","매출 급감 "+pct(a.growth,1)]);
  if(a.lev!=null && a.lev>2) F.push(["warn","차입금이 연매출의 "+a.lev.toFixed(1)+"배"]);
  if(a.debtRatio!=null && a.debtRatio>1000) F.push(["warn","부채비율 "+Math.round(a.debtRatio)+"%"]);
  if(c.revBasis==="WEDLY추정") F.push(["warn","매출이 WEDLY 추정치 — 과표·재무제표로 검증 필요"]);
  if(c.need==null && c.type!=="예비창업") F.push(["info","필요자금 미확정"]);
  if(c.review==="보완필요") F.unshift(["warn","ChatGPT 검수 결과 보완필요 — 자료 출처·검수 메모 확인"]);
  a.flags=F;

  // completeness
  const checks=[c.rev25!=null,c.rev24!=null,a.debtRatio!=null||a.impaired,c.opInc!=null||c.netInc!=null,c.borrow!=null,c.nextDue!=null,c.tax!=="미확인",c.delinq!=="미확인",c.need!=null,c.opened!=null];
  a.comp=Math.round(checks.filter(Boolean).length/checks.length*100);

  const hard=F.filter(f=>f[0]==="bad").length;
  if(taxBad||delBad) a.signal="bad";
  else if(a.comp<35) a.signal="nodata";
  else if(hard>=2) a.signal="bad";
  else if(a.score>=65 && hard===0) a.signal="good";
  else if(a.score>=40) a.signal="warn";
  else a.signal="bad";
  return a;
}

/* ---------- data flow ---------- */
function applyLogs(c){
  if(!c.n) c.n={log:c.log,judge:c.judge,memo:c.memo,round:c.round};
  const d=logDb[c.id];
  const useDb=d&&Array.isArray(d.list)&&(d.pending||state.source!=="live");
  if(!useDb){ Object.assign(c,{log:c.n.log,judge:c.n.judge,memo:c.n.memo,round:c.n.round}); c.pending=false; return; }
  const last=d.list[d.list.length-1];
  c.log=d.list; c.pending=!!d.pending;
  c.judge=last&&VERDICTS.includes(last.judge)?last.judge:"미판단"; c.memo=c.n.memo; c.round=last&&ROUNDS.includes(last.round)?last.round:c.n.round;
}
function ingestRows(rows, updatedAt, source){
  state.source=source;
  state.rows=rows.map(normalize).map(c=>(applyLogs(c),c.a=analyze(c),c));
  state.updatedAt=updatedAt||Date.now();
  state.source=source;
  render();
}
function ingest(result){
  let p=result && result.payload;
  if(typeof p==="string"){ try{p=JSON.parse(p)}catch(e){} }
  const rows=p && Array.isArray(p.results) ? p.results : null;
  if(!rows){ state.status="error"; state.err={code:"format",message:"노션 응답 형식을 읽지 못했습니다."}; render(); return; }
  state.hasMore=!!p.has_more;
  state.status="live"; state.err=null; retried=false;
  ingestRows(rows,(result.cache && result.cache.storedAt) || Date.now(),"live");
  liveRows=rows; syncSnapshot(); syncPendingLogs();
}
async function syncPendingLogs(){
  if(!M||!DB||logSyncing||state.source!=="live") return;
  const ids=Object.keys(logDb).filter(id=>logDb[id].pending&&state.rows.some(c=>c.id===id));
  if(!ids.length) return;
  logSyncing=true;
  let n=0;
  try{
    for(const id of ids){
      const c=state.rows.find(x=>x.id===id), list=logDb[id].list;
      try{
        await M.callTool(SERVER,UPDATE_TOOL,{page_id:id,command:"update_properties",properties:logProps(list)},{cache:false});
        await DB.doc("logs/"+id).set({list,updatedAt:Date.now(),pending:false});
        c.n=null; c.log=list; n++;
      }catch(e){ /* 다음 연결 때 다시 시도 */ }
    }
  }finally{ logSyncing=false; }
  if(n){ toast("임시 저장된 상담 기록 "+n+"건을 노션에 반영했습니다"); M.invalidate(SERVER,QUERY_TOOL).catch(()=>{}); }
}
// 노션 권한이 없는 사람이 보는 공유 사본: 편집 권한자가 실시간 데이터를 받을 때만 갱신
function syncSnapshot(){
  if(!DB||!canSync||!liveRows||snapWriting) return;
  const j=JSON.stringify(liveRows);
  if(j===lastSnapJSON) return;
  snapWriting=true;
  DB.doc(SNAP_PATH).set({rows:liveRows,syncedAt:Date.now()})
    .then(()=>{ lastSnapJSON=j; })
    .catch(()=>{ canSync=false; })
    .finally(()=>{ snapWriting=false; });
}
function retract(){
  state.rows=[]; state.source=null;
  if(lastSnap) ingestRows(lastSnap.rows,lastSnap.syncedAt,"snapshot");
}
function onError(e, fromWatch){
  const code=(e&&e.code)||"upstream_error";
  const transient=["server_unavailable","upstream_error","rate_limited","cancelled"].includes(code);
  if(transient && e.retryable && !retried){
    retried=true; const wait=(e.retryAfterMs||0)+1000+Math.random()*1500;
    setTimeout(()=>load(false),wait); return;
  }
  if(["not_granted","capability_disabled","capability_removed"].includes(code)){ state.status="nomcp"; retract(); render(); return; }
  if(["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required","consent_required"].includes(code)) retract();
  if(code==="user_changed"){ retract(); state.status="error"; state.err=e; render(); return; }
  state.status=state.rows.length?"stale":"error"; state.err=e; render();
}
async function load(manual){
  if(!M) return;
  if(manual){ state.status=state.rows.length?"refreshing":"loading"; renderSync(); }
  try{
    const r=await M.callTool(SERVER,QUERY_TOOL,INPUT,{cache:{staleTime:manual?0:20000,gcTime:3600000,refresh:!!manual}});
    ingest(r); startWatch();
  }catch(e){ onError(e,false); }
}
function startWatch(){
  if(unwatch||!M) return;
  unwatch=M.watchTool(SERVER,QUERY_TOOL,INPUT,ev=>{
    if(ev.type==="data") ingest(ev.result);
    else onError(ev.error,true);
  },{cache:{staleTime:20000,gcTime:3600000},refetchInterval:POLL_MS});
}

function canWriteLog(){ return (state.source==="live"&&!!M)||(!!DB&&canEditLog!==false); }
function logProps(list){
  const latest=list[list.length-1];
  const props={"상담이력":fmtLog(list),"내판단":latest&&VERDICTS.includes(latest.judge)?latest.judge:"미판단"};
  if(latest&&ROUNDS.includes(latest.round)) props["상담차수"]=latest.round;
  return props;
}
function saveErr(e){
  const code=e&&e.code;
  if(code==="approval_required"||code==="not_in_manifest"||code==="consent_required") return "노션에 쓰려면 허용이 필요합니다. 저장을 다시 누르면 허용 창이 뜹니다.";
  if(code==="needs_reauth") return "노션 연결이 만료됐습니다. claude.ai 설정 → 커넥터에서 Notion을 다시 연결하세요.";
  if(code==="tool_error") return "노션이 저장을 거부했습니다: "+(e.message||"알 수 없는 오류");
  if(code==="server_unavailable"||code==="upstream_error") return "저장됐는지 확인하지 못했습니다. 새로고침 후 노션 값을 확인하세요.";
  return "저장하지 못했습니다("+(code||"오류")+").";
}
async function saveLog(c, list, btn, done){
  const msg=$("#saveMsg");
  list=sortLog(list);
  const props=logProps(list), live=state.source==="live"&&M;
  if(btn) btn.disabled=true;
  msg.className="save-msg"; msg.textContent=live?"노션에 저장하는 중…":"이 페이지에 저장하는 중…";
  try{
    if(live){
      await M.callTool(SERVER,UPDATE_TOOL,{page_id:c.id,command:"update_properties",properties:props},{cache:false});
      if(DB&&canSync) DB.doc("logs/"+c.id).set({list,updatedAt:Date.now(),pending:false}).catch(()=>{});
      c.n={log:list,judge:props["내판단"],memo:c.n?c.n.memo:c.memo,round:props["상담차수"]||c.round};
      M.invalidate(SERVER,QUERY_TOOL).catch(()=>{});
    }else{
      await DB.doc("logs/"+c.id).set({list,updatedAt:Date.now(),pending:true});
      logDb[c.id]={list,pending:true};
    }
    applyLogs(c); c.a=analyze(c);
    state.editIdx=null; state.delIdx=null;
    toast(c.name+" · "+done+(live?"":" (노션 연결 시 자동 반영)"));
    renderDrawer(c,false); render();
  }catch(e){
    msg.className="save-msg bad"; const code=e&&e.code;
    if(!live&&["invalid_argument","not_granted","revoked"].includes(code)){ canEditLog=false; renderDrawer(c,false); toast("이 계정은 편집 권한이 없어 저장되지 않았습니다"); return; }
    msg.textContent=live?saveErr(e):"저장하지 못했습니다("+(code||"오류")+"). 잠시 후 다시 시도해 주세요.";
  }finally{ if(btn) btn.disabled=false; }
}

async function saveStage(c, stage, btn){
  const msg=$("#stageMsg");

    else if(code==="tool_error") msg.textContent="노션이 저장을 거부했습니다: "+(e.message||"알 수 없는 오류");
    else if(code==="server_unavailable"||code==="upstream_error") msg.textContent="저장됐는지 확인하지 못했습니다. 새로고침 후 노션 값을 확인하세요.";
    else msg.textContent="저장하지 못했습니다("+(code||"오류")+").";
  }finally{ btn.disabled=false; }

function filtered(){
  const q=state.q.trim().toLowerCase();
  let r=state.rows.filter(c=>!q||[c.name,c.ceo,c.industry,c.region,c.bizno,c.mobile,c.tel,c.email].join(" ").toLowerCase().includes(q));
  const key={score:c=>-c.a.score,dday:c=>(c.overdueUnk?-1e6:0)+(c.a.dday==null?1e9:c.a.dday),rev:c=>-(c.rev25??-1),lev:c=>-(c.a.lev??-1),comp:c=>c.a.comp}[state.sort];
  return r.sort((x,y)=>key(x)-key(y));
}
function sigPill(s){ return `<span class="pill sig-${s}">${SIG_LABEL[s]}</span>`; }

function cardHTML(c){
  const a=c.a;

  const lc=a.lev==null?"unk":a.lev>2?"bad":a.lev>1?"warn":"good";

  const dtxt=a.dday==null?"미확인":a.dday<0?"경과":"D-"+a.dday;
  const chips=[];
  a.flags.filter(f=>f[0]==="bad").slice(0,2).forEach(f=>chips.push(`<span class="chip bad">${esc(f[1].split(" — ")[0].split("(")[0])}</span>`));
  c.certs.forEach(x=>chips.push(`<span class="chip acc">${esc(x)}</span>`));
  if(c.patents>0) chips.push(`<span class="chip acc">특허 ${c.patents}</span>`);
  if(c.judge==="자금신청중"||c.judge==="자금신청완료") chips.unshift(`<span class="chip ${c.judge==="자금신청중"?"acc":"fund"}">${c.judge}</span>`);

    <div class="mrow">
      <div class="m"><div class="k">2025 매출</div><div class="v ${c.rev25==null?"unk":""}">${won(c.rev25)||"미확인"}</div></div>
      <div class="m"><div class="k">전년비</div><div class="v ${gc}">${pct(g)||"—"}</div></div>
      <div class="m"><div class="k">차입/매출</div><div class="v ${lc}">${a.lev==null?"—":a.lev.toFixed(2)+"배"}</div></div>

    </div>

function renderLive(){
  const el=$("#live"), t=$("#liveText");
  const time=state.updatedAt?new Date(state.updatedAt).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"";
  if(state.source==="snapshot"){el.dataset.s="idle";t.textContent="공유 보기 · "+time+" 동기화 기준";}
  else if(state.status==="live"){el.dataset.s="live";t.textContent="실시간 · 2분마다 갱신 · "+time+" 동기화";}
  else if(state.status==="refreshing"){el.dataset.s="live";t.textContent="새로 불러오는 중…";}
  else if(state.status==="loading"){el.dataset.s="idle";t.textContent="노션에서 불러오는 중…";}
  else if(state.status==="stale"){el.dataset.s="err";t.textContent="연결 끊김 · "+time+" 값 표시 중";}
  else {el.dataset.s="err";t.textContent="노션 연결 안 됨";}
}

function logSection(c,list,editing,judge,memo,roundSel,dateSel){

      :`<button class="btn sm" type="button" data-edit="${i}">수정</button>${legacy?"":`<button class="btn sm" type="button" data-del="${i}">삭제</button>`}`;
    return `<div class="log-e${state.editIdx===i?" editing":""}"><div class="log-h"><span class="rd">${esc(e.round||"기록")}</span>${e.judge?`<span class="chip ${e.judge==="가능"?"good":e.judge==="불가"?"bad":e.judge==="조건부"?"warn":e.judge==="자금신청중"?"acc":e.judge==="자금신청완료"?"fund":""}">${esc(e.judge)}</span>`:""}<span class="dt">${esc(e.date||"날짜 없음")}</span><span class="acts">${acts}</span></div>${e.memo?`<p class="prose">${esc(e.memo)}</p>`:""}</div>`;
  }).join("");
  const nMemo=c.n?c.n.memo:c.memo, memoInLog=list.some(e=>e.memo&&nMemo&&e.memo.trim()===nMemo.trim());

  const offline=state.source!=="live";

  return `<section class="sec"><h3>상담 기록 — ${offline?"이 페이지에 임시 저장":"노션에 저장"} (${list.length}건)</h3>

    ${history}
    <div class="logform">

    saveLog(c, list, dk, "상담 기록 삭제"); return;
  }
  if(t.closest("#cancelEdit")){ const c=state.rows.find(x=>x.id===state.openId); if(!c) return; state.editIdx=null; renderDrawer(c,false); return; }
  if(t.closest("#saveBtn")){
    const c=state.rows.find(x=>x.id===state.openId); if(!c||!canWriteLog()) return;
    const sel=document.querySelector(".stamp[aria-pressed='true']");
    const msg=$("#saveMsg");
    if(!sel){ msg.className="save-msg bad"; msg.textContent="가능·조건부·보류·불가 중 하나를 고르세요."; return; }
    const entry={date:$("#logDate").value||today(), round:$("#roundSel").value, judge:sel.dataset.j, memo:$("#memo").value.trim()};
    const list=logOf(c).slice();
    if(state.editIdx!=null) list[state.editIdx]=entry; else list.push(entry);
    saveLog(c, list, t.closest("#saveBtn"), state.editIdx!=null?entry.round+" 기록 수정":entry.round+" 상담 기록 추가");
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&state.openId) closeDrawer();
  if(e.key==="Enter"&&e.target.matches("tbody tr")) openDrawer(e.target.dataset.id);
});
$("#q").addEventListener("input",e=>{ state.q=e.target.value; render(); });
$("#sort").addEventListener("change",e=>{ state.sort=e.target.value; render(); });
$("#refresh").addEventListener("click",()=>load(true));
window.matchMedia("(max-width:900px)").addEventListener("change",()=>render());

async function retryMcp(){
  if(M){ load(true); return; }
  try{
    const st=PERMS?await PERMS.state("mcp"):"unavailable";
    if(st==="denied"){ await PERMS.manage().catch(()=>{ toast("아티팩트의 권한(Permissions) 메뉴에서 Notion을 허용해 주세요"); }); }
    else if(st==="prompt"){ await PERMS.request(["mcp"]); }
    const m=await claude.use("mcp");
    if(m){ M=m; state.status="loading"; load(true); }
    else toast("이 화면에서는 노션을 쓸 수 없습니다. claude.ai 안에서 열면 연결됩니다");
  }catch(e){ toast("노션에 연결하지 못했습니다"); }
}

/* ---------- boot ---------- */
render();
const useCap=n=>(window.claude && window.claude.use ? window.claude.use(n) : Promise.resolve(null)).catch(()=>null);
useCap("db").then(db=>{
  if(!db) return;
  DB=db;
  DB.doc(SNAP_PATH).onSnapshot(s=>{
    if(!s.exists) return;
    const d=s.data();
    if(!d||!Array.isArray(d.rows)) return;
    lastSnap=d; lastSnapJSON=JSON.stringify(d.rows);
    if(state.source!=="live") ingestRows(d.rows,d.syncedAt,"snapshot");
  },()=>{});
  syncSnapshot();
  DB.collection("logs").onSnapshot(qs=>{
    const m={}; qs.docs.forEach(d=>{ const v=d.data(); if(v&&Array.isArray(v.list)) m[d.id]={list:v.list,pending:!!v.pending}; });
    logDb=m;
    state.rows.forEach(c=>{ applyLogs(c); c.a=analyze(c); });
    render(); syncPendingLogs();
  },()=>{});
});
useCap("permissions").then(p=>{ PERMS=p; });
useCap("user").then(async u=>{
  canSync=u?(await u.canEdit().catch(()=>false))===true:false;
  // 공유 저장소 쓰기 권한: null(확인 못 함)이면 입력을 열어 두고 실제 저장 결과로 판단
  const w=u&&u.can?await u.can("data.write").catch(()=>null):null;
  canEditLog=w===true||canSync?true:w===false?false:null;
  syncSnapshot(); render();
});
useCap("mcp").then(m=>{
  if(!m){ state.status="nomcp"; render(); return; }
  M=m; load(false);
}).catch(()=>{ state.status="nomcp"; render(); });
})();
</script>

</body></html>
