<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:P;font-weight:700;src:url(../font/package/dist/web/static/woff2/Pretendard-Bold.woff2)}
@font-face{font-family:P;font-weight:800;src:url(../font/package/dist/web/static/woff2/Pretendard-ExtraBold.woff2)}
@font-face{font-family:P;font-weight:900;src:url(../font/package/dist/web/static/woff2/Pretendard-Black.woff2)}
:root{--ink:#2B2D42;--sky1:#BFE6FF;--sky2:#FFF4DE;--coral:#F2552C;--mint:#3DBFA6;--navy:#24407A;--gold:#FFC93C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:P,sans-serif;color:var(--ink);letter-spacing:-0.025em;background:var(--sky2)}
#bg{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky1) 0%,#E3F4FF 45%,var(--sky2) 100%)}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:55%;height:160%;left:15%;bottom:20%}.cloud:after{width:40%;height:130%;right:12%;bottom:25%}
#ground{position:absolute;left:-60px;right:-60px;top:1180px;height:900px;background:#CDEBC8;border-radius:50% 50% 0 0/120px 120px 0 0;border-top:7px solid var(--ink)}
#prog{position:absolute;left:0;top:0;height:14px;background:var(--coral);width:0}
#head{position:absolute;top:96px;left:0;right:0;text-align:center}
.badge{display:inline-flex;align-items:center;gap:12px;background:#fff;border:6px solid var(--ink);border-radius:999px;padding:10px 30px;font-weight:900;font-size:38px;box-shadow:0 7px 0 var(--ink)}
.badge i{width:22px;height:22px;border-radius:50%;background:var(--coral)}
#title{position:absolute;top:210px;left:40px;right:40px;text-align:center;font-weight:900;font-size:88px;line-height:1.14;-webkit-text-stroke:0;text-shadow:0 6px 0 #fff}
#title span{color:var(--coral)}
.scene{position:absolute;left:0;right:0;top:420px;height:960px;opacity:0}
.abs{position:absolute}
svg{overflow:visible}
#cap{position:absolute;left:60px;right:60px;top:1420px;text-align:center}
#cap .box{display:inline-block;position:relative;background:#fff;border:7px solid var(--ink);border-radius:40px;padding:28px 44px;font-weight:900;font-size:60px;line-height:1.3;box-shadow:0 10px 0 var(--ink)}
#cap .box:after{content:"";position:absolute;left:50%;top:-34px;margin-left:-26px;border:26px solid transparent;border-bottom-color:var(--ink)}
#cap b{color:var(--coral)}
.bubble{position:absolute;background:#fff;border:6px solid var(--ink);border-radius:36px;padding:20px 32px;font-weight:900;font-size:50px;box-shadow:0 7px 0 var(--ink);white-space:nowrap}
.sign{position:absolute;background:var(--gold);border:6px solid var(--ink);border-radius:24px;padding:18px 30px;font-weight:900;font-size:54px;box-shadow:0 8px 0 var(--ink);white-space:nowrap}
.btn{display:inline-block;background:var(--coral);color:#fff;border:6px solid var(--ink);border-radius:999px;padding:22px 46px;font-weight:900;font-size:54px;box-shadow:0 9px 0 var(--ink)}
#end{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky1),var(--sky2));display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
</style></head><body>
<div id="bg"></div>
<div class="cloud" id="cl1" style="width:260px;height:80px;top:520px;left:60px"></div>
<div class="cloud" id="cl2" style="width:200px;height:64px;top:700px;left:780px"></div>
<div id="ground"></div>
<div id="head"><span class="badge"><i></i>벤처의 기준 · 재확인</span></div>
<div id="title">벤처확인,<br><span>자동 연장</span> 안 됩니다</div>

<div class="scene" id="s1"></div>
<div class="scene" id="s2"></div>
<div class="scene" id="s3"></div>
<div class="scene" id="s4"></div>
<div class="scene" id="s5"></div>
<div class="scene" id="s6"></div>

<div id="cap"><div class="box" id="capbox"></div></div>
<div id="prog"></div>
<div id="end"></div>

<script>
const OFF=0.9, D=window.DUR||33.3, INK="#2B2D42";
/* ---------- characters (original) ---------- */
function ceo(ex){ // 대표님 캐릭터
 let eyes,mouth,brow="",extra="";
 if(ex==="surprise"){eyes=`<circle cx="115" cy="178" r="17" fill="#fff"/><circle cx="185" cy="178" r="17" fill="#fff"/><circle cx="115" cy="180" r="7" fill="${INK}" stroke="none"/><circle cx="185" cy="180" r="7" fill="${INK}" stroke="none"/>`;mouth=`<ellipse cx="150" cy="232" rx="13" ry="17" fill="#9B3434"/>`;brow=`<path d="M96 140 Q115 128 132 138"/><path d="M168 138 Q185 128 204 140"/>`}
 else if(ex==="sweat"){eyes=`<path d="M103 182 L127 176"/><path d="M173 176 L197 182"/><circle cx="117" cy="190" r="6" fill="${INK}" stroke="none"/><circle cx="183" cy="190" r="6" fill="${INK}" stroke="none"/>`;mouth=`<path d="M128 232 Q139 222 150 232 Q161 242 172 232" fill="none"/>`;extra=`<path class="drop" d="M232 108 Q244 130 232 142 Q220 130 232 108Z" fill="#8FD3FF"/><path d="M60 120 Q66 130 60 138 Q54 130 60 120Z" fill="#8FD3FF"/>`}
 else if(ex==="happy"){eyes=`<path d="M101 184 Q115 166 129 184" fill="none"/><path d="M171 184 Q185 166 199 184" fill="none"/>`;mouth=`<path d="M122 214 Q150 254 178 214Z" fill="#fff"/>`}
 else {eyes=`<g class="blink"><ellipse cx="115" cy="182" rx="9" ry="12" fill="${INK}" stroke="none"/><ellipse cx="185" cy="182" rx="9" ry="12" fill="${INK}" stroke="none"/></g>`;mouth=`<path d="M138 226 Q150 220 162 226" fill="none"/>`;brow=`<path d="M100 148 Q115 140 130 150"/><path d="M170 146 Q185 138 200 146"/>`}
 return `<svg viewBox="0 0 300 430" width="100%" height="100%"><g stroke="${INK}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
 <path d="M58 430 Q58 272 150 262 Q242 272 242 430Z" fill="#24407A"/>
 <path d="M118 264 L150 334 L182 264Z" fill="#fff"/><path d="M150 288 L139 304 L150 350 L161 304Z" fill="#F2552C"/>
 <circle cx="56" cy="178" r="17" fill="#FFD0AA"/><circle cx="244" cy="178" r="17" fill="#FFD0AA"/>
 <circle cx="150" cy="172" r="96" fill="#FFDCBE"/>
 <path d="M58 158 Q62 70 150 68 Q240 70 242 158 Q214 112 160 118 Q150 96 128 118 Q86 120 58 158Z" fill="${INK}"/>
 <circle cx="96" cy="212" r="15" fill="#FF9E9E" stroke="none" opacity=".55"/><circle cx="204" cy="212" r="15" fill="#FF9E9E" stroke="none" opacity=".55"/>
 ${brow}${eyes}${mouth}${extra}</g></svg>`}
function guide(point){ // 가이드 캐릭터 '기준이'
 return `<svg viewBox="0 0 320 400" width="100%" height="100%"><g stroke="${INK}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
 <line x1="160" y1="96" x2="160" y2="40"/><path d="M160 6 L170 30 L196 32 L176 48 L183 74 L160 60 L137 74 L144 48 L124 32 L150 30Z" fill="#FFC93C"/>
 <ellipse cx="110" cy="372" rx="36" ry="18" fill="#2E9C87"/><ellipse cx="210" cy="372" rx="36" ry="18" fill="#2E9C87"/>
 <circle cx="160" cy="230" r="138" fill="#3DBFA6"/>
 <ellipse cx="160" cy="290" rx="78" ry="58" fill="#8FE3D1" stroke="none"/>
 <circle cx="115" cy="200" r="30" fill="#fff"/><circle cx="205" cy="200" r="30" fill="#fff"/>
 <g class="blink"><circle cx="120" cy="204" r="13" fill="${INK}" stroke="none"/><circle cx="210" cy="204" r="13" fill="${INK}" stroke="none"/></g>
 <circle cx="125" cy="198" r="4" fill="#fff" stroke="none"/><circle cx="215" cy="198" r="4" fill="#fff" stroke="none"/>
 <path d="M130 254 Q160 282 190 254" fill="none"/>
 <circle cx="86" cy="250" r="14" fill="#FF9E9E" stroke="none" opacity=".6"/><circle cx="234" cy="250" r="14" fill="#FF9E9E" stroke="none" opacity=".6"/>
 ${point?`<g class="arm"><path d="M282 220 Q320 180 338 128" fill="none"/><circle cx="340" cy="122" r="18" fill="#3DBFA6"/></g>`:`<path d="M290 250 Q318 262 322 290" fill="none"/><circle cx="322" cy="296" r="16" fill="#3DBFA6"/>`}
 <path d="M30 250 Q2 262 0 290" fill="none"/><circle cx="0" cy="296" r="16" fill="#3DBFA6"/>
 </g></svg>`}
/* ---------- props ---------- */
const cert=`<svg viewBox="0 0 300 220" width="100%" height="100%"><g stroke="${INK}" stroke-width="7" stroke-linejoin="round"><rect x="6" y="6" width="288" height="208" rx="18" fill="#fff"/><rect x="26" y="26" width="248" height="168" rx="10" fill="none" stroke="#FFC93C" stroke-width="6"/><text x="150" y="88" text-anchor="middle" font-family="P" font-weight="900" font-size="34" fill="${INK}" stroke="none">벤처기업확인서</text><line x1="70" y1="120" x2="230" y2="120" stroke="#C9D3E3"/><line x1="90" y1="148" x2="210" y2="148" stroke="#C9D3E3"/><circle cx="240" cy="170" r="26" fill="#F2552C"/></g></svg>`;
function calendar(txt,col){return `<svg viewBox="0 0 260 270" width="100%" height="100%"><g stroke="${INK}" stroke-width="7" stroke-linejoin="round"><rect x="6" y="30" width="248" height="234" rx="22" fill="#fff"/><path d="M6 52 Q6 30 28 30 H232 Q254 30 254 52 V96 H6Z" fill="${col}"/><line x1="70" y1="10" x2="70" y2="52"/><line x1="190" y1="10" x2="190" y2="52"/><text x="130" y="200" text-anchor="middle" font-family="P" font-weight="900" font-size="${txt.length>3?64:90}" fill="${INK}" stroke="none">${txt}</text></g></svg>`}
const hourglass=`<svg viewBox="0 0 160 240" width="100%" height="100%"><g stroke="${INK}" stroke-width="7" stroke-linejoin="round"><rect x="10" y="6" width="140" height="22" rx="8" fill="#B07A4A"/><rect x="10" y="212" width="140" height="22" rx="8" fill="#B07A4A"/><path d="M28 28 Q28 100 80 120 Q132 100 132 28Z" fill="#E8F6FF"/><path d="M28 212 Q28 140 80 120 Q132 140 132 212Z" fill="#E8F6FF"/><path id="sandTop" d="M44 50 Q50 96 80 112 Q110 96 116 50Z" fill="#FFC93C" stroke="none"/><path d="M40 208 Q60 168 80 162 Q100 168 120 208Z" fill="#FFC93C" stroke="none"/></g></svg>`;
function door(label,col){return `<svg viewBox="0 0 240 340" width="100%" height="100%"><g stroke="${INK}" stroke-width="7" stroke-linejoin="round"><path d="M10 336 V100 Q10 10 120 10 Q230 10 230 100 V336Z" fill="${col}"/><circle cx="190" cy="200" r="12" fill="#FFC93C"/><rect x="40" y="110" width="160" height="60" rx="12" fill="#fff"/><text x="120" y="152" text-anchor="middle" font-family="P" font-weight="900" font-size="36" fill="${INK}" stroke="none">${label}</text></g></svg>`}
const flag=`<svg viewBox="0 0 120 200" width="100%" height="100%"><g stroke="${INK}" stroke-width="7" stroke-linejoin="round"><line x1="20" y1="10" x2="20" y2="196"/><path d="M20 14 H110 L90 46 L110 78 H20Z" fill="#F2552C"/></g></svg>`;
function step(n,t,c){return `<div style="display:flex;flex-direction:column;align-items:center;gap:14px"><div style="width:150px;height:150px;border-radius:50%;background:${c};border:7px solid ${INK};box-shadow:0 8px 0 ${INK};display:flex;align-items:center;justify-content:center;font-weight:900;font-size:72px">${n}</div><div style="font-weight:900;font-size:44px;background:#fff;border:5px solid ${INK};border-radius:16px;padding:6px 18px">${t}</div></div>`}

/* ---------- scene layouts ---------- */
const S=(id,html)=>document.getElementById(id).innerHTML=html;
S("s1",`<div class="abs" id="s1c" style="left:300px;top:330px;width:480px;height:690px">${ceo("q")}</div>
 <div class="abs" id="s1cert" style="left:70px;top:420px;width:300px;height:220px;transform:rotate(-8deg)">${cert}</div>
 <div class="bubble" id="s1b" style="left:600px;top:120px">만료일이…?</div>
 <div class="abs" id="s1q1" style="left:820px;top:260px;font-weight:900;font-size:110px;color:var(--coral)">?</div>
 <div class="abs" id="s1q2" style="left:900px;top:330px;font-weight:900;font-size:80px;color:var(--navy)">?</div>`);
S("s2",`<div class="abs" style="left:60px;top:90px;width:430px;height:315px">${cert}</div>
 <div class="sign" id="s2t" style="left:110px;top:440px;background:#fff">유효기간 있음</div>
 <div class="abs" id="s2h" style="left:120px;top:560px;width:150px;height:225px">${hourglass}</div>
 <div class="abs" id="s2c" style="left:560px;top:330px;width:440px;height:630px">${ceo("surprise")}</div>
 <div class="abs" id="s2x" style="left:540px;top:70px;width:470px"><div class="sign" style="position:relative;display:inline-block;background:#fff;font-size:60px">자동 연장<div id="s2st" style="position:absolute;left:18px;right:18px;top:50%;height:12px;margin-top:-6px;background:var(--coral);border-radius:6px;transform-origin:left center"></div></div><div id="s2no" class="sign" style="left:300px;top:-30px;background:var(--coral);color:#fff;font-size:48px;transform:rotate(8deg)">없음!</div></div>`);
S("s3",`<div class="abs" style="left:70px;top:70px;width:250px;height:350px">${door("처음 신청","#9CC8FF")}</div>
 <div class="abs" id="s3eq" style="left:375px;top:170px;font-weight:900;font-size:150px">=</div>
 <div class="abs" id="s3d2" style="left:520px;top:70px;width:250px;height:350px">${door("재확인","#FFB59C")}</div>
 <div class="abs" id="s3s" style="left:90px;top:470px;display:flex;gap:40px;align-items:center">${step("1","신청","#FFC93C")}<div style="font-weight:900;font-size:70px">→</div>${step("2","평가","#3DBFA6")}</div>
 <div class="abs" id="s3g" style="left:690px;top:480px;width:330px;height:420px">${guide(true)}</div>
 <div class="bubble" id="s3b" style="left:640px;top:380px;font-size:42px">절차가 똑같아요!</div>`);
S("s4",`<div class="abs" id="s4cal" style="left:90px;top:80px;width:340px;height:350px">${calendar("D-7","#F2552C")}</div>
 <div class="abs" id="s4c" style="left:440px;top:300px;width:470px;height:670px">${ceo("sweat")}</div>
 <div class="sign" id="s4s" style="left:120px;top:560px;background:var(--coral);color:#fff;font-size:80px">늦어요!</div>`);
S("s5",`<svg class="abs" style="left:0;top:380px" width="1080" height="420" viewBox="0 0 1080 420"><path d="M-20 360 Q300 380 420 250 Q540 120 1100 140" fill="none" stroke="#E9D7B5" stroke-width="110" stroke-linecap="round"/><path id="road" d="M-20 360 Q300 380 420 250 Q540 120 1100 140" fill="none" stroke="#fff" stroke-width="10" stroke-dasharray="40 30"/></svg>
 <div class="sign" id="s5a" style="left:70px;top:560px;background:#fff">자료 정리</div>
 <div class="sign" id="s5b" style="left:420px;top:360px;background:#fff">보완 대응</div>
 <div class="abs" id="s5f" style="left:820px;top:280px;width:120px;height:200px">${flag}</div>
 <div class="abs" id="s5cal" style="left:810px;top:40px;width:200px;height:210px">${calendar("여유","#3DBFA6")}</div>
 <div class="abs" id="s5g" style="left:120px;top:20px;width:290px;height:360px">${guide(true)}</div>
 <div class="bubble" id="s5bb" style="left:400px;top:70px;font-size:44px">일정부터 잡아요</div>`);
S("s6",`<div class="abs" id="s6c" style="left:70px;top:420px;width:380px;height:545px">${ceo("happy")}</div>
 <div class="abs" id="s6g" style="left:560px;top:520px;width:360px;height:450px">${guide(true)}</div>
 <div class="abs" id="s6card" style="left:90px;top:40px;right:90px;background:#fff;border:7px solid ${INK};border-radius:40px;box-shadow:0 12px 0 ${INK};padding:40px;text-align:center">
  <div style="font-weight:900;font-size:46px;color:#6B6F78">만료일 기준으로</div>
  <div style="font-weight:900;font-size:84px;line-height:1.15;margin-top:6px">무엇부터<br>준비할까?</div>
  <div class="btn" id="s6btn" style="margin-top:26px">프로필 링크 → 재확인 상담</div></div>`);
document.getElementById("end").innerHTML=`<div style="width:300px;height:375px">${guide(false)}</div><div class="badge" style="margin-top:40px;font-size:58px;padding:16px 44px"><i></i>벤처의 기준</div><div style="font-weight:900;font-size:50px;margin-top:30px">전국 벤처기업확인 컨설팅</div><div class="btn" style="margin-top:44px">프로필 링크 → 재확인 상담</div>`;

/* ---------- timeline ---------- */
const caps=[[1.08,4.45,"벤처확인 <b>만료일</b>,|지금 바로 말씀하실 수 있나요?"],[4.72,7.25,"벤처기업확인은|<b>유효기간</b>이 있고"],[7.32,10.30,"기간이 끝난다고|<b>저절로 연장되지 않습니다</b>"],[10.39,12.10,"다시 확인을 받으려면"],[12.19,15.95,"처음 신청할 때와 <b>똑같이</b>|신청하고 평가를 받아야 합니다"],[16.07,19.60,"그래서 만료가 가까워져서|시작하면 <b>늦습니다</b>"],[19.95,22.15,"자료 정리와|<b>보완</b>까지 생각하면"],[22.21,25.45,"여유 있게 <b>일정부터</b> 잡는 게|안전합니다"],[25.69,28.90,"<b>만료일</b>을 기준으로|지금 무엇부터 준비하면 될지"],[28.97,32.30,"프로필 링크에서|<b>재확인 상담</b>을 신청해 보세요"]];
const scenes=[["s1",0.9,4.6],["s2",4.6,10.3],["s3",10.3,16.0],["s4",16.0,19.8],["s5",19.8,25.55],["s6",25.55,99]];
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const $=id=>document.getElementById(id);
function pop(id,t,t0,d=.4,base=""){const el=$(id);if(!el)return;el.style.opacity=cl((t-t0)/(d*.5));el.style.transform=`${base} scale(${.4+.6*back((t-t0)/d)})`}
function bob(id,t,amp=8,sp=2.4,ph=0,base=""){const el=$(id);if(el)el.style.transform=`${base} translateY(${Math.sin(t*sp+ph)*amp}px)`}
let last=-2;
window.render=function(T){const t=T+OFF;
 $("prog").style.width=cl(T/D)*100+"%";
 $("cl1").style.transform=`translateX(${T*6}px)`;$("cl2").style.transform=`translateX(${-T*5}px)`;
 for(const[id,a,b]of scenes){const el=$(id),fi=ease((t-a)/.35),fo=ease((b-t)/.25);el.style.opacity=Math.min(fi,fo);el.style.transform=`translateY(${(1-fi)*70}px)`}
 const ci=caps.findIndex(c=>t>=c[0]&&t<c[1]),box=$("capbox");
 if(ci<0)box.parentElement.style.opacity=0;else{if(ci!==last){box.innerHTML=caps[ci][2].split("|").join("<br>");last=ci}const p=ease((t-caps[ci][0])/.2);box.parentElement.style.opacity=p;box.parentElement.style.transform=`scale(${.92+.08*p})`}
 // blink every ~3s
 const bl=(t%3.1)<0.12?0.1:1;document.querySelectorAll(".blink").forEach(g=>{g.style.transformBox="fill-box";g.style.transformOrigin="center";g.style.transform=`scaleY(${bl})`});
 document.querySelectorAll(".arm").forEach(g=>{g.style.transformBox="view-box";g.style.transformOrigin="282px 220px";g.style.transform=`rotate(${Math.sin(t*5)*8}deg)`});
 // s1
 bob("s1c",t,6,2.2);bob("s1cert",t,10,1.8,1,"rotate(-8deg)");pop("s1b",t,2.0);pop("s1q1",t,2.6,.35);pop("s1q2",t,3.0,.35);
 // s2
 pop("s2t",t,5.9);pop("s2h",t,6.3);bob("s2c",t,5,3);
 $("s2st").style.transform=`scaleX(${ease((t-8.5)/.35)})`;pop("s2no",t,8.9,.35,"rotate(8deg)");
 // s3
 pop("s3eq",t,13.2);pop("s3d2",t,12.5,.45);pop("s3s",t,14.3,.45);bob("s3g",t,8,2.6);pop("s3b",t,13.6);
 // s4
 const sh=t>16.9&&t<19.6?Math.sin(t*40)*6:0;$("s4cal").style.transform=`rotate(${sh}deg)`;bob("s4c",t,4,6);pop("s4s",t,18.7,.35,"rotate(-6deg)");
 // s5
 $("road").style.strokeDashoffset=-t*80;pop("s5a",t,19.95);pop("s5b",t,20.75);pop("s5f",t,22.2);pop("s5cal",t,23.1);bob("s5g",t,8,2.6);pop("s5bb",t,23.2);
 // s6
 pop("s6card",t,25.7,.45);bob("s6c",t,6,2.4);bob("s6g",t,8,2.6,1);pop("s6btn",t,28.97,.4);
 $("end").style.opacity=ease((T-(D-1.5))/.35);
}
render(0);
</script></body></html>
