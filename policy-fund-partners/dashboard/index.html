<title>채움 정책자금 보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar + tabbed workspace; case detail opens in a right-side drawer */
:root{
  --bg:#f4f7f5;--surface:#ffffff;--surface2:#ecf1ee;--ink:#13201b;--muted:#5a6b64;--line:#d9e2dd;
  --accent:#0d6e5f;--accent-ink:#ffffff;--accent-soft:#dbeee8;
  --warn:#a86a12;--warn-soft:#fbefd9;--bad:#bb3528;--bad-soft:#f8e0dc;--info:#2862a8;--info-soft:#e0ebf7;--ok:#2d7d52;--ok-soft:#ddf0e4;
  --shadow:0 10px 30px rgba(15,40,32,.12);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1412;--surface:#151d1a;--surface2:#1c2622;--ink:#e2ebe7;--muted:#92a39c;--line:#283430;
  --accent:#3dbea4;--accent-ink:#04211b;--accent-soft:#15382f;
  --warn:#e2ae4a;--warn-soft:#382c14;--bad:#ee7b6e;--bad-soft:#3b1d19;--info:#7aa7df;--info-soft:#19293b;--ok:#66c291;--ok-soft:#16311f;
  --shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412;--surface:#151d1a;--surface2:#1c2622;--ink:#e2ebe7;--muted:#92a39c;--line:#283430;
  --accent:#3dbea4;--accent-ink:#04211b;--accent-soft:#15382f;
  --warn:#e2ae4a;--warn-soft:#382c14;--bad:#ee7b6e;--bad-soft:#3b1d19;--info:#7aa7df;--info-soft:#19293b;--ok:#66c291;--ok-soft:#16311f;
  --shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.02em}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:13px}
nav{display:flex;gap:2px;flex:1;overflow-x:auto;min-width:0}
nav a{padding:7px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
nav a:hover{background:var(--surface2);color:var(--ink)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.top-actions{display:flex;gap:8px}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

main.wrap{padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
h1{font-size:20px;margin:0;letter-spacing:-.02em}
h2{font-size:15px;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.count{background:var(--surface2);color:var(--muted);border-radius:99px;padding:0 8px;font-size:12px;font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.02em}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px;font-family:var(--f-body)}
.kpi .d{font-size:12px;color:var(--muted)}

/* todo */
.todo{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto}
.todo button{all:unset;cursor:pointer;display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 12px 9px 0;border-radius:8px;background:var(--surface2)}
.todo button:hover{outline:1px solid var(--line)}
.todo button:focus-visible{outline:2px solid var(--accent)}
.todo .bar{align-self:stretch;border-radius:4px 0 0 4px}
.sev-bad .bar{background:var(--bad)}.sev-warn .bar{background:var(--warn)}.sev-info .bar{background:var(--info)}
.todo .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo .r{font-size:12.5px;color:var(--muted)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* chips & pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.st-진행중{background:var(--info-soft);color:var(--info)}
.st-보류{background:var(--warn-soft);color:var(--warn)}
.st-반려,.st-거절{background:var(--bad-soft);color:var(--bad)}
.st-취소{background:var(--surface2);color:var(--muted)}
.st-완료{background:var(--ok-soft);color:var(--ok)}
.src{font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;white-space:nowrap}
.tag-ex{font-size:11px;color:var(--warn);border:1px dashed var(--warn);border-radius:5px;padding:0 4px;margin-left:4px;font-weight:500}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:8px}
.fun-row{display:grid;grid-template-columns:78px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px}
.fun-track{height:18px;background:var(--surface2);border-radius:5px;overflow:hidden}
.fun-fill{height:100%;background:var(--accent);border-radius:5px;opacity:.85}
.reasons{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.reasons div{display:flex;justify-content:space-between;font-size:13px;padding:5px 8px;border-radius:6px;background:var(--surface2)}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--muted);font-weight:500;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface2)}
tfoot td{font-weight:600;border-bottom:none}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}
.filters input{min-width:0;width:220px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 11px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* board */
.board-scroll{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;min-width:1180px}
.col{background:var(--surface2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 6px}
.col-h b{font-size:13.5px}
.col-h span{font-size:12px;color:var(--muted)}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.card:hover{border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent)}
.card .nm{font-weight:600;display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.card .nx{font-size:12px;padding:5px 7px;border-radius:6px;background:var(--surface2)}
.card .nx.due{background:var(--bad-soft);color:var(--bad)}
.stale{color:var(--warn);font-weight:600}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-h{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
.dr-h .ttl{flex:1;min-width:0}
.dr-h h1{font-size:18px}
.dr-h .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:12.5px;color:var(--muted)}
.dr-b{overflow:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.sec>h3{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center}
details.sec>summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.sec>summary::after{content:"펼치기";font-weight:500;font-size:12px}
details.sec[open]>summary::after{content:"접기"}
details.sec[open]>summary{margin-bottom:10px}

.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 4px;text-align:center;font-size:12px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;gap:1px}
.step small{font-size:10.5px;font-family:var(--f-num);opacity:.8}
.step.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.step.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.statusbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.statusbar button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:500;color:var(--muted)}
.statusbar button[aria-pressed="true"]{border-color:transparent}
.stopbox{margin-top:10px;padding:12px;border-radius:10px;background:var(--bad-soft);display:flex;flex-direction:column;gap:8px}
.notice{padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.notice.info{background:var(--info-soft);color:var(--info)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>span{font-size:12px;color:var(--muted);font-weight:500}
.fld input:not([type=checkbox]),.fld select,.fld textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
.fld textarea,textarea.inp{resize:vertical;min-height:64px}
.fld .req{color:var(--bad)}
.chk{display:flex;align-items:center;gap:7px;padding-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips label{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:2px 9px 2px 6px;font-size:12.5px;cursor:pointer}
.chips label:has(input:checked){background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.quick{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}

.docs{display:flex;flex-direction:column;gap:4px}
.doc{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13px}
.doc select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:12.5px}
.doc.ok span{color:var(--muted);text-decoration:line-through}
.doc.fix span{color:var(--bad);font-weight:600}
.progress{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-bottom:10px}
.progress i{display:block;height:100%;background:var(--accent)}

.logs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.log{padding:8px 10px;border-radius:8px;background:var(--surface2);font-size:13px}
.log .h{display:flex;gap:8px;font-size:11.5px;color:var(--muted);margin-bottom:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:0}
.dates{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:6px;font-size:11px;color:var(--muted);text-align:center}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:rgba(10,20,16,.42)}
.modal-c{background:var(--bg);border-radius:14px;box-shadow:var(--shadow);width:min(760px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}
.modal-h{padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-b{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:12px 18px;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
.modal-f .msg{flex:1;min-width:0;font-size:13px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.x{border:0;background:transparent;font-size:20px;line-height:1;color:var(--muted);padding:2px 6px;border-radius:6px}
.x:hover{background:var(--surface2)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><i>채</i>채움 정책자금 보드</div>
    <nav id="nav">
      <a href="#today">오늘</a>
      <a href="#board">진행 보드</a>
      <a href="#list">전체 목록</a>
      <a href="#fees">수수료 정산</a>
      <a href="#sources">소개처</a>
    </nav>
    <div class="top-actions">
      <button class="btn" data-act="openImport">일괄 등록</button>
      <button class="btn pri" data-act="openIntake">+ 신규 접수</button>
    </div>
  </div>
</header>
<main class="wrap" id="app">
  <div class="panel empty"><b>데이터를 불러오는 중입니다</b>잠시만 기다려 주세요.</div>
</main>
<div id="drawer"></div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- constants ---------- */
const STAGES=['접수','1차 미팅','자료 받기','진행 체크','자금 집행'];
const STATUSES=['진행중','보류','반려','취소','거절','완료'];
const CLOSED=['반려','취소','거절'];
const ACTIVE=['진행중','보류'];
const REASONS={
  반려:['세금체납','금융연체','신용점수미달','지원제외업종','업력요건미달','보증한도초과','매출부족','휴폐업','기타'],
  취소:['연락두절','고객변심','타사진행','시기연기','수수료이견','소개처요청','기타'],
  거절:['기관심사부결','실사부적합','예산소진','서류미비','기타']};
const STATUS_HELP={반려:'검토 결과 진행 불가로 판단해 소개처에 돌려보냅니다.',취소:'고객사나 소개처 사정으로 진행을 멈춥니다.',거절:'기관 심사에서 부결되었습니다.'};
const AGENCIES=['중진공','소진공','신보','기보','지역신보','지자체','은행협약','기타'];
const SUB3=['신청서 작성','기관 접수','현장 실사','심사 중','승인'];
const REGIONS=['서울','부산','대구','인천','광주','대전','울산','세종','경기','강원','충북','충남','전북','전남','경북','경남','제주'];
const CERTS=['벤처','이노비즈','메인비즈','기업부설연구소','특허','여성기업','장애인기업','사회적기업'];
const DOC_ST=['미요청','요청','수령','보완필요','해당없음'];
const DEFAULT_DOCS=[['사업자등록증'],['표준재무제표증명(3년)'],['부가세 과세표준증명'],['국세·지방세 납세증명서'],['4대보험 가입자명부'],['대표자 신분증 사본'],['법인등기부등본',1],['주주명부',1],['사업장 임대차계약서'],['신용정보 조회 동의서'],['사업계획서']];
const LOG_TYPES=['전화','미팅','카톡','이메일','기관 연락','소개처 보고','메모'];
const FEE_ST=['청구전','청구','입금완료'];

/* ---------- state ---------- */
const S={db:null,sources:new Map(),clients:new Map(),cases:new Map(),loaded:{sources:false,clients:false,cases:false},
  slow:false,err:null,view:'today',open:null,pendingStop:null,f:{status:'active',source:'',q:''},bf:{source:'',q:''},sample:null,dupAck:null,drawerDirty:false};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const addDays=(iso,n)=>{const d=iso?new Date(iso+'T00:00:00'):new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const daysSince=iso=>iso?Math.floor((Date.now()-new Date(iso).getTime())/864e5):0;
const daysUntil=iso=>Math.round((new Date(iso+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const ym=iso=>(iso||'').slice(0,7);
const thisMonth=()=>today().slice(0,7);
const short=iso=>iso?iso.slice(5).replace('-','.'):'';
const digits=s=>String(s||'').replace(/\D/g,'');
const n0=v=>Number(v)||0;
function man(v){v=n0(v);if(!v)return '0';const neg=v<0;v=Math.abs(v);const e=Math.floor(v/10000),r=Math.round((v%10000)*10)/10;
  let s=e?`${e.toLocaleString()}억`:'';if(r)s+=(s?' ':'')+`${r.toLocaleString(undefined,{maximumFractionDigits:1})}만`;return (neg?'-':'')+s}
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function getPath(o,k){return k.split('.').reduce((a,p)=>a==null?a:a[p],o)}
function nest(k,v){const ps=k.split('.');const o={};let cur=o;ps.forEach((p,i)=>{if(i===ps.length-1)cur[p]=v;else cur=cur[p]={}});return o}
let toastT;function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='toast'+(kind?' '+kind:'');t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}

/* ---------- data access ---------- */
const chains={};
function write(path,fn){const p=(chains[path]||Promise.resolve()).then(fn).catch(e=>{console.error(e);toast('저장하지 못했습니다: '+(e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼습니다':(e&&e.code)||'알 수 없는 오류'),'bad')});chains[path]=p;return p}
const upd=(col,id,data)=>write(col+'/'+id,()=>S.db.doc(col+'/'+id).update(data));
const put=(col,id,data)=>write(col+'/'+id,()=>S.db.doc(col+'/'+id).set(data));
const del=(col,id)=>write(col+'/'+id,()=>S.db.doc(col+'/'+id).delete());
const allLoaded=()=>S.loaded.sources&&S.loaded.clients&&S.loaded.cases;

const src=id=>S.sources.get(id)||{name:'미지정',kind:''};
const cli=id=>S.clients.get(id)||{name:'(고객사 없음)'};
const isDirect=id=>src(id).kind==='직접';
const casesArr=()=>[...S.cases.values()];
const sourcesArr=()=>[...S.sources.values()].sort((a,b)=>(a.order??99)-(b.order??99)||String(a.name).localeCompare(b.name));
function nextCode(){const y=new Date().getFullYear();let mx=0;S.cases.forEach(c=>{const m=/^P-(\d{4})-(\d+)$/.exec(c.code||'');if(m&&+m[1]===y)mx=Math.max(mx,+m[2])});return `P-${y}-${String(mx+1).padStart(4,'0')}`}
function nextClientCode(){const y=new Date().getFullYear();let mx=0;S.clients.forEach(c=>{const m=/^C-(\d{4})-(\d+)$/.exec(c.code||'');if(m&&+m[1]===y)mx=Math.max(mx,+m[2])});return `C-${y}-${String(mx+1).padStart(4,'0')}`}
const reached=c=>c.status==='완료'?4:n0(c.stage);
const stale=c=>ACTIVE.includes(c.status)?daysSince(c.stageAt||c.createdAt):0;
const unreported=c=>!isDirect(c.sourceId)&&c.reportedKey!==`${c.stage}|${c.status}`;
const feeLate=c=>c.fee&&c.fee.status!=='입금완료'&&c.fee.dueAt&&c.fee.dueAt<today();

/* ---------- boot ---------- */
let rq=0;function schedule(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})}
async function init(){
  route();window.addEventListener('hashchange',()=>{route();render()});
  const use=window.claude&&window.claude.use?window.claude.use.bind(window.claude):null;
  const db=use?await use('db'):null;
  if(!db){S.err='nodb';render();return}
  S.db=db;
  const timer=setTimeout(()=>{if(!allLoaded()){S.slow=true;schedule()}},10000);
  for(const col of ['sources','clients','cases']){
    db.collection(col).onSnapshot(snap=>{
      const m=new Map();snap.docs.forEach(d=>m.set(d.id,{id:d.id,...d.data()}));S[col]=m;
      if(!snap.metadata.fromCache)S.loaded[col]=true;
      if(allLoaded()){clearTimeout(timer);S.slow=false}
      schedule();
    },e=>{S.err=e.code;clearTimeout(timer);schedule()});
  }
  use('sample').then(s=>{S.sample=s}).catch(()=>{});
}
function route(){const h=location.hash.slice(1);S.view=['today','board','list','fees','sources'].includes(h)?h:'today'}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('#nav a').forEach(a=>{if(a.getAttribute('href')==='#'+S.view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const app=$('#app');
  const fid=document.activeElement&&app.contains(document.activeElement)?document.activeElement.id:null;
  const sel=fid&&document.activeElement.selectionStart!=null?[document.activeElement.selectionStart,document.activeElement.selectionEnd]:null;
  if(S.err==='nodb')app.innerHTML=`<div class="panel empty"><b>저장소에 연결하지 못했습니다</b>claude.ai에 로그인한 상태에서 이 페이지를 열어야 데이터를 보고 입력할 수 있습니다.</div>`;
  else if(S.err&&!allLoaded())app.innerHTML=`<div class="panel empty"><b>데이터를 불러오지 못했습니다 (${esc(S.err)})</b>페이지를 다시 열어 주세요.</div>`;
  else if(!allLoaded()&&!S.cases.size)app.innerHTML=`<div class="panel empty"><b>${S.slow?'저장소 응답이 늦어지고 있습니다':'데이터를 불러오는 중입니다'}</b>${S.slow?'네트워크 상태를 확인해 주세요. 연결되면 자동으로 표시됩니다.':'잠시만 기다려 주세요.'}</div>`;
  else app.innerHTML=(S.slow?`<div class="notice">저장소 응답이 늦어 화면이 최신이 아닐 수 있습니다.</div>`:'')+VIEWS[S.view]();
  if(fid){const el=document.getElementById(fid);if(el){el.focus();if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  renderDrawer();
}

/* ---------- views ---------- */
function kpiTiles(){
  const cs=casesArr(),m=thisMonth();
  const act=cs.filter(c=>ACTIVE.includes(c.status));
  const newM=cs.filter(c=>ym(c.createdAt)===m);
  const exM=cs.filter(c=>c.status==='완료'&&ym(c.executedAt)===m);
  const feeM=exM.reduce((s,c)=>s+n0(c.fee&&c.fee.amount),0);
  const unpaid=cs.filter(c=>c.fee&&c.fee.status!=='입금완료').reduce((s,c)=>s+n0(c.fee.amount),0);
  const late=cs.filter(feeLate).length;
  return `<section class="kpis">
    <div class="kpi"><span class="l">진행 중</span><span class="v num">${act.length}<small>건</small></span><span class="d">파이프라인 ${man(act.reduce((s,c)=>s+n0(c.planAmount),0))}원 · 보류 ${act.filter(c=>c.status==='보류').length}</span></div>
    <div class="kpi"><span class="l">이번 달 신규 접수</span><span class="v num">${newM.length}<small>건</small></span><span class="d">${sourcesArr().map(s=>`${esc(s.name)} ${newM.filter(c=>c.sourceId===s.id).length}`).join(' · ')||'—'}</span></div>
    <div class="kpi"><span class="l">이번 달 자금 집행</span><span class="v num">${man(exM.reduce((s,c)=>s+n0(c.executed),0))}<small>원</small></span><span class="d">${exM.length}건 집행 완료</span></div>
    <div class="kpi"><span class="l">수수료 · 이번 달 발생</span><span class="v num">${man(feeM)}<small>원</small></span><span class="d" style="${late?'color:var(--bad)':''}">미수금 ${man(unpaid)}원${late?` · 지연 ${late}건`:''}</span></div>
  </section>`;
}
function todoItems(){
  const out=[],t=today();
  casesArr().forEach(c=>{
    const nm=cli(c.clientId).name;
    if(ACTIVE.includes(c.status)){
      if(c.nextDue&&c.nextDue<=t){const d=daysUntil(c.nextDue);out.push({c,nm,sev:d<0?'bad':'warn',w:d<0?0:1,r:`${d<0?`기한 ${-d}일 지남`:'오늘 기한'} · ${c.nextAction||'다음 할 일'}`})}
      else if(!c.nextAction)out.push({c,nm,sev:'info',w:5,r:'다음 할 일이 비어 있습니다'});
      const st=stale(c);if(st>=14)out.push({c,nm,sev:'warn',w:2,r:`${STAGES[c.stage]} 단계에서 ${st}일째 정체`});
      const fix=(c.docs||[]).filter(d=>d.st==='보완필요').length;if(fix)out.push({c,nm,sev:'warn',w:2,r:`서류 보완 필요 ${fix}건`});
      if(n0(c.stage)>=1&&!cli(c.clientId).consent)out.push({c,nm,sev:'info',w:4,r:'개인정보·신용조회 동의 확인 필요'});
    }
    if(unreported(c)&&(n0(c.stage)>0||c.status!=='진행중'))out.push({c,nm,sev:'info',w:3,r:`${src(c.sourceId).name}에 진행 상황 미보고 (${c.status==='진행중'?STAGES[c.stage]:c.status})`});
    if(feeLate(c))out.push({c,nm,sev:'bad',w:0,r:`수수료 입금 지연 · ${man(c.fee.amount)}원 (예정 ${short(c.fee.dueAt)})`});
  });
  return out.sort((a,b)=>a.w-b.w);
}
function vToday(){
  const items=todoItems(),cs=casesArr();
  const funnel=STAGES.map((s,i)=>cs.filter(c=>reached(c)>=i).length);
  const mx=Math.max(1,funnel[0]);
  const rc={};cs.filter(c=>CLOSED.includes(c.status)).forEach(c=>{const k=`${c.status} · ${c.stopReason||'사유 없음'}`;rc[k]=(rc[k]||0)+1});
  const rtop=Object.entries(rc).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `<div class="row" style="justify-content:space-between"><div><h1>오늘 할 일</h1><div class="sub">${today().replace(/-/g,'.')} 기준</div></div></div>
  ${kpiTiles()}
  <div class="grid2">
    <section class="panel"><div class="panel-h"><h2>처리할 일 <span class="count num">${items.length}</span></h2><span class="sub">기한 지남 → 오늘 → 정체 → 보고 순</span></div>
      ${items.length?`<div class="todo">${items.map(it=>`<button class="sev-${it.sev}" data-open="${it.c.id}"><span class="bar"></span><span style="min-width:0"><div class="t">${esc(it.nm)}${it.c.sample?'<span class="tag-ex">예시</span>':''}</div><div class="r">${esc(it.r)}</div></span><span class="src">${esc(src(it.c.sourceId).name)}</span></button>`).join('')}</div>`
      :`<div class="empty"><b>오늘 처리할 일이 없습니다</b>진행건마다 '다음 할 일'과 기한을 적어 두면 여기에 모입니다.</div>`}
    </section>
    <section class="panel"><div class="panel-h"><h2>단계별 도달 현황</h2><span class="sub">전체 ${cs.length}건</span></div>
      <div class="funnel">${STAGES.map((s,i)=>`<div class="fun-row"><span>${i} ${s}</span><div class="fun-track"><div class="fun-fill" style="width:${funnel[i]/mx*100}%"></div></div><span class="num" style="text-align:right">${funnel[i]}</span></div>`).join('')}</div>
      <h2 style="margin-top:18px">반려·취소·거절 사유</h2>
      ${rtop.length?`<div class="reasons">${rtop.map(([k,v])=>`<div><span>${esc(k)}</span><b class="num">${v}</b></div>`).join('')}</div>`:`<div class="sub" style="margin-top:6px">아직 중단된 건이 없습니다.</div>`}
    </section>
  </div>
  ${sourcePerf()}`;
}
function sourcePerf(){
  const cs=casesArr();
  const rows=sourcesArr().map(s=>{const a=cs.filter(c=>c.sourceId===s.id);const done=a.filter(c=>c.status==='완료');const ended=a.filter(c=>c.status==='완료'||CLOSED.includes(c.status));
    return {s,n:a.length,act:a.filter(c=>ACTIVE.includes(c.status)).length,done:done.length,rate:ended.length?Math.round(done.length/ended.length*100):null,
      rej:a.filter(c=>c.status==='반려').length,ex:done.reduce((t,c)=>t+n0(c.executed),0),fee:a.reduce((t,c)=>t+n0(c.fee&&c.fee.amount),0)}});
  return `<section class="panel"><div class="panel-h"><h2>소개처별 성과</h2><span class="sub">집행률 = 집행 ÷ 종료된 건(집행+반려+취소+거절)</span></div>
  <div class="tbl-wrap"><table><thead><tr><th>소개처</th><th class="r">접수</th><th class="r">진행중</th><th class="r">집행</th><th class="r">집행률</th><th class="r">반려</th><th class="r">집행액</th><th class="r">수수료</th></tr></thead>
  <tbody>${rows.map(r=>`<tr><td><b>${esc(r.s.name)}</b> <span class="sub">${esc(r.s.kind||'')}</span></td><td class="r num">${r.n}</td><td class="r num">${r.act}</td><td class="r num">${r.done}</td><td class="r num">${r.rate==null?'—':r.rate+'%'}</td><td class="r num">${r.rej}</td><td class="r num">${man(r.ex)}</td><td class="r num">${man(r.fee)}</td></tr>`).join('')}</tbody></table></div></section>`;
}
function srcOptions(sel,blank){return (blank?`<option value="">${blank}</option>`:'')+sourcesArr().map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('')}
function matchQ(c,q){if(!q)return true;const cl=cli(c.clientId);return [cl.name,cl.ceo,cl.bizNo,c.code,c.fundName,c.agency].join(' ').toLowerCase().includes(q.toLowerCase())}
function vBoard(){
  const cs=casesArr().filter(c=>ACTIVE.includes(c.status)&&(!S.bf.source||c.sourceId===S.bf.source)&&matchQ(c,S.bf.q));
  return `<div class="row" style="justify-content:space-between"><div><h1>진행 보드</h1><div class="sub">진행중·보류 ${cs.length}건 · 카드를 누르면 상세 관리</div></div>
  <div class="filters"><select id="bf-source" data-filter="bf.source">${srcOptions(S.bf.source,'모든 소개처')}</select><input id="bf-q" data-filter="bf.q" placeholder="기업명·대표자·사업자번호" value="${esc(S.bf.q)}"></div></div>
  <div class="board-scroll"><div class="board">${STAGES.map((s,i)=>{const col=cs.filter(c=>n0(c.stage)===i).sort((a,b)=>(a.nextDue||'9')<(b.nextDue||'9')?-1:1);
    return `<div class="col"><div class="col-h"><b>${i} ${s}</b><span class="num">${col.length}건 · ${man(col.reduce((t,c)=>t+n0(c.planAmount),0))}</span></div>
    ${col.map(cardHtml).join('')||'<div class="sub" style="padding:8px 4px">비어 있음</div>'}</div>`}).join('')}</div></div>`;
}
function cardHtml(c){
  const cl=cli(c.clientId),st=stale(c),due=c.nextDue&&c.nextDue<=today();
  return `<button class="card" data-open="${c.id}"><div class="nm"><span>${esc(cl.name)}${c.sample?'<span class="tag-ex">예시</span>':''}</span>${c.status==='보류'?'<span class="pill st-보류">보류</span>':''}</div>
  <div class="meta"><span class="src">${esc(src(c.sourceId).name)}</span><span>${esc(c.agency||'기관 미정')}</span><span class="num">${man(c.planAmount)}</span>${c.stage==3&&c.sub3?`<span>· ${esc(c.sub3)}</span>`:''}</div>
  ${c.nextAction?`<div class="nx ${due?'due':''}">${c.nextDue?`<b class="num">${short(c.nextDue)}</b> `:''}${esc(c.nextAction)}</div>`:''}
  <div class="meta"><span class="${st>=14?'stale':''}">${st}일째</span>${unreported(c)?'<span>· 미보고</span>':''}</div></button>`;
}
function vList(){
  const F=S.f;const cs=casesArr().filter(c=>(F.status==='all'||(F.status==='active'?ACTIVE.includes(c.status):c.status===F.status))&&(!F.source||c.sourceId===F.source)&&matchQ(c,F.q))
    .sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));

/* ---------- field rendering ---------- */
function fld(t,obj,def,extra){
  const [k,label,type,opts]=def;const v=getPath(obj,k);const id=`f-${t}-${k.replace('.','_')}`;
  const a=`data-t="${t}" data-k="${k}" data-type="${type}"`;let inp;
  if(type==='select')inp=`<select id="${id}" ${a}><option value="">선택</option>${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(type==='tri')inp=`<select id="${id}" ${a}><option value="">미확인</option><option value="예" ${v==='예'?'selected':''}>예</option><option value="아니오" ${v==='아니오'?'selected':''}>아니오</option></select>`;
  else if(type==='area')inp=`<textarea id="${id}" ${a} rows="3">${esc(v)}</textarea>`;
  else if(type==='bool')return `<label class="fld chk ${extra||''}"><input type="checkbox" id="${id}" ${a} ${v?'checked':''}> <span style="font-size:13px;color:var(--ink)">${label}</span></label>`;
  else if(type==='multi')inp=`<div class="chips">${opts.map(o=>`<label><input type="checkbox" ${a} value="${esc(o)}" ${(v||[]).includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div>`;
  else inp=`<input id="${id}" ${a} type="${type==='num'?'number':type==='date'?'date':'text'}" ${type==='num'?'inputmode="decimal" step="any"':''} value="${esc(v??'')}">`;
  const warn=(type==='tri'&&v==='예')?' style="color:var(--bad)"':'';
  return `<label class="fld ${type==='area'||type==='multi'?'wide':''} ${extra||''}"><span${warn}>${label}${warn?' ⚠':''}</span>${inp}</label>`;
}

function createCase(clientId,sourceId,extra){

  const data={code:nextCode(),clientId,sourceId,agency:'',fundName:'',planAmount:null,stage:0,status:'진행중',sub3:'',dates:{s0:today()},stageAt:now,createdAt:now,

  put('cases',id,data);return id;

function setStage(c,i){
  if(i===n0(c.stage))return;
  const dates={...(c.dates||{})};if(!dates['s'+i])dates['s'+i]=today();
  const patch={stage:i,dates,stageAt:new Date().toISOString()};
  const hint={1:'1차 미팅 진행·진단',2:'필요 서류 요청',3:'신청서 작성',4:'집행 확인'}[i];
  if(hint&&i>n0(c.stage))patch.nextAction=hint;
  upd('cases',c.id,patch);toast(`${STAGES[i]} 단계로 변경했습니다`);
}
function completeCase(c){
  const ex=n0(c.executed);if(!ex){toast('집행 금액을 먼저 입력하세요','bad');$('#f-case-executed')?.focus();return}
  const exAt=c.executedAt||today();const fee=calcFee(c,ex);
  const dates={...(c.dates||{}),s4:exAt};
  upd('cases',c.id,{stage:4,status:'완료',dates,executedAt:exAt,stageAt:new Date().toISOString(),nextAction:'',nextDue:'',
    fee:{status:'청구전',billedAt:'',paidAt:'',invoice:false,...(c.fee||{}),...fee,dueAt:(c.fee&&c.fee.dueAt)||addDays(exAt,30)}});
  toast(fee.amount!=null?`집행 완료 · 수수료 ${man(fee.amount)}원 계산됨`:'집행 완료 · 소개처 수수료 기준이 없어 금액을 직접 입력하세요');

function calcFee(c,ex){const s=src(c.sourceId);
  if(s.feeType==='집행액 × %'&&s.feeRate!=null&&s.feeRate!=='')return {rate:+s.feeRate,amount:Math.round(ex*s.feeRate/100*10)/10,billTo:s.billTo||'소개처'};
  if(s.feeType==='건당 고정액')return {rate:null,amount:n0(s.feeFixed),billTo:s.billTo||'소개처'};
  return {rate:null,amount:null,billTo:s.billTo||'고객사'};}

function parseRows(text){const lines=text.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)return [];const sep=lines[0].includes('\t')?'\t':',';
  const heads=lines[0].split(sep).map(h=>IMPORT_MAP[h.replace(/\s|\(.*?\)/g,'')]||null);
  return lines.slice(1).map(l=>{const cells=l.split(sep);const r={};heads.forEach((h,i)=>{if(h&&cells[i]!=null&&cells[i].trim()!=='')r[h]=cells[i].trim()});return r}).filter(r=>r.name)}

    const cid=newId('c'),pid=newId('p'),now=new Date().toISOString(),amt=r.wantAmount?Number(digits(r.wantAmount))||null:null;
    const bt=/법인/.test(r.bizType||'')?'법인':/개인/.test(r.bizType||'')?'개인':'';
    const reg=REGIONS.find(x=>(r.region||'').startsWith(x))||'';
    put('clients',cid,{code:`C-${y}-${String(++cMax).padStart(4,'0')}`,sourceId:sid,receivedAt:today(),name:r.name,bizNo:r.bizNo||'',ceo:r.ceo||'',phone:r.phone||'',bizType:bt,region:reg,city:'',industry:r.industry||'',foundedAt:r.foundedAt||'',wantAmount:amt,purpose:r.purpose||'',request:r.request||'',sourceStaff:r.sourceStaff||'',consent:false,certs:[],intakeConsent:true});
    put('cases',pid,{code:`P-${y}-${String(++pMax).padStart(4,'0')}`,clientId:cid,sourceId:sid,agency:'',fundName:'',planAmount:amt,stage:0,status:'진행중',sub3:'',dates:{s0:today()},stageAt:now,createdAt:now,nextAction:'1차 미팅 일정 잡기',nextDue:addDays(today(),2),docs:makeDocs(bt),logs:[],reportedKey:''});
    n++;});
  closeModal();toast(`${n}건을 등록했습니다`);
}
function openSource(id){
  const s=id?S.sources.get(id):{};const used=id&&casesArr().some(c=>c.sourceId===id);
  modal(id?'소개처 수정':'소개처 추가',`<div class="form">${SOURCE_FIELDS.map(([k,l,t,o])=>mf(k,l,t,o,k==='name')).join('')}</div>`,
    `<span class="msg" id="m-msg"></span>${id&&!used?`<button class="btn danger" data-act="sourceDel" data-id="${id}">삭제</button>`:''}<button class="btn" data-act="modalClose">닫기</button><button class="btn pri" data-act="sourceSave" data-id="${id||''}">저장</button>`);
  SOURCE_FIELDS.forEach(([k])=>{const el=$('#m-'+k);if(el&&s[k]!=null)el.value=s[k]});
}
function saveSource(){
  const id=document.querySelector('[data-act="sourceSave"]').dataset.id;const d={};
  SOURCE_FIELDS.forEach(([k,,t])=>{const v=$('#m-'+k).value.trim();d[k]=t==='num'?(v===''?null:Number(v)):v});
  if(!d.name){$('#m-msg').innerHTML='<span style="color:var(--bad)">소개처명을 입력하세요.</span>';return}
  if(id)upd('sources',id,d);else put('sources',newId('s'),{...d,order:S.sources.size});
  closeModal();toast('저장했습니다');
}

init();
</script>
