<title>채움 업무 보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar + tabbed workspace; case detail opens in a right-side drawer */
:root{
  --bg:#f4f7f5;--surface:#ffffff;--surface2:#ecf1ee;--ink:#13201b;--muted:#5a6b64;--line:#d9e2dd;
  --accent:#0d6e5f;--accent-ink:#ffffff;--accent-soft:#dbeee8;
  --warn:#a86a12;--warn-soft:#fbefd9;--bad:#bb3528;--bad-soft:#f8e0dc;--info:#2862a8;--info-soft:#e0ebf7;--ok:#2d7d52;--ok-soft:#ddf0e4;
  --shadow:0 10px 30px rgba(15,40,32,.12);
  --s1:#0d6e5f;--s2:#6b4fbb;--s3:#b4581f;--s4:#2862a8;--s5:#8a6d00;--s6:#a33a6b;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1412;--surface:#151d1a;--surface2:#1c2622;--ink:#e2ebe7;--muted:#92a39c;--line:#283430;
  --accent:#3dbea4;--accent-ink:#04211b;--accent-soft:#15382f;
  --warn:#e2ae4a;--warn-soft:#382c14;--bad:#ee7b6e;--bad-soft:#3b1d19;--info:#7aa7df;--info-soft:#19293b;--ok:#66c291;--ok-soft:#16311f;
  --shadow:0 10px 30px rgba(0,0,0,.45);--s1:#3dbea4;--s2:#a68cf0;--s3:#ef9a5d;--s4:#7aa7df;--s5:#d9b84a;--s6:#e783ae;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412;--surface:#151d1a;--surface2:#1c2622;--ink:#e2ebe7;--muted:#92a39c;--line:#283430;
  --accent:#3dbea4;--accent-ink:#04211b;--accent-soft:#15382f;
  --warn:#e2ae4a;--warn-soft:#382c14;--bad:#ee7b6e;--bad-soft:#3b1d19;--info:#7aa7df;--info-soft:#19293b;--ok:#66c291;--ok-soft:#16311f;
  --shadow:0 10px 30px rgba(0,0,0,.45);--s1:#3dbea4;--s2:#a68cf0;--s3:#ef9a5d;--s4:#7aa7df;--s5:#d9b84a;--s6:#e783ae;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.02em}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:13px}
nav{display:flex;gap:2px;flex:1;overflow-x:auto;min-width:0}
nav a{padding:7px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
nav a:hover{background:var(--surface2);color:var(--ink)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.top-actions{display:flex;gap:8px}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

main.wrap{padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
h1{font-size:20px;margin:0;letter-spacing:-.02em}
h2{font-size:15px;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.count{background:var(--surface2);color:var(--muted);border-radius:99px;padding:0 8px;font-size:12px;font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.02em}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px;font-family:var(--f-body)}
.kpi .d{font-size:12px;color:var(--muted)}

/* todo */
.todo{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto}
.todo>button{all:unset;cursor:pointer;display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 12px 9px 0;border-radius:8px;background:var(--surface2)}
.todo>button:hover{outline:1px solid var(--line)}
.todo>button:focus-visible{outline:2px solid var(--accent)}
.todo .bar{align-self:stretch;border-radius:4px 0 0 4px}
.sev-bad .bar{background:var(--bad)}.sev-warn .bar{background:var(--warn)}.sev-info .bar{background:var(--info)}
.todo .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo .r{font-size:12.5px;color:var(--muted)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* chips & pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.st-진행중{background:var(--info-soft);color:var(--info)}
.st-보류{background:var(--warn-soft);color:var(--warn)}
.st-반려,.st-거절{background:var(--bad-soft);color:var(--bad)}
.st-취소{background:var(--surface2);color:var(--muted)}
.st-완료{background:var(--ok-soft);color:var(--ok)}
.src{font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;white-space:nowrap}
.tag-ex{font-size:11px;color:var(--warn);border:1px dashed var(--warn);border-radius:5px;padding:0 4px;margin-left:4px;font-weight:500}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:8px}
.fun-row{display:grid;grid-template-columns:78px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px}
.fun-track{height:18px;background:var(--surface2);border-radius:5px;overflow:hidden}
.fun-fill{height:100%;background:var(--accent);border-radius:5px;opacity:.85}
.reasons{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.reasons div{display:flex;justify-content:space-between;font-size:13px;padding:5px 8px;border-radius:6px;background:var(--surface2)}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--muted);font-weight:500;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface2)}
tfoot td{font-weight:600;border-bottom:none}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}
.filters input{min-width:0;width:220px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 11px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* board */
.board-scroll{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;min-width:1180px}
.col{background:var(--surface2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 6px}
.col-h b{font-size:13.5px}
.col-h span{font-size:12px;color:var(--muted)}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.card:hover{border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent)}
.card .nm{font-weight:600;display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.card .nx{font-size:12px;padding:5px 7px;border-radius:6px;background:var(--surface2)}
.card .nx.due{background:var(--bad-soft);color:var(--bad)}
.stale{color:var(--warn);font-weight:600}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-h{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
.dr-h .ttl{flex:1;min-width:0}
.dr-h h1{font-size:18px}
.dr-h .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:12.5px;color:var(--muted)}
.dr-b{overflow:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.sec>h3{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center}
details.sec>summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.sec>summary::after{content:"펼치기";font-weight:500;font-size:12px}
details.sec[open]>summary::after{content:"접기"}
details.sec[open]>summary{margin-bottom:10px}

.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 4px;text-align:center;font-size:12px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;gap:1px}
.step small{font-size:10.5px;font-family:var(--f-num);opacity:.8}
.step.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.step.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.statusbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.statusbar button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:500;color:var(--muted)}
.statusbar button[aria-pressed="true"]{border-color:transparent}
.stopbox{margin-top:10px;padding:12px;border-radius:10px;background:var(--bad-soft);display:flex;flex-direction:column;gap:8px}
.notice{padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.notice.info{background:var(--info-soft);color:var(--info)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>span{font-size:12px;color:var(--muted);font-weight:500}
.fld input:not([type=checkbox]),.fld select,.fld textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
.fld textarea,textarea.inp{resize:vertical;min-height:64px}
.fld .req{color:var(--bad)}
.chk{display:flex;align-items:center;gap:7px;padding-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips label{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:2px 9px 2px 6px;font-size:12.5px;cursor:pointer}
.chips label:has(input:checked){background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.quick{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}

.docs{display:flex;flex-direction:column;gap:4px}
.doc{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13px}
.doc select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:12.5px}
.doc.ok span{color:var(--muted);text-decoration:line-through}
.doc.fix span{color:var(--bad);font-weight:600}
.progress{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-bottom:10px}
.progress i{display:block;height:100%;background:var(--accent)}

.logs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.log{padding:8px 10px;border-radius:8px;background:var(--surface2);font-size:13px}
.log .h{display:flex;gap:8px;font-size:11.5px;color:var(--muted);margin-bottom:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:0}
.dates{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:6px;font-size:11px;color:var(--muted);text-align:center}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:rgba(10,20,16,.42)}
.modal-c{background:var(--bg);border-radius:14px;box-shadow:var(--shadow);width:min(760px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}
.modal-h{padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-b{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:12px 18px;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
.modal-f .msg{flex:1;min-width:0;font-size:13px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.x{border:0;background:transparent;font-size:20px;line-height:1;color:var(--muted);padding:2px 6px;border-radius:6px}
.x:hover{background:var(--surface2)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}

.svc{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:0 7px;border-radius:6px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.opp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;background:var(--surface2)}
.opp .t{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.opp .r{font-size:12.5px;color:var(--muted)}
.dist{display:grid;grid-template-columns:repeat(5,28px);gap:3px}
.dist span{height:22px;border-radius:5px;background:var(--surface2);font-size:11.5px;font-weight:600;display:grid;place-items:center;font-family:var(--f-num)}
.dist span.on{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.brief{white-space:pre-wrap;word-break:break-word;font-family:var(--f-body);font-size:13px;line-height:1.65;background:var(--surface2);border-radius:10px;padding:14px;margin:0;max-height:560px;overflow:auto}
.brief.ai{background:var(--accent-soft)}
a.btn{text-decoration:none;color:inherit}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><i>채</i>채움 업무 보드</div>
    <nav id="nav">
      <a href="#today">오늘</a>
      <a href="#brief">브리핑</a>
      <a href="#board">진행 보드</a>
      <a href="#list">전체 목록</a>
      <a href="#fees">정산</a>
      <a href="#sources">소개처</a>
    </nav>
    <div class="top-actions">
      <button class="btn" data-act="openImport">일괄 등록</button>
      <button class="btn pri" data-act="openIntake">+ 신규 접수</button>
    </div>
  </div>
</header>
<main class="wrap" id="app">
  <div class="panel empty"><b>데이터를 불러오는 중입니다</b>잠시만 기다려 주세요.</div>
</main>
<div id="drawer"></div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- constants ---------- */
const STATUSES=['진행중','보류','반려','취소','거절','완료'];
const CLOSED=['반려','취소','거절'];
const ACTIVE=['진행중','보류'];
const REASONS={
  반려:['세금체납','금융연체','신용점수미달','지원제외업종','업력요건미달','요건미달','보증한도초과','매출부족','휴폐업','기타'],
  취소:['연락두절','고객변심','타사진행','시기연기','수수료이견','소개처요청','기타'],
  거절:['기관심사부결','인증심사탈락','실사부적합','예산소진','서류미비','기타']};
const STATUS_HELP={반려:'검토 결과 진행 불가로 판단해 돌려보냅니다.',취소:'고객사나 소개처 사정으로 진행을 멈춥니다.',거절:'기관 심사(자금·인증·연구소)에서 부결되었습니다.'};
const AGENCIES=['중진공','소진공','신보','기보','지역신보','지자체','은행협약','기타'];

const addDays=(iso,n)=>{const d=iso?new Date(iso+'T00:00:00'):new Date();d.setDate(d.getDate()+n);return isoOf(d)};
const daysSince=iso=>iso?Math.floor((Date.now()-new Date(iso).getTime())/864e5):0;

const n0=v=>Number(v)||0;
function man(v){v=n0(v);if(!v)return '0';const neg=v<0;v=Math.abs(v);const e=Math.floor(v/10000),r=Math.round((v%10000)*10)/10;
  let s=e?`${e.toLocaleString()}억`:'';if(r)s+=(s?' ':'')+`${r.toLocaleString(undefined,{maximumFractionDigits:1})}만`;return (neg?'-':'')+s}
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function getPath(o,k){return k.split('.').reduce((a,p)=>a==null?a:a[p],o)}
function nest(k,v){const ps=k.split('.');const o={};let cur=o;ps.forEach((p,i)=>{if(i===ps.length-1)cur[p]=v;else cur=cur[p]={}});return o}
let toastT;function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='toast'+(kind?' '+kind:'');t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}

const chains={};

function expRevenue(c){if(svc(c)==='정책자금'){const s=src(c.sourceId);if(s.feeType==='집행액 × %'&&s.feeRate)return n0(c.planAmount)*s.feeRate/100;if(s.feeType==='건당 고정액')return n0(s.feeFixed);return 0}return n0(c.contractAmount)}

/* ---------- boot ---------- */
let rq=0;function schedule(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})}
async function init(){
  route();window.addEventListener('hashchange',()=>{route();render()});
  const use=window.claude&&window.claude.use?window.claude.use.bind(window.claude):null;
  const db=use?await use('db'):null;
  if(!db){S.err='nodb';render();return}
  S.db=db;
  const timer=setTimeout(()=>{if(!allLoaded()){S.slow=true;schedule()}},10000);
  for(const col of ['sources','clients','cases']){
    db.collection(col).onSnapshot(snap=>{
      const m=new Map();snap.docs.forEach(d=>m.set(d.id,{id:d.id,...d.data()}));S[col]=m;
      if(!snap.metadata.fromCache)S.loaded[col]=true;
      if(allLoaded()){clearTimeout(timer);S.slow=false}
      schedule();
    },e=>{S.err=e.code;clearTimeout(timer);schedule()});
  }
  use('sample').then(s=>{S.sample=s;schedule()}).catch(()=>{});
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('#nav a').forEach(a=>{if(a.getAttribute('href')==='#'+S.view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const app=$('#app');
  const fid=document.activeElement&&app.contains(document.activeElement)?document.activeElement.id:null;
  const sel=fid&&document.activeElement.selectionStart!=null?[document.activeElement.selectionStart,document.activeElement.selectionEnd]:null;
  if(S.err==='nodb')app.innerHTML=`<div class="panel empty"><b>저장소에 연결하지 못했습니다</b>claude.ai에 로그인한 상태에서 이 페이지를 열어야 데이터를 보고 입력할 수 있습니다.</div>`;
  else if(S.err&&!allLoaded())app.innerHTML=`<div class="panel empty"><b>데이터를 불러오지 못했습니다 (${esc(S.err)})</b>페이지를 다시 열어 주세요.</div>`;
  else if(!allLoaded()&&!S.cases.size)app.innerHTML=`<div class="panel empty"><b>${S.slow?'저장소 응답이 늦어지고 있습니다':'데이터를 불러오는 중입니다'}</b>${S.slow?'네트워크 상태를 확인해 주세요. 연결되면 자동으로 표시됩니다.':'잠시만 기다려 주세요.'}</div>`;
  else app.innerHTML=(S.slow?`<div class="notice">저장소 응답이 늦어 화면이 최신이 아닐 수 있습니다.</div>`:'')+VIEWS[S.view]();
  if(fid){const el=document.getElementById(fid);if(el){el.focus();if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  renderDrawer();
}

  const doneM=cs.filter(c=>c.status==='완료'&&ym(doneAt(c))===m);
  const pfEx=doneM.filter(c=>svc(c)==='정책자금').reduce((s,c)=>s+n0(c.executed),0);
  const revM=doneM.reduce((s,c)=>s+n0(c.fee&&c.fee.amount),0);
  const unpaid=cs.filter(c=>c.fee&&c.fee.status!=='입금완료').reduce((s,c)=>s+n0(c.fee.amount),0);
  const late=cs.filter(feeLate).length;

function todoItems(){

      if(c.nextDue&&c.nextDue<=t){const d=daysUntil(c.nextDue);out.push({c,nm,sv,sev:d<0?'bad':'warn',w:d<0?0:1,r:`${d<0?`기한 ${-d}일 지남`:'오늘 기한'} · ${c.nextAction||'다음 할 일'}`})}

      const fix=(c.docs||[]).filter(d=>d.st==='보완필요').length;if(fix)out.push({c,nm,sv,sev:'warn',w:2,r:`서류 보완 필요 ${fix}건`});

      if(sv==='재무결산'&&c.filingDue){const d=daysUntil(c.filingDue);if(d<=14)out.push({c,nm,sv,sev:d<0?'bad':'warn',w:d<0?0:1,r:`신고 기한 ${d<0?`${-d}일 지남`:`D-${d}`} (${short(c.filingDue)})`})}
    }

  });
  return out.sort((a,b)=>a.w-b.w);

function opportunities(){
  const out=[],m=new Date().getMonth()+1;
  const byClient={};casesArr().forEach(c=>{(byClient[c.clientId]=byClient[c.clientId]||[]).push(c)});
  Object.entries(byClient).forEach(([cid,cs])=>{
    const cl=cli(cid);if(!cl.name||cs.every(c=>CLOSED.includes(c.status)&&c.stopReason!=='기관심사부결'))return;
    const has=new Set(cs.filter(c=>c.status!=='취소').map(svc));const certs=cl.certs||[];
    const pf=cs.some(c=>svc(c)==='정책자금'&&!['반려','취소'].includes(c.status));
    const sample=cs.some(c=>c.sample);
    if(pf&&!certs.some(x=>['벤처','이노비즈','메인비즈'].includes(x))&&!has.has('기업인증'))out.push({cid,cl,sv:'기업인증',sample,r:'보유 인증 없음 · 벤처·이노비즈 취득 시 정책자금 한도·금리 우대'});
    if(!certs.includes('기업부설연구소')&&!certs.includes('연구개발전담부서')&&!has.has('기업부설연구소')&&/제조|IT|SW|소프트|개발|바이오|연구|기술|전자|기계/.test(cl.industry||''))out.push({cid,cl,sv:'기업부설연구소',sample,r:`기술 업종(${cl.industry}) · 연구소 설립 시 R&D 과제·세액공제·기보 연계`});
    if(pf&&m>=9&&!has.has('가결산'))out.push({cid,cl,sv:'가결산',sample,r:'하반기 · 올해 매출 가결산으로 심사 자료 보강'});
    if(cl.bizType==='법인'&&(m>=11||m<=2)&&!has.has('재무결산')&&cs.some(c=>c.status==='완료'))out.push({cid,cl,sv:'재무결산',sample,r:'법인 결산 시즌 (3월 말 신고) · 기존 거래 고객'});
  });
  return out;
}

function periodRange(p){const t=today();if(p==='today')return [t,t,'오늘'];if(p==='week')return [addDays(t,-6),t,'최근 7일'];return [thisMonth()+'-01',t,'이번 달']}
function briefData(){
  const [from,to,label]=periodRange(S.br.period),inR=d=>d&&d.slice(0,10)>=from&&d.slice(0,10)<=to;
  const cs=casesArr();
  const created=cs.filter(c=>inR(c.createdAt));
  const moves=[];cs.forEach(c=>{const ds=c.dates||{};[1,2,3].forEach(i=>{if(inR(ds['s'+i]))moves.push({c,i})})});
  const done=cs.filter(c=>c.status==='완료'&&inR(doneAt(c)));
  const stopped=cs.filter(c=>CLOSED.includes(c.status)&&inR(c.closedAt));

function sourceReport(sid){

}

/* ---------- field rendering ---------- */
function fld(t,obj,def,extra){
  const [k,label,type,opts]=def;const v=getPath(obj,k);const id=`f-${t}-${k.replace('.','_')}`;
  const a=`data-t="${t}" data-k="${k}" data-type="${type}"`;let inp;
  if(type==='select')inp=`<select id="${id}" ${a}><option value="">선택</option>${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(type==='tri')inp=`<select id="${id}" ${a}><option value="">미확인</option><option value="예" ${v==='예'?'selected':''}>예</option><option value="아니오" ${v==='아니오'?'selected':''}>아니오</option></select>`;
  else if(type==='area')inp=`<textarea id="${id}" ${a} rows="3">${esc(v)}</textarea>`;
  else if(type==='bool')return `<label class="fld chk ${extra||''}"><input type="checkbox" id="${id}" ${a} ${v?'checked':''}> <span style="font-size:13px;color:var(--ink)">${label}</span></label>`;
  else if(type==='multi')inp=`<div class="chips">${opts.map(o=>`<label><input type="checkbox" ${a} value="${esc(o)}" ${(v||[]).includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div>`;
  else inp=`<input id="${id}" ${a} type="${type==='num'?'number':type==='date'?'date':'text'}" ${type==='num'?'inputmode="decimal" step="any"':''} value="${esc(v??'')}">`;
  const warn=(type==='tri'&&v==='예')?' style="color:var(--bad)"':'';
  return `<label class="fld ${type==='area'||type==='multi'?'wide':''} ${extra||''}"><span${warn}>${label}${warn?' ⚠':''}</span>${inp}</label>`;
}

    </section>
    ${c.fee||c.status==='완료'?`<section class="sec"><h3>${sv==='정책자금'?'수수료':'용역비'} 정산 <button class="btn sm" data-act="recalc">다시 계산</button></h3>

      ${fld('case',c,['fee.billedAt','청구일','date'])}${fld('case',c,['fee.dueAt','입금 예정일','date'])}${fld('case',c,['fee.paidAt','입금일','date'])}${fld('case',c,['fee.invoice','세금계산서 발행','bool'])}</div>
      ${feeLate(c)?'<div class="notice bad" style="margin-top:10px">입금 예정일이 지났습니다.</div>':''}</section>`:''}
    <section class="sec"><h3>서류 체크 <span class="sub num" style="font-weight:500">${okN}/${docs.length}</span></h3>
      <div class="progress"><i style="width:${docs.length?okN/docs.length*100:0}%"></i></div>
      <div class="docs">${docs.map((d,i)=>`<div class="doc ${d.st==='수령'||d.st==='해당없음'?'ok':''} ${d.st==='보완필요'?'fix':''}"><span>${esc(d.name)}${d.at?` <small class="sub num">${short(d.at)}</small>`:''}</span><select data-doc="${i}" aria-label="${esc(d.name)} 상태">${DOC_ST.map(o=>`<option ${o===d.st?'selected':''}>${o}</option>`).join('')}</select></div>`).join('')||'<div class="sub">서류 목록이 비어 있습니다. <button class="btn sm" data-act="defaultDocs">기본 서류 넣기</button></div>'}</div>
      <div class="row" style="margin-top:8px"><input class="inp grow" id="doc-new" placeholder="서류 추가"><button class="btn sm" data-act="addDoc">추가</button><button class="btn sm" data-act="reqAll">미요청 → 요청</button></div>
    </section>
    <section class="sec"><h3>활동 기록</h3>
      <div class="row"><select class="inp" id="lg-type" style="width:auto">${LOG_TYPES.map(t=>`<option>${t}</option>`).join('')}</select><input class="inp grow" id="lg-text" placeholder="미팅·통화 내용 요약"><button class="btn sm pri" data-act="addLog">기록</button></div>
      <div class="logs">${(c.logs||[]).map(l=>`<div class="log"><div class="h"><b>${esc(l.type)}</b><span class="num">${esc((l.at||'').slice(0,16).replace('T',' '))}</span></div>${esc(l.text)}</div>`).join('')||'<div class="sub">아직 기록이 없습니다.</div>'}</div>
    </section>
    <details class="sec" open><summary>고객사 기본 정보</summary><div class="form">${CLIENT_BASIC.map(d=>fld('client',cl,d)).join('')}</div></details>
    <details class="sec" ${stg>=1?'open':''}><summary>진단 정보</summary><div class="form">${CLIENT_DIAG.map(d=>fld('client',cl,d)).join('')}</div></details>
    <section class="sec"><h3>이 고객사의 다른 업무</h3>
      ${others.length?`<div class="row" style="margin-bottom:10px">${others.map(o=>`<button class="btn sm" data-open="${o.id}">${esc(svc(o))} · ${esc(stName(o))} · ${o.status}</button>`).join('')}</div>`:''}
      <div class="row"><select class="inp" style="width:auto" id="new-svc">${SVC_NAMES.map(n=>`<option>${n}</option>`).join('')}</select><button class="btn" data-act="addCaseForClient">진행건 추가</button>
      <label class="row sub" style="gap:6px">소개처 <select class="inp" style="width:auto" data-t="case" data-k="sourceId" data-type="text" id="f-case-sourceId">${srcOptions(c.sourceId)}</select></label>
      <span class="grow"></span><button class="btn danger" data-act="delCase" id="btn-delcase">진행건 삭제</button></div>
    </section>
  </div></aside>`;
  host.querySelector('.dr-b').scrollTop=scroll;S.drawerDirty=false;
}
function openCase(id){S.open=id;S.pendingStop=null;renderDrawer();setTimeout(()=>$('#drawer .x')?.focus(),0)}

/* ---------- case logic ---------- */
function makeDocs(service,bizType){return SERVICES[service].docs.map(([n,corp])=>({name:n,st:corp&&bizType==='개인'?'해당없음':'미요청'}))}
function createCase(clientId,sourceId,service,extra,code){
  const id=newId('p');const now=new Date().toISOString();
  const data={code:code||fmtCode('P',maxCode(S.cases,'P')+1),service,clientId,sourceId,stage:0,status:'진행중',dates:{s0:today()},stageAt:now,createdAt:now,
    nextAction:SERVICES[service].hints[0],nextDue:addDays(today(),2),docs:makeDocs(service,cli(clientId).bizType),logs:[],reportedKey:'',...extra};
  put('cases',id,data);S.cases.set(id,{id,...data});return id;
}
function setStage(c,i){
  if(i===n0(c.stage))return;
  const dates={...(c.dates||{})};if(!dates['s'+i])dates['s'+i]=today();
  const patch={stage:i,dates,stageAt:new Date().toISOString()};
  if(i>n0(c.stage))patch.nextAction=SV(c).hints[i];
  upd('cases',c.id,patch);toast(`${SV(c).stages[i]} 단계로 변경했습니다`);
}
function calcFee(c){
  if(svc(c)!=='정책자금')return {rate:null,amount:n0(c.contractAmount)||null,billTo:'고객사'};
  const s=src(c.sourceId),ex=n0(c.executed);
  if(s.feeType==='집행액 × %'&&s.feeRate!=null&&s.feeRate!=='')return {rate:+s.feeRate,amount:Math.round(ex*s.feeRate/100*10)/10,billTo:s.billTo||'소개처'};
  if(s.feeType==='건당 고정액')return {rate:null,amount:n0(s.feeFixed),billTo:s.billTo||'소개처'};
  return {rate:null,amount:null,billTo:s.billTo||'고객사'};
}
function completeCase(c){
  const SD=SV(c);
  if(svc(c)==='정책자금'&&!n0(c.executed)){toast('집행 금액을 먼저 입력하세요','bad');$('#f-case-executed')?.focus();return}
  const at=c[SD.done]||today();const fee=calcFee(c);
  const patch={stage:4,status:'완료',dates:{...(c.dates||{}),s4:at},[SD.done]:at,stageAt:new Date().toISOString(),nextAction:'',nextDue:'',
    fee:{status:'청구전',billedAt:'',paidAt:'',invoice:false,...(c.fee||{}),...fee,dueAt:(c.fee&&c.fee.dueAt)||addDays(at,30)}};
  if(svc(c)==='기업인증'&&c.certType&&!c.expireAt&&['벤처','이노비즈','메인비즈'].includes(c.certType))patch.expireAt=addDays(at,365*3);
  upd('cases',c.id,patch);
  if((svc(c)==='기업인증'||svc(c)==='기업부설연구소')){const cl=cli(c.clientId);const tag=svc(c)==='기업인증'?(CERTS.find(x=>(c.certType||'').startsWith(x))||null):(c.labType||'기업부설연구소');
    if(tag&&!(cl.certs||[]).includes(tag))upd('clients',c.clientId,{certs:[...(cl.certs||[]),tag]})}
  toast(fee.amount!=null?`완료 · 청구액 ${man(fee.amount)}원 계산됨`:'완료 · 청구 기준이 없어 금액을 직접 입력하세요');
}

/* ---------- copy ---------- */
function copyText(id,btn){const el=document.getElementById(id);if(!el)return;const t=el.textContent;
  const fallback=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('텍스트를 선택했습니다. Ctrl+C(⌘C)로 복사하세요')};
  try{navigator.clipboard.writeText(t).then(()=>toast('복사했습니다'),fallback)}catch(e){fallback()}}

/* ---------- events ---------- */
function armed(b,label){if(b.classList.contains('armed'))return true;b.classList.add('armed');const o=b.textContent;b.textContent=label||'한 번 더 누르면 삭제';setTimeout(()=>{b.classList.remove('armed');b.textContent=o},3000);return false}
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]');if(o){openCase(o.dataset.open);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,v=b.dataset.v,c=S.open?S.cases.get(S.open):null;
  switch(act){
    case 'close':S.open=null;S.pendingStop=null;renderDrawer();break;
    case 'stage':c&&setStage(c,+v);break;
    case 'status':
      if(!c||v===c.status)break;
      if(CLOSED.includes(v)){S.pendingStop=v;renderDrawer();setTimeout(()=>$('#stop-reason')?.focus(),0)}
      else if(v==='완료')completeCase(c);
      else{upd('cases',c.id,{status:v,stopReason:'',stopDetail:'',stopStage:null});S.pendingStop=null;toast(`${v}(으)로 변경했습니다`)}
      break;
    case 'stopCancel':S.pendingStop=null;renderDrawer();break;
    case 'stopConfirm':{const r=$('#stop-reason').value;if(!r){toast('사유를 선택하세요','bad');return}
      upd('cases',c.id,{status:S.pendingStop,stopReason:r,stopDetail:$('#stop-detail').value.trim(),stopStage:n0(c.stage),closedAt:today(),nextAction:'',nextDue:''});
      toast(`${S.pendingStop} 처리했습니다${!isDirect(c.sourceId)?` · ${src(c.sourceId).name}에 알려 주세요`:''}`);S.pendingStop=null;break}
    case 'reported':upd('cases',c.id,{reportedKey:`${c.stage}|${c.status}`,reportedAt:today(),logs:[{at:new Date().toISOString(),type:'소개처 보고',text:`${src(c.sourceId).name}에 ${c.status==='진행중'?stName(c)+' 단계':c.status} 보고`},...(c.logs||[])].slice(0,200)});break;
    case 'due':upd('cases',c.id,{nextDue:addDays(today(),+v)});break;
    case 'complete':c&&completeCase(c);break;
    case 'recalc':{const f=calcFee(c);upd('cases',c.id,{fee:{...f}});toast(f.amount!=null?`청구액 ${man(f.amount)}원으로 다시 계산했습니다`:'계산 기준(요율 또는 계약 금액)이 없습니다');break}
    case 'addDoc':{const n=$('#doc-new').value.trim();if(!n)return;upd('cases',c.id,{docs:[...(c.docs||[]),{name:n,st:'요청',at:today()}]});break}
    case 'defaultDocs':upd('cases',c.id,{docs:makeDocs(svc(c),cli(c.clientId).bizType)});break;
    case 'reqAll':upd('cases',c.id,{docs:(c.docs||[]).map(d=>d.st==='미요청'?{...d,st:'요청',at:today()}:d)});toast('미요청 서류를 요청 상태로 바꿨습니다');break;
    case 'addLog':{const t=$('#lg-text').value.trim();if(!t){$('#lg-text').focus();return}
      upd('cases',c.id,{logs:[{at:new Date().toISOString(),type:$('#lg-type').value,text:t},...(c.logs||[])].slice(0,200)});$('#lg-text').value='';break}
    case 'addCaseForClient':{const sv=$('#new-svc').value;const id=createCase(c.clientId,c.sourceId,sv,{});toast(`${sv} 진행건을 만들었습니다`);setTimeout(()=>openCase(id),200);break}
    case 'oppCreate':{const cl=cli(b.dataset.client);const id=createCase(b.dataset.client,cl.sourceId||(S.cases.size?casesArr().find(x=>x.clientId===b.dataset.client).sourceId:''),v,{});toast(`${cl.name} · ${v} 진행건을 만들었습니다`);setTimeout(()=>openCase(id),200);break}
    case 'delCase':
      if(!armed(b))return;
      {const clientId=c.clientId;del('cases',c.id);S.open=null;renderDrawer();
       if(!casesArr().some(x=>x.clientId===clientId&&x.id!==c.id))del('clients',clientId);toast('삭제했습니다')}break;
    case 'fstatus':S.f.status=v;render();break;
    case 'svcf':S[b.dataset.g].svc=v;render();break;
    case 'goBoard':S.bf.svc=v;location.hash='board';break;
    case 'brp':S.br.period=v;S.aiBrief='';render();break;
    case 'copy':copyText(b.dataset.target,b);break;
    case 'aiBrief':aiBrief();break;
    case 'aiClear':S.aiBrief='';render();break;
    case 'markReported':{const rep=sourceReport(S.br.source);const t=new Date().toISOString();let n=0;
      rep.cases.filter(unreported).forEach(x=>{n++;upd('cases',x.id,{reportedKey:`${x.stage}|${x.status}`,reportedAt:today(),logs:[{at:t,type:'소개처 보고',text:`${src(x.sourceId).name} 현황 공유 (${x.status==='진행중'?stName(x)+' 단계':x.status})`},...(x.logs||[])].slice(0,200)})});
      toast(`${n}건을 보고 완료로 표시했습니다`);break}
    case 'openIntake':openIntake();break;
    case 'openImport':openImport();break;
    case 'editSource':openSource(v);break;
    case 'clearSamples':
      if(!armed(b))return;
      S.cases.forEach(x=>x.sample&&del('cases',x.id));S.clients.forEach(x=>x.sample&&del('clients',x.id));toast('예시 데이터를 삭제했습니다');break;
    case 'modalClose':closeModal();break;
    case 'intakeSave':saveIntake();break;
    case 'aiFill':aiFill(b);break;
    case 'importPreview':importPreview();break;
    case 'importRun':importRun();break;
    case 'sourceSave':saveSource();break;
    case 'sourceDel':if(!armed(b))return;del('sources',b.dataset.id);closeModal();toast('소개처를 삭제했습니다');break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.doc!=null&&S.open){const c=S.cases.get(S.open);const docs=(c.docs||[]).map(d=>({...d}));const d=docs[+el.dataset.doc];d.st=el.value;d.at=today();
    const patch={docs};const all=docs.every(x=>x.st==='수령'||x.st==='해당없음');
    if(all&&n0(c.stage)===2){patch.stage=3;patch.dates={...(c.dates||{}),s3:(c.dates||{}).s3||today()};patch.stageAt=new Date().toISOString();patch.nextAction=SV(c).hints[3];toast(`서류를 모두 받아 3단계(${SV(c).stages[3]})로 넘겼습니다`)}
    upd('cases',c.id,patch);return}
  if(el.dataset.filter){const [g,k]=el.dataset.filter.split('.');S[g][k]=el.value;render();return}
  if(el.name==='m-svc'){toggleIntakeFields();return}
  const t=el.dataset.t;if(!t||!S.open)return;
  const k=el.dataset.k,type=el.dataset.type;let v;
  if(type==='multi')v=[...el.closest('.chips').querySelectorAll('input:checked')].map(x=>x.value);
  else if(type==='bool')v=el.checked;
  else if(type==='num')v=el.value===''?null:Number(el.value);
  else v=el.value.trim?el.value.trim():el.value;
  const c=S.cases.get(S.open);if(!c)return;
  if(t==='case'){const patch=nest(k,v);if(k==='fee.status'&&v==='청구'&&!(c.fee||{}).billedAt)patch.fee.billedAt=today();if(k==='fee.status'&&v==='입금완료'&&!(c.fee||{}).paidAt)patch.fee.paidAt=today();upd('cases',c.id,patch)}
  else if(t==='client'){const patch=nest(k,v);if(k==='consent'&&v&&!cli(c.clientId).consentAt)patch.consentAt=today();upd('clients',c.clientId,patch);
    if(k==='bizNo'&&digits(v)){const d=[...S.clients.values()].find(x=>x.id!==c.clientId&&digits(x.bizNo)===digits(v));if(d)toast(`이미 등록된 사업자번호입니다: ${d.name} (${src(d.sourceId).name})`,'bad')}}
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.filter&&el.tagName==='INPUT'){const [g,k]=el.dataset.filter.split('.');S[g][k]=el.value;render()}});
document.addEventListener('focusout',()=>{if(S.drawerDirty)setTimeout(()=>{if(S.drawerDirty)renderDrawer()},50)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal').innerHTML)closeModal();else if(S.open){S.open=null;S.pendingStop=null;renderDrawer()}}
  if(e.key==='Enter'&&e.target.id==='lg-text'){e.preventDefault();document.querySelector('[data-act="addLog"]').click()}});

/* ---------- modals ---------- */
function modal(title,body,foot){$('#modal').innerHTML=`<div class="modal"><div class="modal-c" role="dialog" aria-label="${esc(title)}"><div class="modal-h"><h2>${title}</h2><button class="x" data-act="modalClose" aria-label="닫기">×</button></div><div class="modal-b">${body}</div><div class="modal-f">${foot}</div></div></div>`;
  setTimeout(()=>$('#modal input, #modal select, #modal textarea')?.focus(),0)}
function closeModal(){$('#modal').innerHTML='';S.dupAck=null}
const mf=(k,label,type,opts,req,cls)=>{const id='m-'+k;let inp;
  if(type==='select')inp=`<select id="${id}">${typeof opts==='string'?opts:`<option value="">선택</option>${opts.map(o=>`<option>${esc(o)}</option>`).join('')}`}</select>`;
  else if(type==='area')inp=`<textarea id="${id}" rows="3"></textarea>`;
  else inp=`<input id="${id}" type="${type==='num'?'number':type}" ${type==='num'?'inputmode="decimal" step="any"':''}>`;
  return `<label class="fld ${type==='area'?'wide':''} ${cls||''}"><span>${label}${req?' <span class="req">*</span>':''}</span>${inp}</label>`};
function selectedSvcs(){return [...document.querySelectorAll('input[name="m-svc"]:checked')].map(x=>x.value)}
function toggleIntakeFields(){const s=selectedSvcs();document.querySelectorAll('#modal .only-pf').forEach(el=>el.hidden=!s.includes('정책자금'));document.querySelectorAll('#modal .only-other').forEach(el=>el.hidden=!s.some(x=>x!=='정책자금'))}

  modal('신규 접수',`${ai}
  <div class="fld"><span>업무 <span class="req">*</span> <span class="sub">여러 개를 고르면 업무마다 진행건이 따로 만들어집니다</span></span><div class="chips">${SVC_NAMES.map(n=>`<label><input type="checkbox" name="m-svc" value="${n}" ${n==='정책자금'?'checked':''}>${n}</label>`).join('')}</div></div>
  <div class="form">
    ${mf('sourceId','소개처','select',`<option value="">선택</option>${srcOptions('')}`,1)}${mf('sourceStaff','소개처 담당자','text')}
    ${mf('name','기업명','text',0,1)}${mf('bizNo','사업자등록번호','text')}${mf('ceo','대표자명','text')}${mf('phone','대표자 연락처','text')}
    ${mf('bizType','사업자 형태','select',['개인','법인'])}${mf('region','소재지(시/도)','select',REGIONS)}${mf('industry','업종','text')}${mf('foundedAt','개업일','date')}
    ${mf('wantAmount','정책자금 희망 금액 (만원)','num',0,0,'only-pf')}${mf('purpose','자금 용도','select',['운전','시설','운전+시설'],0,'only-pf')}${mf('timing','희망 시기','select',['즉시','1개월 내','3개월 내','미정'],0,'only-pf')}${mf('agency','희망 기관 (알면)','select',AGENCIES,0,'only-pf')}
    ${mf('contractAmount','다른 업무 계약 금액 (만원, 알면)','num',0,0,'only-other')}${mf('certType','인증 종류 (기업인증)','select',SERVICES['기업인증'].fields[0][3],0,'only-other')}
    ${mf('request','요청 내용·특이사항 (체납·연체 여부를 알면 적어 주세요)','area')}
    <label class="fld chk wide"><input type="checkbox" id="m-consent"> <span style="font-size:13px;color:var(--ink)">고객사로부터 정보 제공·상담 동의를 받았습니다 <span class="req">*</span></span></label>
  </div>`,`<span class="msg" id="m-msg"></span><button class="btn" data-act="modalClose">닫기</button><button class="btn pri" data-act="intakeSave">접수 등록</button>`);
  toggleIntakeFields();
}
async function aiFill(b){
  const text=$('#ai-text').value.trim();if(!text){$('#ai-text').focus();return}
  b.disabled=true;b.textContent='읽는 중…';
  const keys={services:`필요한 업무 배열, 다음 중에서: ${SVC_NAMES.join(',')}`,sourceStaff:'소개한 담당자 이름',name:'기업명',bizNo:'사업자등록번호 000-00-00000 형식',ceo:'대표자명',phone:'대표자 연락처',bizType:'"개인" 또는 "법인"',region:`시/도, 다음 중 하나: ${REGIONS.join(',')}`,industry:'업종',foundedAt:'개업일 YYYY-MM-DD',wantAmount:'정책자금 희망 금액을 만원 단위 숫자로 (예: 2억 → 20000)',purpose:'"운전","시설","운전+시설" 중 하나',agency:`희망 기관, 다음 중 하나: ${AGENCIES.join(',')}`,request:'그 밖의 요청·특이사항 요약 (체납, 연체 언급 포함)'};
  try{
    const v=await S.sample.json(`다음은 컨설팅 접수 내용입니다. 아래 키만 가진 JSON 객체 하나를 출력하세요. 내용에 없는 값은 빈 문자열(배열은 빈 배열)로 두고 추측하지 마세요.\n키 설명: ${JSON.stringify(keys)}\n\n접수 내용:\n${text}`,{modelTier:'quick'});
    let n=0;Object.keys(keys).forEach(k=>{if(k==='services')return;const el=$('#m-'+k);const val=v&&v[k];if(el&&val!==''&&val!=null){el.value=String(val);if(el.value!=='')n++}});
    if(v&&Array.isArray(v.services)&&v.services.length){document.querySelectorAll('input[name="m-svc"]').forEach(x=>x.checked=v.services.includes(x.value));toggleIntakeFields();n++}
    toast(n?`${n}개 항목을 채웠습니다. 확인 후 등록하세요`:'채울 수 있는 정보를 찾지 못했습니다');
  }catch(e){toast(e&&e.code==='not_granted'?'자동 채우기 권한이 없습니다':'자동 채우기에 실패했습니다','bad')}
  b.disabled=false;b.textContent='내용으로 채우기';
}
function saveIntake(){
  const g=k=>{const el=$('#m-'+k);return el?el.value.trim():''};const msg=$('#m-msg');const svcs=selectedSvcs();
  if(!svcs.length){msg.innerHTML='<span style="color:var(--bad)">업무를 하나 이상 고르세요.</span>';return}
  if(!g('sourceId')||!g('name')){msg.innerHTML='<span style="color:var(--bad)">소개처와 기업명은 꼭 입력하세요.</span>';return}
  if(!$('#m-consent').checked){msg.innerHTML='<span style="color:var(--bad)">고객사 동의 여부를 확인해 주세요.</span>';return}
  const biz=digits(g('bizNo'));const dup=biz?[...S.clients.values()].find(x=>digits(x.bizNo)===biz):null;
  if(dup&&S.dupAck!==dup.id){S.dupAck=dup.id;msg.innerHTML=`<span style="color:var(--bad)">이미 등록된 고객사입니다: ${esc(dup.name)} (${esc(src(dup.sourceId).name)}, ${esc(dup.receivedAt||'')}). 다시 누르면 기존 고객사에 새 진행건으로 추가하고, 수수료는 먼저 접수된 소개처에 귀속됩니다.</span>`;return}
  const extraFor=sv=>sv==='정책자금'?{agency:g('agency'),planAmount:g('wantAmount')?Number(g('wantAmount')):null}:{contractAmount:g('contractAmount')?Number(g('contractAmount')):null,...(sv==='기업인증'&&g('certType')?{certType:g('certType')}:{})};
  let clientId,sourceId=g('sourceId'),note=null;
  if(dup){clientId=dup.id;sourceId=dup.sourceId;note=[{at:new Date().toISOString(),type:'메모',text:`중복 접수: ${src(g('sourceId')).name}에서도 접수됨 (${today()})`}]}
  else{clientId=newId('c');const data={code:fmtCode('C',maxCode(S.clients,'C')+1),sourceId,sourceStaff:g('sourceStaff'),receivedAt:today(),name:g('name'),bizNo:g('bizNo'),ceo:g('ceo'),phone:g('phone'),bizType:g('bizType'),region:g('region'),industry:g('industry'),foundedAt:g('foundedAt'),wantAmount:g('wantAmount')?Number(g('wantAmount')):null,purpose:g('purpose'),timing:g('timing'),request:g('request'),consent:false,certs:[],intakeConsent:true};
    put('clients',clientId,data);S.clients.set(clientId,{id:clientId,...data})}
  const ids=svcs.map(sv=>createCase(clientId,sourceId,sv,{...extraFor(sv),...(note?{logs:note}:{})}));
  const nm=g('name');closeModal();toast(`${nm} · ${svcs.join(', ')} 접수를 등록했습니다`);setTimeout(()=>openCase(ids[0]),200);
}
const IMPORT_MAP={기업명:'name',상호:'name',업체명:'name',사업자등록번호:'bizNo',사업자번호:'bizNo',대표자명:'ceo',대표자:'ceo',대표자연락처:'phone',연락처:'phone',전화번호:'phone',휴대폰:'phone',사업자형태:'bizType',소재지:'region',지역:'region',소재지_시도:'region',업종:'industry',설립일:'foundedAt',개업일:'foundedAt',희망금액:'wantAmount',계약금액:'contractAmount',자금용도:'purpose',요청내용:'request',비고:'request',메모:'request',소개처담당자:'sourceStaff'};
let IMPORT_ROWS=[];
function openImport(){
  modal('일괄 등록',`<div class="notice info">소개처가 보낸 엑셀에서 <b>제목 행을 포함해</b> 복사한 뒤 붙여 넣으세요. 인식하는 제목: 기업명(상호), 사업자등록번호, 대표자명, 연락처, 사업자형태, 소재지, 업종, 개업일, 희망금액(만원), 계약금액(만원), 자금용도, 요청내용</div>
  <div class="form">${mf('isource','소개처','select',`<option value="">선택</option>${srcOptions('')}`,1)}${mf('isvc','업무','select',SVC_NAMES.map(n=>`<option>${n}</option>`).join(''),1)}</div>
  <textarea class="inp" id="imp-text" rows="8" placeholder="기업명	사업자등록번호	대표자명	연락처	..."></textarea>
  <label class="chk"><input type="checkbox" id="imp-consent"> <span style="font-size:13px">목록의 고객사들로부터 정보 제공 동의를 받았다는 소개처 확인을 받았습니다</span></label>
  <div id="imp-prev"></div>`,`<span class="msg" id="m-msg"></span><button class="btn" data-act="importPreview">미리 보기</button><button class="btn pri" data-act="importRun" id="imp-run" disabled>가져오기</button>`);
}
function parseRows(text){const lines=text.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)return [];const sep=lines[0].includes('\t')?'\t':',';
  const heads=lines[0].split(sep).map(h=>IMPORT_MAP[h.replace(/\s|\(.*?\)/g,'')]||null);
  return lines.slice(1).map(l=>{const cells=l.split(sep);const r={};heads.forEach((h,i)=>{if(h&&cells[i]!=null&&cells[i].trim()!=='')r[h]=cells[i].trim()});return r}).filter(r=>r.name)}
function importPreview(){
  IMPORT_ROWS=parseRows($('#imp-text').value);
  const exist=new Set([...S.clients.values()].map(x=>digits(x.bizNo)).filter(Boolean));
  IMPORT_ROWS.forEach(r=>r._dup=!!(digits(r.bizNo)&&exist.has(digits(r.bizNo))));
  const ok=IMPORT_ROWS.filter(r=>!r._dup).length;
  $('#imp-prev').innerHTML=IMPORT_ROWS.length?`<div class="tbl-wrap"><table><thead><tr><th>기업명</th><th>사업자번호</th><th>대표자</th><th>소재지</th><th class="r">금액(만원)</th><th></th></tr></thead><tbody>${IMPORT_ROWS.map(r=>`<tr><td>${esc(r.name)}</td><td class="num">${esc(r.bizNo||'')}</td><td>${esc(r.ceo||'')}</td><td>${esc(r.region||'')}</td><td class="r num">${esc(r.wantAmount||r.contractAmount||'')}</td><td>${r._dup?'<span class="pill st-반려">중복 · 건너뜀</span>':'<span class="pill st-완료">신규</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="notice">인식된 행이 없습니다. 제목 행에 "기업명"이 있는지 확인하세요.</div>';
  $('#imp-run').disabled=!ok;$('#imp-run').textContent=`${ok}건 가져오기`;
}
function importRun(){
  const sid=$('#m-isource').value,sv=$('#m-isvc').value,msg=$('#m-msg');
  if(!sid){msg.innerHTML='<span style="color:var(--bad)">소개처를 선택하세요.</span>';return}
  if(!$('#imp-consent').checked){msg.innerHTML='<span style="color:var(--bad)">동의 확인에 체크해 주세요.</span>';return}
  let n=0,cMax=maxCode(S.clients,'C'),pMax=maxCode(S.cases,'P');
  IMPORT_ROWS.filter(r=>!r._dup).forEach(r=>{
    const cid=newId('c'),amt=r.wantAmount?Number(digits(r.wantAmount))||null:null,camt=r.contractAmount?Number(digits(r.contractAmount))||null:null;
    const bt=/법인/.test(r.bizType||'')?'법인':/개인/.test(r.bizType||'')?'개인':'';
    const reg=REGIONS.find(x=>(r.region||'').startsWith(x))||'';
    const data={code:fmtCode('C',++cMax),sourceId:sid,receivedAt:today(),name:r.name,bizNo:r.bizNo||'',ceo:r.ceo||'',phone:r.phone||'',bizType:bt,region:reg,city:'',industry:r.industry||'',foundedAt:r.foundedAt||'',wantAmount:amt,purpose:r.purpose||'',request:r.request||'',sourceStaff:r.sourceStaff||'',consent:false,certs:[],intakeConsent:true};
    put('clients',cid,data);S.clients.set(cid,{id:cid,...data});
    createCase(cid,sid,sv,sv==='정책자금'?{planAmount:amt}:{contractAmount:camt},fmtCode('P',++pMax));n++;});
  closeModal();toast(`${n}건을 등록했습니다`);
}
function openSource(id){
  const s=id?S.sources.get(id):{};const used=id&&casesArr().some(c=>c.sourceId===id);
  modal(id?'소개처 수정':'소개처 추가',`<div class="form">${SOURCE_FIELDS.map(([k,l,t,o])=>mf(k,l,t,o,k==='name')).join('')}</div>`,
    `<span class="msg" id="m-msg"></span>${id&&!used?`<button class="btn danger" data-act="sourceDel" data-id="${id}">삭제</button>`:''}<button class="btn" data-act="modalClose">닫기</button><button class="btn pri" data-act="sourceSave" data-id="${id||''}">저장</button>`);
  SOURCE_FIELDS.forEach(([k])=>{const el=$('#m-'+k);if(el&&s[k]!=null)el.value=s[k]});
}
function saveSource(){
  const id=document.querySelector('[data-act="sourceSave"]').dataset.id;const d={};
  SOURCE_FIELDS.forEach(([k,,t])=>{const v=$('#m-'+k).value.trim();d[k]=t==='num'?(v===''?null:Number(v)):v});
  if(!d.name){$('#m-msg').innerHTML='<span style="color:var(--bad)">소개처명을 입력하세요.</span>';return}
  if(id)upd('sources',id,d);else put('sources',newId('s'),{...d,order:S.sources.size});
  closeModal();toast('저장했습니다');
}

init();
</script>
