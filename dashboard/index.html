<meta charset="utf-8">
<title>BRIDGE NODE 오피스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 432 432'%3E%3Cpath fill='%23FF4410' d='M0 123h51v185H0zM380 123h51v185h-51zM51 220Q215 160 380 220v40Q215 200 51 260z'/%3E%3C/svg%3E">
<style>
/* Layout: 헤더 → 오늘 요약 4칸 → 대표 결정 대기 → 프로젝트 진행(단계 표시) → 대표 지시 → 직원 노드 → 업무 파이프라인 → 활동 로그 */
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#13202C; --muted:#5D6B78; --line:#D7DDE3;
  --accent:#C2360B; --accent-soft:#FDE8DF; --brand:#FF4410;
  --ok:#1F7A4D; --ok-soft:#E1F2E8; --warn:#9A5B00; --warn-soft:#FBEFD9; --busy:#2448C9; --busy-soft:#E3E9FB; --idle:#6B7783; --idle-soft:#ECEFF2;
  --f-display:"Space Grotesk","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F161D; --panel:#17212B; --ink:#E6ECF2; --muted:#93A1AE; --line:#263443;
  --accent:#FF7F52; --accent-soft:#3A1E14;
  --ok:#6FD39C; --ok-soft:#173326; --warn:#F2B65A; --warn-soft:#3A2A12; --busy:#7D9BFF; --busy-soft:#1E2A4A; --idle:#8D99A5; --idle-soft:#1F2A35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161D; --panel:#17212B; --ink:#E6ECF2; --muted:#93A1AE; --line:#263443;
  --accent:#FF7F52; --accent-soft:#3A1E14;
  --ok:#6FD39C; --ok-soft:#173326; --warn:#F2B65A; --warn-soft:#3A2A12; --busy:#7D9BFF; --busy-soft:#1E2A4A; --idle:#8D99A5; --idle-soft:#1F2A35; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{flex:none}
h1{font-family:var(--f-display);font-size:22px;letter-spacing:.18em;margin:0;line-height:1.1}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.sync{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-family:var(--f-display);display:flex;align-items:center;gap:8px}
h2 .n{font-family:var(--f-mono);font-weight:500;letter-spacing:0;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid transparent}
.btn{background:var(--accent);color:var(--panel);padding:10px 16px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
/* 요약 */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi.attn{border-color:var(--warn)}
.kpi.attn .v{color:var(--warn)}
/* 결정 대기 */
.decisions{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.dec{padding:12px 14px;display:flex;flex-direction:column;gap:6px;border-left:0;min-width:0}
.dec .q{font-weight:600;overflow-wrap:anywhere}
.dec .w{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.dec .rec{font-size:12.5px;background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:4px 8px;overflow-wrap:anywhere}
.dec.closed{opacity:.7}
/* 프로젝트 */
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
@media (max-width:400px){.projects{grid-template-columns:1fr}}
.proj{padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.proj-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.proj-h b{font-size:15px;overflow-wrap:anywhere}
.proj .s{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;list-style:none;margin:0;padding:0}
.steps li{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted);min-width:0}
.steps li::before{content:"";height:6px;border-radius:3px;background:var(--line)}
.steps li.done::before{background:var(--ok)}
.steps li.now::before{background:var(--accent)}
.steps li.now{color:var(--ink);font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px}
.links a{overflow-wrap:anywhere}
.next{font-size:12.5px;overflow-wrap:anywhere}
.next b{font-weight:600}
/* 지시창 */
.order{padding:16px;display:flex;flex-direction:column;gap:10px;border-color:var(--accent)}
.order-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.order-head h2{margin:0}
.order-row{display:flex;gap:10px;align-items:stretch}
.order-row2{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.order textarea,.order select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.order textarea{flex:1;resize:vertical;min-height:52px;font-size:15px}
.mic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:96px;padding:8px 12px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);font-weight:600;font-size:12.5px}
.mic[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.mic:disabled{opacity:.5;cursor:default}
.mic[hidden]{display:none}
.partial{margin:0;min-height:1.2em;color:var(--muted);font-style:italic;font-size:13px;overflow-wrap:anywhere}
.hint{color:var(--muted);font-size:12px;margin:0}
@media (max-width:520px){.order-row{flex-direction:column}.mic{flex-direction:row;min-height:48px}.order-row2 select{flex:1}}
@media (prefers-reduced-motion:no-preference){.mic[aria-pressed="true"] svg{animation:pulse 1.2s ease-in-out infinite}}
/* 직원 */
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media (max-width:360px){.staff{grid-template-columns:1fr}}
.node{padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.node-top{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent);flex:none}
.who{min-width:0}
.who b{display:block;font-size:14px}
.who span{display:block;color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;width:max-content;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-idle{color:var(--idle);background:var(--idle-soft)}
.s-busy{color:var(--busy);background:var(--busy-soft)}
.s-review{color:var(--warn);background:var(--warn-soft)}
.s-done{color:var(--ok);background:var(--ok-soft)}
.cur{font-size:13px;overflow-wrap:anywhere}
.cur.none{color:var(--muted)}
/* 파이프라인 */
.board-scroll{overflow-x:auto;padding-bottom:4px}
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;min-width:1040px}
.col{padding:10px;display:flex;flex-direction:column;gap:8px;border:1px dashed var(--line);border-radius:10px;min-height:120px}
.col-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px;padding:2px 4px}
.count{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.card{padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .t{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.card .d{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.tag{background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:1px 7px;font-weight:600}
.ptag{border:1px solid var(--line);border-radius:5px;padding:0 6px}
.out{font-family:var(--f-mono);font-size:11.5px;background:var(--bg);border-radius:5px;padding:4px 6px;overflow-wrap:anywhere}
.approve{background:var(--ok);color:var(--panel);padding:6px 10px;font-weight:600;font-size:12.5px;align-self:flex-start}
.empty{color:var(--muted);font-size:12.5px;padding:6px 4px}
.more{background:none;border:0;color:var(--accent);font-size:12.5px;padding:2px 4px;align-self:flex-start}
/* 로그 */
.log{padding:6px 14px}
.log ol{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:52px 90px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.log li:last-child{border-bottom:0}
.log time{font-family:var(--f-mono);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.log .lw{font-weight:600}
.log .lt{min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.log li{grid-template-columns:44px 1fr}.log .lt{grid-column:1/-1}}
.notice{font-size:12.5px;color:var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:8px}
.notice.err{color:var(--ink);background:var(--panel);border:1px solid var(--warn)}
.log li.blank{display:block}
.board-scroll:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.muted{color:var(--muted);font-size:12.5px}
.dec-form{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.dec-form input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.dec-btns{display:flex;gap:6px;flex-wrap:wrap}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.ghost{background:var(--panel);color:var(--accent);border:1px solid var(--accent)}
.relay{display:flex;flex-wrap:wrap;gap:4px;align-items:center;list-style:none;margin:0;padding:0;font-size:12px}
.relay li{display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.relay li.done{color:var(--ok);border-color:var(--ok)}
.relay li.doing{color:var(--panel);background:var(--accent);border-color:var(--accent);font-weight:600}
.relay li.back{color:var(--warn);border-color:var(--warn)}
.relay .arr{border:0;padding:0;color:var(--muted)}
.wait{background:var(--warn-soft);color:var(--warn);border-radius:5px;padding:1px 7px;font-weight:600}

@media (prefers-reduced-motion:no-preference){.pill.s-busy::before{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.3}}
</style>

<div class="wrap" id="wrap">
  <div class="notice" id="offline" hidden></div>
  <div class="notice err" id="errbox" role="alert" hidden></div>
  <header>
    <div class="brand">
      <svg width="56" height="24" viewBox="0 0 432 185" aria-hidden="true"><path fill="var(--brand)" d="M0 0h51v185H0zM380 0h51v185h-51zM51 97Q215 37 380 97v40Q215 77 51 137z"/></svg>
      <div><h1>BRIDGENODE</h1><p class="sub">대표 1명 · AI 직원 7명 · 회사 전체 현황</p></div>
    </div>
    <div class="sync" id="sync">연결 중…</div>
  </header>

  <section aria-label="대표 지시">
    <form class="panel order" id="orderForm">
      <div class="order-head"><h2 id="orderH">대표 지시</h2><span class="muted" id="voiceHint">말로 하셔도 되고, 직접 쓰셔도 돼요.</span></div>
      <div class="order-row">
        <button type="button" class="mic" id="micBtn" aria-labelledby="micLabel" hidden><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.59a6 6 0 0 0 5-5.91Z"/></svg><span id="micLabel">말로 지시하기</span></button>
        <textarea id="orderText" rows="2" placeholder="예) Stay B 정보 카드에 은행 계좌 개설 순서 추가해줘" maxlength="500" aria-labelledby="orderH"></textarea>
      </div>
      <p class="partial" id="partial" aria-live="polite"></p>
      <div class="order-row2">
        <select id="orderWho" aria-label="담당 직원"><option value="">담당: 실장이 배정</option></select>
        <button class="btn" id="orderBtn" type="submit">지시 등록</button>
      </div>
      <p class="hint">등록한 지시는 아래 '업무 파이프라인'의 '지시' 칸에 쌓여요. 채팅방에서 "지시함 처리해"라고 하시면 실장(Claude)이 직원에게 배정해 진행합니다.</p>
    </form>
  </section>

  <section aria-label="오늘 요약">
    <div class="kpis">
      <div class="panel kpi" id="k-approval"><span class="v">–</span><span class="l">대표 승인 대기</span></div>
      <div class="panel kpi" id="k-decision"><span class="v">–</span><span class="l">대표 결정 대기</span></div>
      <div class="panel kpi" id="k-doing"><span class="v">–</span><span class="l">진행·검토 중 업무</span></div>
      <div class="panel kpi" id="k-done"><span class="v">–</span><span class="l">오늘 완료</span></div>
    </div>
  </section>

  <section>
    <h2>대표 결정 대기 <span class="n" id="decN"></span></h2>
    <div class="decisions" id="decisions"><p class="muted">결정할 일이 생기면 실장이 여기에 올립니다.</p></div>
  </section>

  <section>
    <h2>프로젝트 진행</h2>
    <div class="projects" id="projects"><p class="muted">프로젝트를 불러오는 중이에요.</p></div>
  </section>


  <section>
    <h2>직원 현황</h2>
    <div class="staff" id="staff"></div>
  </section>

  <section>
    <h2>업무 파이프라인</h2>
    <div class="board-scroll" tabindex="0" role="region" aria-label="업무 파이프라인, 좌우로 스크롤"><div class="board" id="board"></div></div>
  </section>

  <section>
    <h2>오늘 활동 로그</h2>
    <div class="panel log"><ol id="log"></ol></div>
  </section>
</div>

<script>
const STAFF_DEFAULT=[
  {id:"secretary",name:"비서",role:"일정·메일·브리핑",ini:"SE"},
  {id:"planner",name:"홈페이지 기획자",role:"기획·구성안·카피",ini:"PL"},
  {id:"designer",name:"웹디자이너",role:"시각 방향·디자인 명세",ini:"DS"},
  {id:"coder",name:"웹코더",role:"구현·반응형·테스트",ini:"CD"},
  {id:"reviewer",name:"검토자",role:"품질·사실·코드 검토",ini:"QA"},
  {id:"marketer",name:"온라인 마케터",role:"고객 관점·홍보 계획",ini:"MK"},
  {id:"editor",name:"영상 편집자",role:"편집·자막·업로드안",ini:"VE"}
];
const LEGACY={builder:"제작자(이전)"};
const STAGES=[["todo","지시"],["doing","진행 중"],["review","검토"],["approval","대표 승인 대기"],["done","완료"]];
const PSTEPS=["기획","제작","검토","대표 승인","공개"];
const STATUS={idle:["대기","s-idle"],busy:["작업 중","s-busy"],review:["검토 대기","s-review"],done:["완료 보고","s-done"]};
let staff={},tasks=[],logEntries=[],projects=[],decisions=[],db=null,showAllDone=false;
const loaded={staff:false,tasks:false,projects:false,decisions:false};
let offline=false;
const waitText=()=>offline?"오프라인이라 불러올 수 없어요.":"불러오는 중이에요…";
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const nameOf=id=>(STAFF_DEFAULT.find(s=>s.id===id)?.name)||LEGACY[id]||(staff[id]?.name)||"미배정";
const kday=d=>{const k=new Date(d.getTime()+9*3600e3);return k.toISOString().slice(0,10)};
const today=()=>kday(new Date());
const hm=iso=>{const d=new Date(iso);if(isNaN(d))return"";const k=new Date(d.getTime()+9*3600e3);return String(k.getUTCHours()).padStart(2,"0")+":"+String(k.getUTCMinutes()).padStart(2,"0")};
const stamp=iso=>{const d=new Date(iso);if(isNaN(d))return"";const k=new Date(d.getTime()+9*3600e3);return (kday(d)===today()?"오늘 ":(k.getUTCMonth()+1)+"/"+k.getUTCDate()+" ")+hm(iso)};
const projName=id=>(projects.find(p=>p._id===id)?.name)||"";
const safeUrl=u=>/^https:\/\//.test(u||"")?u:null;

STAFF_DEFAULT.forEach(s=>{const o=el("option",null,s.name);o.value=s.id;$("orderWho").appendChild(o)});

function setKpi(id,v,attn){const k=$(id);k.querySelector(".v").textContent=String(v);k.classList.toggle("attn",!!attn&&typeof v==="number"&&v>0)}
function renderKpis(){
  if(!loaded.tasks||!loaded.decisions){["k-approval","k-decision","k-doing","k-done"].forEach(id=>setKpi(id,"–"));return}
  setKpi("k-approval",tasks.filter(t=>t.stage==="approval").length,true);
  setKpi("k-decision",decisions.filter(d=>d.status!=="decided").length,true);
  setKpi("k-doing",tasks.filter(t=>t.stage==="doing"||t.stage==="review").length);
  setKpi("k-done",tasks.filter(t=>t.stage==="done"&&kday(new Date(t.approvedAt||t.updatedAt||0))===today()).length);
}
function renderDecisions(){
  const box=$("decisions");box.replaceChildren();
  if(!loaded.decisions){$("decN").textContent="";box.append(el("p","muted",waitText()));return}
  const open=decisions.filter(d=>d.status!=="decided");
  $("decN").textContent=open.length?String(open.length):"";
  if(!open.length){box.append(el("p","muted","지금 대표님이 결정할 일은 없어요."));return}
  open.sort((a,b)=>(a.order??99)-(b.order??99)).forEach(d=>{
    const c=el("article","panel dec");
    c.append(el("div","q",d.question||""));
    if(d.why)c.append(el("div","w",d.why));
    if(d.recommend)c.append(el("div","rec","추천: "+d.recommend));
    const m=el("div","meta");if(d.project)m.append(el("span","ptag",projName(d.project)||d.project));c.append(m);
    if(db){
      const f=el("form","dec-form");
      const inp=el("input");inp.type="text";inp.maxLength=300;inp.placeholder="직접 답하기 (예: 무료로 해)";inp.setAttribute("aria-label","답변: "+(d.question||""));
      const row=el("div","dec-btns");
      const save=el("button","btn sm","답변 저장");save.type="submit";
      row.append(save);
      if(d.recommend){const ok=el("button","btn sm ghost","추천대로");ok.type="button";ok.onclick=()=>decide(d,"추천대로: "+d.recommend,[ok,save]);row.prepend(ok)}
      f.append(inp,row);
      f.onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v){inp.focus();return}decide(d,v,[save])};
      c.append(f);
    }
    box.append(c);
  });
}
function renderProjects(){
  const box=$("projects");box.replaceChildren();
  if(!loaded.projects){box.append(el("p","muted",waitText()));return}
  if(!projects.length){box.append(el("p","muted","진행 중인 프로젝트가 아직 없어요."));return}
  [...projects].sort((a,b)=>(a.order??99)-(b.order??99)).forEach(p=>{
    const c=el("article","panel proj");
    const h=el("div","proj-h");const nm=el("div");nm.append(el("b",null,p.name||p._id));
    h.append(nm);
    const doneAll=(p.step??0)>=PSTEPS.length;
    h.append(el("span","pill "+(doneAll?"s-done":p.blocked?"s-review":"s-busy"),doneAll?"완료":(p.blocked?"대표 확인 필요":"진행 중")));
    c.append(h);
    if(p.summary)c.append(el("div","s",p.summary));
    const ol=el("ol","steps");ol.setAttribute("aria-label","진행 단계");
    PSTEPS.forEach((s,i)=>{const li=el("li",i<(p.step??0)?"done":(i===(p.step??0)?"now":""),s);if(i===(p.step??0))li.setAttribute("aria-current","step");ol.append(li)});
    c.append(ol);
    if(Array.isArray(p.relay)&&p.relay.length){
      const r=el("ol","relay");r.setAttribute("aria-label","담당자 릴레이");
      p.relay.forEach((x,i)=>{if(i)r.append(el("li","arr","→"));const li=el("li",x.status||"todo",(x.label||nameOf(x.who))+(x.status==="done"?" ✓":x.status==="back"?" ↺":""));if(x.status==="doing")li.setAttribute("aria-current","step");r.append(li)});
      c.append(r);
    }
    if(p.next){const n=el("div","next");n.append(el("b",null,"다음: "),document.createTextNode(p.next));c.append(n)}
    const open=tasks.filter(t=>t.project===p._id&&t.stage!=="done");
    if(open.length){const m=el("div","meta");open.forEach(t=>m.append(el("span","tag",nameOf(t.assignee)+" · "+(STAGES.find(s=>s[0]===t.stage)?.[1]||""))));c.append(m)}
    if(Array.isArray(p.links)&&p.links.length){
      const l=el("div","links");
      p.links.forEach(x=>{const u=safeUrl(x.url);if(u){const a=el("a",null,x.label||u);a.href=u;a.target="_blank";a.rel="noopener";l.append(a)}else if(x.label){l.append(el("span","muted",x.label+(x.url?" · "+x.url:"")))}});
      c.append(l);
    }
    if(p.updatedAt)c.append(el("div","meta","업데이트 "+stamp(p.updatedAt)));
    box.append(c);
  });
}
function renderStaff(){
  const box=$("staff");box.replaceChildren();
  STAFF_DEFAULT.forEach(def=>{
    const s=Object.assign({},def,staff[def.id]||{});
    const st=loaded.staff?(STATUS[s.status]||STATUS.idle):[offline?"알 수 없음":"확인 중","s-idle"];
    if(!loaded.staff)s.current="";
    const n=el("article","panel node");
    const top=el("div","node-top");top.append(el("div","av",def.ini));
    const who=el("div","who");who.append(el("b",null,s.name),el("span",null,s.role));top.append(who);
    n.append(top,el("span","pill "+st[1],st[0]),el("div","cur"+(s.current?"":" none"),s.current||(loaded.staff?"배정된 업무 없음":waitText())));
    if(loaded.staff&&s.updatedAt)n.append(el("div","meta","업데이트 "+stamp(s.updatedAt)));
    box.append(n);
  });
}
function renderBoard(){
  const b=$("board");b.replaceChildren();
  STAGES.forEach(([key,label])=>{
    let list=tasks.filter(t=>(t.stage||"todo")===key);
    const total=list.length;
    if(key==="done"&&!showAllDone)list=list.slice(0,6);
    const col=el("div","col");
    const h=el("div","col-h");h.append(el("span",null,label),el("span","count",String(total)));col.append(h);
    if(!total)col.append(el("div","empty",!loaded.tasks?waitText():(key==="todo"?"새 지시가 여기에 쌓여요":"비어 있음")));
    list.forEach(t=>{
      const c=el("div","panel card");
      c.append(el("div","t",t.title||"(제목 없음)"));
      if(t.detail)c.append(el("div","d",t.detail));
      const m=el("div","meta");m.append(el("span","tag",nameOf(t.assignee)));
      if(key==="todo"&&t.source==="dashboard"&&!t.assignee)m.append(el("span","wait","실장 확인 대기"));
      if(t.project&&projName(t.project))m.append(el("span","ptag",projName(t.project)));
      if(t.updatedAt)m.append(el("span",null,stamp(t.updatedAt)));
      c.append(m);
      if(t.output){const u=safeUrl(t.output.split(" ")[0]);if(u){const a=el("a","out",t.output);a.href=u;a.target="_blank";a.rel="noopener";c.append(a)}else c.append(el("div","out",t.output))}
      if(key==="approval"&&db){
        const a=el("button","approve","승인하고 완료");a.type="button";
        a.onclick=async()=>{a.disabled=true;const now=new Date().toISOString();try{await db.doc("tasks/"+t._id).update({stage:"done",approvedAt:now,updatedAt:now});addLog("대표","승인: "+t.title)}catch(e){a.disabled=false;showError("승인을 저장하지 못했어요. 잠시 후 다시 눌러 주세요.")}};
        c.append(a);
      }
      col.append(c);
    });
    if(key==="done"&&total>6){const mb=el("button","more",showAllDone?"최근 6건만 보기":"전체 "+total+"건 보기");mb.type="button";mb.onclick=()=>{showAllDone=!showAllDone;renderBoard()};col.append(mb)}
    b.append(col);
  });
}
function renderLog(){
  const ol=$("log");ol.replaceChildren();
  const items=[...logEntries].sort((a,b)=>(b.t||"").localeCompare(a.t||"")).slice(0,40);
  if(!items.length){const li=el("li","blank muted",(db&&!offline)?"아직 기록이 없어요.":waitText());ol.append(li);return}
  items.forEach(x=>{const li=el("li");li.append(el("time",null,hm(x.t)),el("span","lw",x.who||""),el("span","lt",x.text||""));ol.append(li)});
}
function renderAll(){renderKpis();renderDecisions();renderProjects();renderStaff();renderBoard()}
function showOffline(msg){const n=$("offline");n.textContent=msg;n.hidden=false}
let errTimer=null;
function showError(msg){const n=$("errbox");n.textContent=msg;n.hidden=false;clearTimeout(errTimer);errTimer=setTimeout(()=>{n.hidden=true},8000)}
async function decide(d,answer,btns){
  if(!db)return;btns.forEach(b=>b.disabled=true);
  try{await db.doc("decisions/"+d._id).update({status:"decided",answer,decidedAt:new Date().toISOString()});addLog("대표","결정: "+(d.question||"")+" → "+answer)}
  catch(e){btns.forEach(b=>b.disabled=false);showError("결정을 저장하지 못했어요. 잠시 후 다시 눌러 주세요.")}
}
async function addLog(who,text){
  if(!db)return;
  const ref=db.doc("log/"+today());
  try{const s=await ref.get();const entries=(s.exists&&Array.isArray(s.data().entries))?[...s.data().entries]:[];entries.push({t:new Date().toISOString(),who,text});await ref.set({entries:entries.slice(-300)})}catch(e){}
}
renderAll();renderLog();

$("orderForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const text=$("orderText").value.trim();if(!text)return;
  if(!db){showError("현황판 저장소에 연결되지 않아 지시를 저장할 수 없어요. 채팅방에 직접 지시해 주세요.");return}
  $("orderBtn").disabled=true;const now=new Date().toISOString();
  try{await db.collection("tasks").add({title:text,detail:"",assignee:$("orderWho").value||"",stage:"todo",source:"dashboard",createdAt:now,updatedAt:now});$("orderText").value="";addLog("대표","지시 등록: "+text)}
  catch(err){showError("지시를 저장하지 못했어요. 잠시 후 다시 시도해 주세요.")}
  finally{$("orderBtn").disabled=false}
});

$("orderText").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();$("orderForm").requestSubmit()}});

/* 음성 지시: 마이크 버튼 → 받아쓰기 → 입력칸에 채움 → 대표가 확인 후 등록 */
(async()=>{
  const d=await (window.claude?.use?.("dictation")??Promise.resolve(null));
  const btn=$("micBtn"),lab=$("micLabel"),part=$("partial"),ta=$("orderText");
  if(!d){$("voiceHint").textContent="이 화면에서는 음성 입력을 쓸 수 없어요. Chrome·Edge나 Claude 데스크톱 앱에서 열면 말로 지시할 수 있어요.";return}
  btn.hidden=false;
  const LABEL={idle:"말로 지시하기",starting:"준비 중…",listening:"듣는 중 · 누르면 끝",finishing:"정리 중…"};
  d.onState(({state,reason})=>{
    lab.textContent=LABEL[state]||LABEL.idle;
    btn.setAttribute("aria-pressed",state==="listening"?"true":"false");
    btn.disabled=state==="starting"||state==="finishing";
    if(state==="idle"){
      part.textContent="";
      if(reason==="unavailable"||reason==="not_granted"){btn.hidden=true;$("voiceHint").textContent=reason==="not_granted"?"음성 입력이 꺼져 있어요. 이 페이지의 권한 메뉴에서 켤 수 있어요.":"이 계정이나 언어에서는 음성 입력을 쓸 수 없어요.";}
      else if(reason==="rate_limited")showError("음성 입력 요청이 많아요. 잠시 후 다시 눌러 주세요.");
      else if(reason==="upstream_error")showError("마이크나 음성 인식에 문제가 생겼어요. 다시 눌러 주세요.");
      if(ta.value.trim()){$("voiceHint").textContent="받아쓴 내용을 확인하고 '지시 등록'을 눌러 주세요.";$("orderBtn").focus()}
    }
  });
  d.onPartial(({text})=>{part.textContent=text?("듣는 중: "+text):""});
  d.onFinal(({text})=>{ta.value=(ta.value+text).replace(/^\s+/,"");});
  btn.addEventListener("click",()=>{
    if(d.active()){d.stop().catch(()=>{});return}
    d.start().catch(e=>{
      if(e&&e.code==="dismissed")$("voiceHint").textContent="마이크 사용을 허용해야 말로 지시할 수 있어요.";
      else if(e&&e.code==="not_granted"){btn.hidden=true;$("voiceHint").textContent="음성 입력이 꺼져 있어요. 이 페이지의 권한 메뉴에서 켤 수 있어요."}
      else if(e&&e.code!=="stopped")showError("음성 입력을 시작하지 못했어요. 다시 눌러 주세요.");
    });
  });
})();

(async()=>{
  db=await (window.claude?.use?.("db")??Promise.resolve(null));
  if(!db){offline=true;$("sync").textContent="오프라인 보기";showOffline("이 보기에서는 실시간 현황을 불러올 수 없어요. claude.ai에 로그인한 상태로 열어 주세요.");renderAll();renderLog();return}
  renderBoard();
  let timer=setTimeout(()=>{$("sync").textContent="응답 대기 중 · 내용이 최신이 아닐 수 있어요"},10000);
  const live=snap=>{if(!snap.metadata.fromCache){clearTimeout(timer);$("sync").textContent="실시간 연결됨 · "+hm(new Date().toISOString())}};
  const fail=()=>{clearTimeout(timer);offline=true;$("sync").textContent="연결 끊김 · 새로고침해 주세요";showOffline("실시간 연결이 끊겼어요. 새로고침하면 다시 연결됩니다.");renderAll();renderLog()};
  db.collection("staff").onSnapshot(s=>{loaded.staff=true;staff={};s.docs.forEach(d=>staff[d.id]=d.data());renderAll();live(s)},fail);
  db.collection("tasks").orderBy("updatedAt","desc").limit(300).onSnapshot(s=>{loaded.tasks=true;tasks=s.docs.map(d=>Object.assign({_id:d.id},d.data()));renderAll();live(s)},fail);
  db.collection("projects").onSnapshot(s=>{loaded.projects=true;projects=s.docs.map(d=>Object.assign({_id:d.id},d.data()));renderAll();live(s)},fail);
  db.collection("decisions").onSnapshot(s=>{loaded.decisions=true;decisions=s.docs.map(d=>Object.assign({_id:d.id},d.data()));renderAll();live(s)},fail);
  db.doc("log/"+today()).onSnapshot(d=>{logEntries=(d.exists&&Array.isArray(d.data().entries))?d.data().entries:[];renderLog()},fail);
})();
</script>
