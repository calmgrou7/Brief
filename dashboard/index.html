<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브릿지노드 총괄 대시보드</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --border:#e2e5ea;
  --text:#191f28; --text-2:#4e5968; --text-3:#8b95a1;
  --accent:#3182f6; --accent-soft:#e8f3ff;
  --ok:#0f9d58; --ok-soft:#e6f6ee; --warn:#d97706; --warn-soft:#fff4e0;
  --bad:#e5484d; --bad-soft:#fdecec; --info:#6e56cf; --info-soft:#f0edfb;
  --mini:#00a3a3; --web:#6e56cf; --toss:#3182f6;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101318; --surface:#181c23; --surface-2:#20252e; --border:#2b313b;
    --text:#eef1f5; --text-2:#b0b8c4; --text-3:#7d8794;
    --accent:#4c94ff; --accent-soft:#1a2a44;
    --ok:#34c27a; --ok-soft:#14301f; --warn:#f0a83a; --warn-soft:#3a2a10;
    --bad:#ff6b70; --bad-soft:#3a1719; --info:#9d8cf0; --info-soft:#26203f;
    --mini:#2cc7c7; --web:#9d8cf0; --toss:#4c94ff;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#181c23; --surface-2:#20252e; --border:#2b313b;
  --text:#eef1f5; --text-2:#b0b8c4; --text-3:#7d8794;
  --accent:#4c94ff; --accent-soft:#1a2a44;
  --ok:#34c27a; --ok-soft:#14301f; --warn:#f0a83a; --warn-soft:#3a2a10;
  --bad:#ff6b70; --bad-soft:#3a1719; --info:#9d8cf0; --info-soft:#26203f;
  --mini:#2cc7c7; --web:#9d8cf0; --toss:#4c94ff;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.hdr{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--info));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.brand b{display:block;font-size:16px;letter-spacing:-.2px}
.brand small{color:var(--text-3);font-size:12px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:10px;color:var(--text-2);cursor:pointer;white-space:nowrap;font-weight:600}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
main{padding:20px 0 60px}
section[hidden]{display:none}
h2{font-size:18px;margin:0 0 12px;letter-spacing:-.3px}
h3{font-size:15px;margin:0 0 10px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:960px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
@media (max-width:640px){.g4,.g2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--text-3)}
.sub{color:var(--text-2)}
.big{font-size:28px;font-weight:800;letter-spacing:-.5px}
.mt{margin-top:16px}.mt-s{margin-top:8px}
.btn{border:1px solid var(--border);background:var(--surface);padding:7px 12px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--text-3);padding:4px 6px;border-radius:6px}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-info{background:var(--info-soft);color:var(--info)}
.b-acc{background:var(--accent-soft);color:var(--accent)}
.b-mute{background:var(--surface-2);color:var(--text-2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.ring{--p:0;--c:var(--accent);width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring>div{width:104px;height:104px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.ring b{font-size:28px;letter-spacing:-.5px;display:block;line-height:1}
.ring small{color:var(--text-3);font-size:11px}
.track-head{display:flex;align-items:center;gap:8px;font-weight:700}
.stat-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--border)}
.list li:first-child{border-top:0}
.list .when{margin-left:auto;text-align:right;white-space:nowrap;font-size:12px}
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--text-3);font-weight:600;font-size:12px;padding:8px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
.nowrap{white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.pipe{display:flex;gap:3px;min-width:150px}
.pipe span{flex:1;height:6px;border-radius:3px;background:var(--surface-2)}
.pipe span.on{background:var(--accent)}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stage{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--text-2);font-weight:600}
.stage.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.stage.on::before{content:"✓ "}
.proj-card .top{display:flex;gap:10px;align-items:flex-start}
.proj-card .ttl{font-weight:800;font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-top:10px}
.kv dt{color:var(--text-3)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.next{margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:10px;font-size:13px}
.next b{color:var(--accent)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:600;color:var(--text-2)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}
.empty{padding:28px;text-align:center;color:var(--text-3)}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 32px));background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.dlg-h h3{margin:0;margin-right:auto}
.dlg-b{padding:16px 20px;max-height:65vh;overflow:auto;display:grid;gap:12px;grid-template-columns:1fr 1fr}
.dlg-f{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.fld{display:grid;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
@media (max-width:520px){.dlg-b{grid-template-columns:1fr}}
.fld label{font-size:12px;color:var(--text-2);font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 10px}
.fld textarea{min-height:72px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.fld.chk{display:flex;align-items:center;gap:8px;align-self:end}
.fld.chk input{width:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.lockbox{max-width:420px;margin:24px auto;text-align:center}
.lockbox input{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;margin-top:8px}
.secret{letter-spacing:2px}
.notice{padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.notice.info{background:var(--accent-soft);color:var(--accent)}
.section-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.section-head h2{margin:0;margin-right:auto}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hdr">
      <div class="brand">
        <div class="logo">BN</div>
        <div><b>브릿지노드 · 총괄 관리 대시보드</b><small id="today"></small></div>
      </div>
      <button class="btn sm" id="themeBtn" title="테마 전환">🌓 테마</button>
      <button class="btn sm" data-action="export">⬇ 백업</button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="overview" aria-selected="true">개요</button>
      <button class="tab" role="tab" data-tab="projects">프로젝트</button>
      <button class="tab" role="tab" data-tab="releases">출시·업데이트</button>
      <button class="tab" role="tab" data-tab="infra">도메인·서버</button>
      <button class="tab" role="tab" data-tab="vault">계정 보관함</button>
      <button class="tab" role="tab" data-tab="settings">백업·설정</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="tab-overview"></section>
  <section id="tab-projects" hidden></section>
  <section id="tab-releases" hidden></section>
  <section id="tab-infra" hidden></section>
  <section id="tab-vault" hidden></section>
  <section id="tab-settings" hidden></section>
</main>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <div class="dlg-h"><h3 id="dlgTitle"></h3><button class="icon-btn" value="cancel" aria-label="닫기">✕</button></div>
    <div class="dlg-b" id="dlgBody"></div>
    <div class="dlg-f"><button class="btn" value="cancel">취소</button><button class="btn primary" value="ok" id="dlgOk">저장</button></div>
  </form>
</dialog>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================
   브릿지노드 총괄 관리 대시보드
   - 데이터: 브라우저 localStorage (백업 JSON으로 내보내기/가져오기)
   - 계정 보관함: 마스터 비밀번호 기반 AES-GCM 암호화 (PBKDF2-SHA256)
   ========================================================= */
const STORE_KEY = 'bridgenode-dashboard-v1';
const THEME_KEY = 'bridgenode-theme';

const TRACKS = {
  mini: { label: '미니앱', color: 'var(--mini)', stages: ['기획', '디자인', '개발', '테스트', '플랫폼 심사', '출시'] },
  web:  { label: '웹앱',   color: 'var(--web)',  stages: ['기획', '디자인', '개발', '서버·도메인 연결', 'QA', '오픈'] },
  toss: { label: '토스 인앱', color: 'var(--toss)', stages: ['기획', '디자인(TDS)', 'SDK 연동 개발', '샌드박스 테스트', '검수 요청', '출시'] },
};
// 출시 이력 상태 (토스 콘솔/스토어 심사 흐름 기준)
const REL_STATUS = {
  prep:      { label: '준비중',   cls: 'b-mute' },
  requested: { label: '검수요청', cls: 'b-info' },
  review:    { label: '검수중',   cls: 'b-warn' },
  rejected:  { label: '반려',     cls: 'b-bad' },
  approved:  { label: '승인',     cls: 'b-acc' },
  released:  { label: '출시완료', cls: 'b-ok' },
};
const REL_KIND = { first: '최초 출시', update: '업데이트', hotfix: '핫픽스' };
const ACC_CAT = { toss: '토스 콘솔', domain: '도메인', server: '서버/호스팅', store: '스토어/플랫폼', dev: '개발도구', pay: '결제/PG', etc: '기타' };

/* ---------- utils ---------- */
const $ = (s, el = document) => el.querySelector(s);
const h = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const todayStr = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const daysUntil = (s) => { if (!s) return null; const t = new Date(s + 'T00:00:00'); const n = new Date(todayStr() + 'T00:00:00'); return Math.round((t - n) / 864e5); };
const fmtD = (s) => s ? s.replace(/-/g, '.') : '-';
const dday = (n) => n == null ? '' : n === 0 ? 'D-DAY' : n > 0 ? `D-${n}` : `D+${-n}`;
const ddayBadge = (s, warn = 60, bad = 30) => {
  const n = daysUntil(s); if (n == null) return '<span class="muted">-</span>';
  const cls = n < 0 ? 'b-bad' : n <= bad ? 'b-bad' : n <= warn ? 'b-warn' : 'b-ok';
  return `<span class="badge ${cls}">${n < 0 ? '만료 ' : ''}${dday(n)}</span>`;
};
const won = (n) => n ? Number(n).toLocaleString('ko-KR') + '원' : '-';
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2200); }
const safeLink = (u) => { if (!u) return '-'; const ok = /^https?:\/\//i.test(u); return ok ? `<a href="${h(u)}" target="_blank" rel="noopener">${h(u.replace(/^https?:\/\//, ''))}</a>` : h(u); };

/* ---------- state ---------- */
let state;
function sampleData() {
  const p1 = uid(), p2 = uid(), p3 = uid(), p4 = uid();
  const st = (type, n) => TRACKS[type].stages.map((label, i) => ({ label, done: i < n }));
  return {
    version: 1,
    meta: { company: '브릿지노드', updatedAt: new Date().toISOString(), sample: true },
    projects: [
      { id: p1, name: '동네가게 예약 (예시)', client: 'A상점', type: 'toss', hold: false, stages: st('toss', 6), startDate: '2026-07-01', dueDate: '2026-11-20', nextStep: 'v1.2.0 검수 결과 확인 후 출시 공지', serviceUrl: '', repoUrl: '', memo: '토스 콘솔 앱 ID 기입' },
      { id: p2, name: '포인트 적립 미니앱 (예시)', client: 'B브랜드', type: 'mini', hold: false, stages: st('mini', 3), startDate: '2026-09-15', dueDate: '2026-12-15', nextStep: '내부 테스트 시나리오 작성 및 QA 시작', serviceUrl: '', repoUrl: '', memo: '' },
      { id: p3, name: '회사 소개 웹앱 (예시)', client: 'C법인', type: 'web', hold: false, stages: st('web', 4), startDate: '2026-08-10', dueDate: '2026-11-10', nextStep: 'SSL 적용 확인 → QA 체크리스트 진행', serviceUrl: 'https://example.com', repoUrl: '', memo: '' },
      { id: p4, name: '쿠폰 이벤트 (예시)', client: 'D카페', type: 'toss', hold: false, stages: st('toss', 1), startDate: '2026-10-20', dueDate: '2027-01-31', nextStep: 'TDS 기반 화면 설계서 확정', serviceUrl: '', repoUrl: '', memo: '' },
    ],
    releases: [
      { id: uid(), projectId: p1, version: '1.0.0', kind: 'first', date: '2026-09-01', status: 'released', buildNo: '12', server: 'NCP Prod #1', note: '최초 출시' },
      { id: uid(), projectId: p1, version: '1.1.0', kind: 'update', date: '2026-10-02', status: 'released', buildNo: '18', server: 'NCP Prod #1', note: '예약 알림 추가' },
      { id: uid(), projectId: p1, version: '1.2.0', kind: 'update', date: '2026-10-28', status: 'review', buildNo: '23', server: 'NCP Prod #1', note: '결제 연동(토스페이) 추가' },
      { id: uid(), projectId: p3, version: '0.9.0', kind: 'first', date: '2026-10-25', status: 'prep', buildNo: '', server: 'Vercel', note: '스테이징 배포' },
    ],
    domains: [
      { id: uid(), name: 'example-shop.kr', registrar: '가비아', registeredAt: '2025-11-20', expiresAt: '2026-11-20', autoRenew: false, sslExpiresAt: '2026-12-01', projectId: p1, dns: 'Cloudflare', memo: '' },
      { id: uid(), name: 'example.com', registrar: '후이즈', registeredAt: '2024-03-02', expiresAt: '2027-03-02', autoRenew: true, sslExpiresAt: '2027-01-15', projectId: p3, dns: '후이즈 DNS', memo: '' },
    ],
    servers: [
      { id: uid(), name: 'NCP Prod #1', provider: '네이버클라우드', host: 'api.example-shop.kr', ip: '0.0.0.0', purpose: 'API 서버', plan: 'Standard 2vCPU/4GB', cost: 55000, renewAt: '2026-11-30', projectId: p1, consoleUrl: '', memo: '' },
      { id: uid(), name: 'Vercel', provider: 'Vercel', host: 'example.vercel.app', ip: '', purpose: '프론트 호스팅', plan: 'Pro', cost: 28000, renewAt: '2026-11-15', projectId: p3, consoleUrl: '', memo: '' },
    ],
    vault: null, // {salt, iv, ct} — 암호화된 계정 목록
  };
}
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { state = normalize(JSON.parse(raw)); return; } } catch (e) { console.warn(e); }
  state = sampleData();
}
function normalize(d) {
  return { version: 1, meta: d.meta || {}, projects: d.projects || [], releases: d.releases || [], domains: d.domains || [], servers: d.servers || [], vault: d.vault || null };
}
function save() {
  state.meta.updatedAt = new Date().toISOString();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { toast('브라우저 저장소에 저장하지 못했습니다. 백업 파일을 내보내 주세요.'); }
}
const projById = (id) => state.projects.find(p => p.id === id);
const projName = (id) => projById(id)?.name || '-';

/* ---------- 진행률 / 상태 계산 ---------- */
function progress(p) { const s = p.stages || []; return s.length ? Math.round(s.filter(x => x.done).length / s.length * 100) : 0; }
function projReleases(pid) { return state.releases.filter(r => r.projectId === pid).sort((a, b) => (b.date || '').localeCompare(a.date || '')); }
function latestRelease(pid) { return projReleases(pid)[0]; }
function releasedCount(pid) { return state.releases.filter(r => r.projectId === pid && r.status === 'released').length; }
function currentVersion(pid) { const r = projReleases(pid).find(x => x.status === 'released'); return r ? r.version : null; }
function updateLabel(pid) { const n = releasedCount(pid); return n === 0 ? '미출시' : n === 1 ? '최초 출시' : `${n - 1}차 업데이트`; }
function projStatus(p) {
  if (p.hold) return { key: 'hold', label: '보류', cls: 'b-mute' };
  const lr = latestRelease(p.id);
  if (lr && (lr.status === 'requested' || lr.status === 'review')) return { key: 'review', label: '검수중', cls: 'b-warn' };
  if (lr && lr.status === 'rejected') return { key: 'rejected', label: '반려 대응', cls: 'b-bad' };
  if (releasedCount(p.id) > 0 && progress(p) === 100) return { key: 'live', label: '출시·운영중', cls: 'b-ok' };
  if (!p.stages?.[0]?.done) return { key: 'planning', label: '기획중', cls: 'b-info' };
  return { key: 'progress', label: '진행중', cls: 'b-acc' };
}
function currentStage(p) { const s = (p.stages || []).find(x => !x.done); return s ? s.label : '완료'; }
const avg = (arr) => arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : 0;

/* ---------- 다음 절차(자동 집계) ---------- */
function nextActions() {
  const items = [];
  state.projects.filter(p => !p.hold).forEach(p => {
    const st = projStatus(p);
    if (p.nextStep) items.push({ icon: '▶', title: p.nextStep, sub: `${p.name} · 현재 단계: ${currentStage(p)}`, date: p.dueDate, tag: st });
    const lr = latestRelease(p.id);
    if (lr && ['requested', 'review'].includes(lr.status)) items.push({ icon: '⏳', title: `v${lr.version} 검수 결과 확인`, sub: `${p.name} · ${REL_STATUS[lr.status].label}`, date: lr.date, tag: { label: '검수', cls: 'b-warn' } });
    if (lr && lr.status === 'rejected') items.push({ icon: '⚠', title: `v${lr.version} 반려 사유 확인·수정 후 재요청`, sub: p.name, date: lr.date, tag: { label: '반려', cls: 'b-bad' } });
    if (lr && lr.status === 'approved') items.push({ icon: '🚀', title: `v${lr.version} 승인됨 → 출시 처리`, sub: p.name, date: lr.date, tag: { label: '승인', cls: 'b-acc' } });
  });
  state.domains.forEach(d => { const n = daysUntil(d.expiresAt); if (n != null && n <= 60) items.push({ icon: '🌐', title: `도메인 갱신: ${d.name}`, sub: `${d.registrar || ''}${d.autoRenew ? ' · 자동갱신 ON' : ' · 자동갱신 OFF'}`, date: d.expiresAt, tag: { label: dday(n), cls: n <= 30 ? 'b-bad' : 'b-warn' } });
    const s = daysUntil(d.sslExpiresAt); if (s != null && s <= 30) items.push({ icon: '🔒', title: `SSL 인증서 갱신: ${d.name}`, sub: '인증서 만료 임박', date: d.sslExpiresAt, tag: { label: dday(s), cls: 'b-bad' } }); });
  state.servers.forEach(s => { const n = daysUntil(s.renewAt); if (n != null && n <= 30) items.push({ icon: '🖥', title: `서버 결제/갱신: ${s.name}`, sub: `${s.provider || ''} · ${won(s.cost)}`, date: s.renewAt, tag: { label: dday(n), cls: n <= 7 ? 'b-bad' : 'b-warn' } }); });
  return items.sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999'));
}

/* ---------- 계정 보관함 (암호화) ---------- */
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let vaultKey = null, vaultItems = null, vaultSalt = null, lockTimer = null, revealed = new Set();
const PBKDF2_ITER = 310000;
async function deriveKey(pw, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: PBKDF2_ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function sealVault() {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, vaultKey, enc.encode(JSON.stringify(vaultItems)));

function upsert(arr, item) { if (!item.id) { item.id = uid(); arr.push(item); } else { const i = arr.findIndex(x => x.id === item.id); i >= 0 ? (arr[i] = item) : arr.push(item); } }

function saveProject(p) {
  const prev = projById(p.id);

    const doneCount = prev ? prev.stages.filter(s => s.done).length : 0;
    p.stages = TRACKS[p.type].stages.map((label, i) => ({ label, done: i < doneCount }));
  }
  upsert(state.projects, p); dropSample(); save(); renderAll(); toast('프로젝트를 저장했습니다.');
}

function importData(text) {
  let d; try { d = JSON.parse(text); } catch { toast('JSON 형식이 올바르지 않습니다.'); return; }
  if (Array.isArray(d.projects)) {
    if (!confirm('현재 데이터를 백업 파일 내용으로 교체할까요?')) return;
    lockVault(); state = normalize(d); save(); renderAll(); toast('백업을 복원했습니다.'); return;
  }
  if (Array.isArray(d.releases)) {
    let added = 0, updated = 0, skipped = 0;
    d.releases.forEach(r => {
      const p = r.projectId ? projById(r.projectId) : state.projects.find(x => x.name === r.projectName || x.name.replace(/\s*\(예시\)$/, '') === r.projectName);
      if (!p || !r.version) { skipped++; return; }
      const ex = state.releases.find(x => x.projectId === p.id && x.version === r.version);
      const rec = { kind: 'update', status: 'prep', date: todayStr(), buildNo: '', server: '', note: '', ...ex, ...r, projectId: p.id };
      delete rec.projectName;
      if (!REL_STATUS[rec.status]) rec.status = 'prep';
      if (ex) { Object.assign(ex, rec); updated++; } else { rec.id = uid(); state.releases.push(rec); added++; }
    });
    save(); renderAll(); toast(`이력 병합: 추가 ${added} · 갱신 ${updated}${skipped ? ` · 건너뜀 ${skipped}` : ''}`); return;
  }
  toast('알 수 없는 파일 형식입니다.');
}

  if (d.editAcc) { armLock(); return openForm('acc', vaultItems.find(x => x.id === d.editAcc), async a => { upsert(vaultItems, a); await sealVault(); renderVault(); toast('암호화하여 저장했습니다.'); }); }
  if (d.delAcc) { if (confirm('이 계정을 삭제할까요?')) { vaultItems = vaultItems.filter(x => x.id !== d.delAcc); await sealVault(); renderVault(); } return; }
  switch (d.action) {
    case 'add-proj': return openForm('proj', { type: projFilter !== 'all' ? projFilter : 'toss', startDate: todayStr() }, saveProject);
    case 'add-rel': if (!state.projects.length) return toast('프로젝트를 먼저 등록하세요.'); return openForm('rel', { kind: 'update', status: 'prep', date: todayStr() }, r => { upsert(state.releases, r); dropSample(); save(); renderAll(); });
    case 'add-dom': return openForm('dom', { autoRenew: false }, x => { upsert(state.domains, x); dropSample(); save(); renderAll(); });
    case 'add-srv': return openForm('srv', {}, x => { upsert(state.servers, x); dropSample(); save(); renderAll(); });
    case 'add-acc': armLock(); return openForm('acc', { category: 'toss' }, async a => { upsert(vaultItems, a); await sealVault(); renderVault(); toast('암호화하여 저장했습니다.'); });
    case 'lock': return lockVault('보관함을 잠갔습니다.');
    case 'export': return exportData();
    case 'import': return $('#fileIn').click();
    case 'clear-sample': if (confirm('프로젝트·출시이력·도메인·서버 데이터를 모두 비울까요? (계정 보관함은 유지)')) { state = { ...normalize({ vault: state.vault }), meta: {} }; save(); renderAll(); toast('비웠습니다. 실제 데이터를 등록하세요.'); } return;
    case 'load-sample': if (confirm('현재 데이터를 예시 데이터로 덮어쓸까요? (계정 보관함은 유지)')) { const v = state.vault; state = sampleData(); state.vault = v; save(); renderAll(); } return;
    case 'reset-vault': if (state.vault && confirm('계정 보관함을 완전히 삭제합니다. 되돌릴 수 없습니다. 계속할까요?')) { state.vault = null; save(); lockVault(); renderAll(); toast('보관함을 삭제했습니다.'); } return;
  }
});
document.addEventListener('change', (e) => {
  const s = e.target.closest('[data-rel-status]'); if (!s) return;
  const r = state.releases.find(x => x.id === s.dataset.relStatus); r.status = s.value; save(); renderAll(); toast(`상태: ${REL_STATUS[r.status].label}`);
});
document.addEventListener('submit', async (e) => {
  if (e.target.id === 'vaultCreate') {
    e.preventDefault(); const a = $('#vpw1').value, b = $('#vpw2').value;
    if (a.length < 10) return toast('10자 이상으로 설정하세요.');
    if (a !== b) return toast('비밀번호 확인이 일치하지 않습니다.');
    await createVault(a); renderVault(); toast('보관함을 만들었습니다.');
  } else if (e.target.id === 'vaultUnlock') {
    e.preventDefault();
    try { await unlockVault($('#vpw').value); renderVault(); } catch { toast('마스터 비밀번호가 올바르지 않습니다.'); $('#vpw').select(); }
  }
});
$('#fileIn').addEventListener('change', async (e) => { const f = e.target.files[0]; if (f) importData(await f.text()); e.target.value = ''; });
$('#themeBtn').addEventListener('click', () => {
  const root = document.documentElement; const cur = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  root.dataset.theme = cur === 'dark' ? 'light' : 'dark'; try { localStorage.setItem(THEME_KEY, root.dataset.theme); } catch {}
});
document.addEventListener('keydown', () => { if (vaultKey) armLock(); });

function renderAll() { renderOverview(); renderProjects(); renderReleases(); renderInfra(); renderVault(); renderSettings(); }

/* ---------- init ---------- */
try { const th = localStorage.getItem(THEME_KEY); if (th) document.documentElement.dataset.theme = th; } catch {}
$('#today').textContent = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }) + ' 기준';
load(); renderAll();
try { const tab = localStorage.getItem('bridgenode-tab'); if (tab && document.getElementById('tab-' + tab)) setTab(tab); } catch {}
</script>
</body>
</html>
