# ─── 숨결 안드로이드 앱 설정 ───
# applicationId 는 구글 플레이에 한 번 올리면 영원히 바꿀 수 없습니다.
applicationId=app.soomgyeol.breath
appName=숨결 호흡
launcherName=숨결
# 웹앱이 배포된 HTTPS 도메인 (https:// 없이). 배포 주소가 정해지면 바꾸고 다시 빌드하세요.
host=soomgyeol.onrender.com
# 앱을 열면 처음 보여줄 경로. src=android 로 앱 실행을 웹앱에 알립니다.
launchPath=/app?src=android
# 업로드할 때마다 versionCode 를 1씩 올려야 합니다.
versionCode=1
versionName=0.1.0
