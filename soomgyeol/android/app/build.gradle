plugins {
    id 'com.android.application'
}

def twa = new Properties()
file('../twa.properties').withReader('UTF-8') { twa.load(it) }

// 서명 정보는 저장소에 올리지 않는 keystore.properties 에서 읽습니다.
def signingProps = new Properties()
def signingFile = file('../keystore.properties')
if (signingFile.exists()) signingFile.withReader('UTF-8') { signingProps.load(it) }

def host = twa.getProperty('host')
def assetStatements = "[{\\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://${host}\\\"}}]"

android {
    namespace 'app.soomgyeol.breath'
    compileSdk 36

    defaultConfig {
        applicationId twa.getProperty('applicationId')
        minSdk 23
        targetSdk 36
        versionCode twa.getProperty('versionCode') as int
        versionName twa.getProperty('versionName')

        manifestPlaceholders = [
            hostName  : host,
            defaultUrl: "https://${host}${twa.getProperty('launchPath')}",
        ]
        resValue "string", "appName", twa.getProperty('appName')
        resValue "string", "launcherName", twa.getProperty('launcherName')
        resValue "string", "assetStatements", assetStatements
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signingProps.getProperty('storeFile'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
}
