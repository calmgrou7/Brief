[project]
name = "aegis-paper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.1", "httpx==0.28.1"]
[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3", "mypy==1.18.2"]
[tool.ruff]
line-length = 100
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
